			<h2>単位</h2>
			<p>流体力学では、SI単位が使用されます。使用する単位は次の<span class="ft">3</span>つです。</p>
			<p class="im"><img src="./../img/physics_unit.files/image001.png"></p>
			<p class="im">
				<table border="1" align="center">
					<tr>
						<th style="padding:5px;text-align:center;">単位</th>
						<th style="padding:5px;text-align:center;">読み</th>
						<th style="padding:5px;text-align:center;">意味</th>
					</tr>
					<tr>
						<td style="padding:5px;text-align:center;">[kg]</td>
						<td style="padding:5px;text-align:center;">キログラム</td>
						<td style="padding:5px;text-align:center;">質量</td>
					</tr>
					<tr>
						<td style="padding:5px;text-align:center;">[m]</td>
						<td style="padding:5px;text-align:center;">メートル</td>
						<td style="padding:5px;text-align:center;">距離、長さ</td>
					</tr>
					<tr>
						<td style="padding:5px;text-align:center;">[s]</td>
						<td style="padding:5px;text-align:center;">秒</td>
						<td style="padding:5px;text-align:center;">時間<span class="ft">(</span>秒数<span class="ft">)</span></td>
					</tr>
				</table>
			</p>
			<br>
			<p>力学的な物理量は、これら<span class="ft">3</span>つの物理量で定義されます。</p>
