name: Apply certified FEM 4 mixed image

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-fem-4-mixed.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Replace mixed image with HTML plus MathJax
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          page=Path('fem/fem_4.html')
          cfg=json.loads(Path('.document/formula_reviews/fem_4_image002_mixed.json').read_text(encoding='utf-8'))
          src='./../img/fem_tri_area.files/image002.png'

          raw=page.read_bytes()
          try: text=raw.decode('cp932'); enc='cp932'
          except UnicodeDecodeError: text=raw.decode('utf-8'); enc='utf-8'

          old_pat=re.compile(
            r'<p\b(?=[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'])[^>]*>\s*'
            r'<img\b[^>]*src=["\'][^"\']*fem_tri_area\.files/image002\.png["\'][^>]*>\s*</p>',
            flags=re.I|re.S)
          new_pat=re.compile(
            r'<div\b(?=[^>]*class=["\'][^"\']*\bmath-text-block\b[^"\']*["\'])'
            r'(?=[^>]*data-source-image=["\'][^"\']*fem_tri_area\.files/image002\.png["\'])[^>]*>.*?</div>\s*</div>',
            flags=re.I|re.S)

          if old_pat.search(text):
              before=old_pat.sub('<MIXED/>',text)
          elif new_pat.search(text):
              before=new_pat.sub('<MIXED/>',text)
          else:
              raise RuntimeError('image002 target not found')

          rules=[
            f'<p>\\({cfg["rules"][0]}\\)</p>',
            f'<p>\\({cfg["rules"][1]}\\)</p>',
            f'<p>\\({cfg["rules"][2]}\\)</p>',
            f'<p>\\({cfg["rules"][3]}\\)</p>',
          ]
          block=(
            f'<div class="math-text-block" id="formula-fem-4-002" data-source-image="{src}">\n'
            f'  <div class="math-text-equation" style="overflow-x:auto;max-width:100%;">\n'
            f'{cfg["display_formula"]}\n'
            f'  </div>\n'
            f'  <p>{cfg["prose"]}</p>\n'
            + '\n'.join('  '+x for x in rules) + '\n'
            f'</div>'
          )

          if old_pat.search(text):
              applied=old_pat.sub(block,text,count=1)
          else:
              applied=new_pat.sub(block,text,count=1)

          after=re.sub(
            r'<div\b(?=[^>]*class=["\'][^"\']*\bmath-text-block\b[^"\']*["\'])'
            r'(?=[^>]*data-source-image=["\'][^"\']*fem_tri_area\.files/image002\.png["\'])[^>]*>.*?</div>\s*</div>',
            '<MIXED/>',applied,count=1,flags=re.I|re.S)

          if re.sub(r'\s+',' ',before).strip()!=re.sub(r'\s+',' ',after).strip():
              raise RuntimeError('non-target content changed')

          if re.search(r'<img\b[^>]*src=["\'][^"\']*fem_tri_area\.files/image002\.png',applied,re.I):
              raise RuntimeError('image002 tag remains')
          if applied.count('data-source-image="./../img/fem_tri_area.files/image002.png"')!=1:
              raise RuntimeError('mixed block source mapping mismatch')

          page.write_bytes(applied.encode(enc))
          Path('.document/formula_reviews/FEM_4_MIXED_NORMAL_APPLY_RESULT.md').write_text(
            '# FEM 4 Mixed Normal Apply Result\n\n'
            '- Source image002 replaced by HTML prose + MathJax: PASS\n'
            '- Source image tag remaining: 0\n'
            '- Non-target content guard: PASS\n'
            f'- Encoding preserved: {enc}\n'
            '- Production deployment: not performed\n',
            encoding='utf-8')
          PY
      - name: Commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fem/fem_4.html .document/formula_reviews/FEM_4_MIXED_NORMAL_APPLY_RESULT.md
          git commit -m 'feat: replace FEM 4 determinant rules image with text'
          git push origin HEAD:develop
