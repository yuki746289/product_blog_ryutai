name: MPS Batch 1-2 Browser QA

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/mps-batch12-browser-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/mpsqa.log 2>&1 &
          sleep 2
      - name: QA
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          pages=["mps/mps_1.html","mps/mps_2.html"]
          vps={"desktop":{"width":1440,"height":1000},"mobile":{"width":390,"height":844}}
          rows=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              for vn,vp in vps.items():
                  c=b.new_context(viewport=vp)
                  for rel in pages:
                      pg=c.new_page()
                      errors=[]
                      pg.on("pageerror",lambda e,d=errors:d.append(str(e)))
                      res=pg.goto("http://127.0.0.1:8000/"+rel,wait_until="domcontentloaded",timeout=30000)
                      try:
                          pg.evaluate("async()=>{if(window.MathJax?.startup?.promise)await Promise.race([window.MathJax.startup.promise,new Promise(r=>setTimeout(r,8000))])}")
                      except Exception:
                          pass
                      pg.wait_for_timeout(500)
                      m=pg.evaluate("""() => {
                        const t=document.body?.innerText||'';
                        const blocks=[...document.querySelectorAll('.math-block')];
                        let unc=0,local=0;
                        for(const e of blocks){
                          if(e.scrollWidth>e.clientWidth+1){
                            local++;
                            const ox=getComputedStyle(e).overflowX;
                            if(ox!=='auto'&&ox!=='scroll') unc++;
                          }
                        }
                        return {
                          blocks:blocks.length,
                          merror:document.querySelectorAll('mjx-merror,.mjx-merror,.MathJax_Error').length,
                          unrendered:(t.match(/\\\(|\\\[|\\begin\s*\{/g)||[]).length,
                          overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                          uncontained:unc,
                          local:local,
                          formulaImages:[...document.images].filter(x=>(x.getAttribute('src')||'').includes('mps_')).length
                        };
                      }""")
                      row={"page":rel,"viewport":vn,"status":res.status if res else None,"errors":errors,**m}
                      rows.append(row)
                      pg.close()
                  c.close()
              b.close()
          bad=[r for r in rows if r["status"]!=200 or r["errors"] or r["blocks"]!=1 or r["merror"] or r["unrendered"] or r["overflow"] or r["uncontained"] or r["formulaImages"]]
          lines=["# MPS 1-2 Browser QA — 2026-09-19","",f"- Overall: **{'FAIL' if bad else 'PASS'}**","",
                 "| Page | Viewport | Blocks | MathJax | Unrendered | Overflow | Uncontained | Formula images |","|---|---|---:|---:|---:|---:|---:|---:|"]
          for r in rows:
              lines.append(f"| {r['page']} | {r['viewport']} | {r['blocks']} | {r['merror']} | {r['unrendered']} | {int(r['overflow'])} | {r['uncontained']} | {r['formulaImages']} |")
          open(".document/formula_reviews/MPS_1_2_NORMAL_BROWSER_QA_20260919.md","w",encoding="utf-8").write("\n".join(lines)+"\n")
          if bad:
              print(bad)
              raise SystemExit(1)
          print(rows)
          PY
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .document/formula_reviews/MPS_1_2_NORMAL_BROWSER_QA_20260919.md
          git commit -m "test: record MPS 1-2 browser QA [skip ci]" || exit 0
          git push origin HEAD:develop
