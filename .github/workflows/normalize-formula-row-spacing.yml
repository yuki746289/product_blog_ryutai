name: Normalize Formula Row Spacing

on:
  push:
    branches: [develop]
    paths:
      - '.document/qa_trigger/formula_row_spacing.trigger'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Normalize top-level multi-line formula row spacing
        run: python .document/tools/normalize_formula_row_spacing.py
      - name: Commit normalized formula spacing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' */'*.html' */*/'*.html' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No formula row spacing changes"
          else
            git commit -m "style: normalize multi-line formula row spacing [skip ci]"
            git push origin HEAD:develop
          fi
