name: Operator Alignment Audit

on:
  push:
    branches: [develop]
    paths:
      - '.document/qa_trigger/operator_alignment_audit.trigger'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Audit operator alignment
        id: audit
        continue-on-error: true
        run: python .document/tools/operator_alignment_audit.py
      - name: Commit audit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .document/formula_reviews/OPERATOR_ALIGNMENT_AUDIT_20260920.*
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "test: record operator alignment audit [skip ci]"
            git push origin HEAD:develop
          fi
      - name: Fail on remaining alignment issues
        if: steps.audit.outcome == 'failure'
        run: exit 1
