name: Apply certified Hydronamics batch 1 formulas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-hydronamics-batch-1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply certified formulas only
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          defs=[
            {
              'key':'hydronamics_14',
              'page':'hydronamics/hydronamics_14.html',
              'json':'.document/formula_reviews/hydronamics_14_formulas.json',
              'imgdir':'hydronamics_gauss.files',
              'diagrams':['001','002']
            },
            {
              'key':'hydronamics_8',
              'page':'hydronamics/hydronamics_8.html',
              'json':'.document/formula_reviews/hydronamics_8_formulas.json',
              'imgdir':'hydronamics_e_momentum.files',
              'diagrams':[]
            },
            {
              'key':'hydronamics_12_1',
              'page':'hydronamics/hydronamics_12_1.html',
              'json':'.document/formula_reviews/hydronamics_12_1_formulas.json',
              'imgdir':'hydronamics_dimensionless.files',
              'diagrams':[]
            },
            {
              'key':'hydronamics_4',
              'page':'hydronamics/hydronamics_4.html',
              'json':'.document/formula_reviews/hydronamics_4_formulas.json',
              'imgdir':'hydronamics_e_mass.files',
              'diagrams':['001']
            },
          ]

          mathjax4 = "\n\t<script>\n\twindow.MathJax={\n\t\toutput:{displayOverflow:'linebreak',linebreaks:{inline:true,width:'100%',lineleading:0.2}},\n\t\tchtml:{displayAlign:'left',displayIndent:'0'}\n\t};\n\t</script>\n\t<script defer src=\"https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js\"></script>\n"

          def strip_mathjax(text):
              text=re.sub(r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>','',text,flags=re.I|re.S)
              text=re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>','',text,flags=re.I|re.S)
              return text

          def add_mathjax(text):
              text=strip_mathjax(text)
              if '</head>' not in text:
                  raise RuntimeError('missing </head>')
              return text.replace('</head>',mathjax4+'</head>',1)

          summary=[]

          for d in defs:
              page=Path(d['page'])
              cfg=json.loads(Path(d['json']).read_text(encoding='utf-8'))
              imgdir=d['imgdir']
              display=[x for x in cfg['formulas'] if x.get('mode','display')!='inline']
              inline=[x for x in cfg['formulas'] if x.get('mode')=='inline']
              dnums=[x['image'][5:8] for x in display]
              inums=[x['image'][5:8] for x in inline]

              dalt='|'.join(dnums) if dnums else '(?!)'
              ialt='|'.join(inums) if inums else '(?!)'

              display_pat=re.compile(
                  rf'(?P<block><div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<bnum>{dalt})\.png["\'])[^>]*>.*?</div>)'
                  rf'|(?P<img><p\b(?=[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'])[^>]*>\s*<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{dalt})\.png["\'][^>]*>\s*</p>)',
                  flags=re.I|re.S)

              inline_pat=re.compile(
                  rf'(?P<span><span\b(?=[^>]*class=["\'][^"\']*\bmath-inline\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<snum>{ialt})\.png["\'])[^>]*>.*?</span>)'
                  rf'|(?P<img><img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{ialt})\.png["\'][^>]*>)',
                  flags=re.I|re.S)

              def guard(text):
                  text=strip_mathjax(text)
                  text=display_pat.sub('<DISPLAY_FORMULA/>',text)
                  text=inline_pat.sub('<INLINE_FORMULA/>',text)
                  return re.sub(r'\s+',' ',text).strip()

              raw=page.read_bytes()
              enc=None
              for candidate in ('cp932','utf-8'):
                  try:
                      original=raw.decode(candidate)
                      enc=candidate
                      break
                  except UnicodeDecodeError:
                      pass
              if enc is None:
                  raise RuntimeError(f'{page}: encoding failed')

              before=guard(original)

              dm=list(display_pat.finditer(original))
              dfound=[m.group('inum') or m.group('bnum') for m in dm]
              if dfound!=dnums:
                  raise RuntimeError(f'{page}: display sequence {dfound} != {dnums}')

              im=list(inline_pat.finditer(original))
              ifound=[m.group('inum') or m.group('snum') for m in im]
              if ifound!=inums:
                  raise RuntimeError(f'{page}: inline sequence {ifound} != {inums}')

              bynum={x['image'][5:8]:x for x in cfg['formulas']}
              dpos=[0]
              def drepl(_m):
                  n=dnums[dpos[0]]; dpos[0]+=1
                  return (
                      f'<div class="math-block" id="formula-{d["key"].replace("_","-")}-{n}" '
                      f'data-source-image="./../img/{imgdir}/image{n}.png">\n'
                      f'{bynum[n]["latex"]}\n</div>'
                  )

              ipos=[0]
              def irepl(_m):
                  n=inums[ipos[0]]; ipos[0]+=1
                  return (
                      f'<span class="math-inline" id="formula-{d["key"].replace("_","-")}-{n}" '
                      f'data-source-image="./../img/{imgdir}/image{n}.png">'
                      f'{bynum[n]["latex"]}</span>'
                  )

              applied=display_pat.sub(drepl,original)
              applied=inline_pat.sub(irepl,applied)
              applied=add_mathjax(applied)

              if guard(applied)!=before:
                  raise RuntimeError(f'{page}: non-formula content changed')

              dmapped=re.findall(
                  rf'<div\b[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'][^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
                  applied,flags=re.I)
              imapped=re.findall(
                  rf'<span\b[^>]*class=["\'][^"\']*\bmath-inline\b[^"\']*["\'][^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
                  applied,flags=re.I)
              if dmapped!=dnums:
                  raise RuntimeError(f'{page}: display mapped {dmapped} != {dnums}')
              if imapped!=inums:
                  raise RuntimeError(f'{page}: inline mapped {imapped} != {inums}')

              allnums=dnums+inums
              alt='|'.join(allnums)
              leftovers=re.findall(
                  rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?:{alt})\.png["\'][^>]*>',
                  applied,flags=re.I)
              if leftovers:
                  raise RuntimeError(f'{page}: target images remain {len(leftovers)}')

              diag_counts={}
              for n in d['diagrams']:
                  c=len(re.findall(
                      rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image{n}\.png["\'][^>]*>',
                      applied,flags=re.I))
                  if c!=1:
                      raise RuntimeError(f'{page}: diagram image{n} count {c} != 1')
                  diag_counts[n]=c

              page.write_bytes(applied.encode(enc))
              summary.append((d['page'],len(display),len(inline),enc,diag_counts))

          total=sum(x[1]+x[2] for x in summary)
          if total!=43:
              raise RuntimeError(f'total formulas {total} != 43')

          report=Path('.document/formula_reviews/HYDRONAMICS_BATCH_1_NORMAL_APPLY_RESULT.md')
          lines=[
              '# Hydronamics Batch 1 Normal Apply Result','',
              '- Certified formulas applied: **43 / 43**',
              '- Target formula image tags remaining: **0**',
              '- Classified diagrams preserved unchanged.',
              '- Non-formula content guards: **PASS**',
              '- MathJax: v4',
              '- Production deployment: not performed.','',
              '| Page | Display formulas | Inline formulas | Encoding | Preserved diagrams |',
              '|---|---:|---:|---|---|'
          ]
          for page,dc,ic,enc,diags in summary:
              ds=', '.join(f'image{k}' for k in diags) if diags else '-'
              lines.append(f'| `{page}` | {dc} | {ic} | {enc} | {ds} |')
          report.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('Hydronamics batch 1 PASS formulas=43 pages=4')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hydronamics/hydronamics_14.html \
                  hydronamics/hydronamics_8.html \
                  hydronamics/hydronamics_12_1.html \
                  hydronamics/hydronamics_4.html \
                  .document/formula_reviews/HYDRONAMICS_BATCH_1_NORMAL_APPLY_RESULT.md
          git commit -m 'feat: apply certified hydronamics batch 1 formulas'
          git push origin HEAD:develop
