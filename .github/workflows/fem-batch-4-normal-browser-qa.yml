name: FEM Batch 4 Normal Browser QA

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/fem-batch-4-normal-browser-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/femb4qa-http.log 2>&1 &
          sleep 1
      - name: QA
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          pages=[
            {'key':'fem_4','path':'fem/fem_4.html','imgdir':'fem_tri_area.files','count':4,'retained':['002']},
            {'key':'fem_9','path':'fem/fem_9.html','imgdir':'fem_coordinates.files','count':3,'retained':['003','005']},
            {'key':'fem_6_2_2','path':'fem/fem_6_2_2.html','imgdir':'fem_n_tet.files','count':3,'retained':[]},
            {'key':'fem_6_2_3','path':'fem/fem_6_2_3.html','imgdir':'fem_n_tet.files','count':3,'retained':[]},
            {'key':'fem_6_2_4','path':'fem/fem_6_2_4.html','imgdir':'fem_n_tet.files','count':3,'retained':[]},
            {'key':'fem_6_2_5','path':'fem/fem_6_2_5.html','imgdir':'fem_n_tet.files','count':3,'retained':[]},
          ]
          vps={'desktop':{'width':1440,'height':1000},'mobile':{'width':390,'height':844}}
          out=Path('fem-batch-4-normal-qa'); out.mkdir(exist_ok=True)
          rows=[]; failures=[]

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for pdef in pages:
              for vn,vp in vps.items():
                ctx=browser.new_context(viewport=vp,device_scale_factor=1)
                pg=ctx.new_page(); errs=[]
                pg.on('pageerror',lambda exc,s=errs:s.append(str(exc)))
                pg.goto(f'http://127.0.0.1:8000/{pdef["path"]}',wait_until='domcontentloaded',timeout=120000)
                pg.wait_for_function('() => window.MathJax && MathJax.startup && MathJax.startup.promise',timeout=60000)
                pg.evaluate('async()=>{await MathJax.startup.promise;}'); pg.wait_for_timeout(400)

                blocks=pg.locator(f'div.math-block[data-source-image*="{pdef["imgdir"]}/image"]')
                bc=blocks.count(); merror=pg.locator('mjx-merror').count()

                imgs=pg.locator(f'img[src*="{pdef["imgdir"]}/image"]')
                srcs=[imgs.nth(i).get_attribute('src') for i in range(imgs.count())]
                formula_imgs=[s for s in srcs if s and not any(f'image{n}.png' in s for n in pdef['retained'])]

                retained_counts={}
                for n in pdef['retained']:
                  retained_counts[n]=pg.locator(f'img[src*="{pdef["imgdir"]}/image{n}.png"]').count()

                unrendered=[]; local=[]; uncontained=[]
                for i in range(bc):
                  el=blocks.nth(i); src=el.get_attribute('data-source-image')
                  if el.locator('mjx-container').count()<1: unrendered.append(src)
                  dims=el.evaluate("e=>({clientWidth:e.clientWidth,scrollWidth:e.scrollWidth,overflowX:getComputedStyle(e).overflowX})")
                  if dims['scrollWidth']>dims['clientWidth']+1:
                    local.append(src)
                    if vn=='desktop' or dims['overflowX'] not in ('auto','scroll'):
                      uncontained.append(src)

                pd=pg.evaluate("()=>({clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth})")
                po=pd['scrollWidth']>pd['clientWidth']+2
                pg.screenshot(path=str(out/f'{pdef["key"]}_{vn}.png'),full_page=True,animations='disabled')

                row={'page':pdef['key'],'viewport':vn,'blocks':bc,'expected_blocks':pdef['count'],
                     'formula_images':formula_imgs,'retained_counts':retained_counts,'merror':merror,
                     'unrendered':unrendered,'local_scroll':local,'uncontained':uncontained,
                     'page_overflow':po,'page_errors':errs}
                rows.append(row)

                if bc!=pdef['count']: failures.append(f'{pdef["key"]} {vn}: blocks={bc}')
                if formula_imgs: failures.append(f'{pdef["key"]} {vn}: formula images remain {formula_imgs}')
                for n,c in retained_counts.items():
                  if c!=1: failures.append(f'{pdef["key"]} {vn}: retained image{n} count={c}')
                if merror or unrendered or uncontained or po or errs:
                  failures.append(f'{pdef["key"]} {vn}: render/layout failure')
                ctx.close()
            browser.close()

          status='PASS' if not failures else 'FAIL'
          (out/'manifest.json').write_text(json.dumps({'status':status,'rows':rows,'failures':failures},ensure_ascii=False,indent=2),encoding='utf-8')

          report=Path('.document/formula_reviews/FEM_BATCH_4_NORMAL_BROWSER_QA_20260918.md')
          L=[
            '# FEM Batch 4 Normal Browser QA — 2026-09-18','',
            f'- Overall: **{status}**',
            '- Viewports: desktop 1440x1000; mobile 390x844',
            '- Formula target: 19 MathJax blocks across 6 pages.','',
            '| Page | Viewport | Blocks | Formula images | MathJax errors | Local-scroll | Uncontained | Page overflow |',
            '|---|---|---:|---:|---:|---:|---:|---|'
          ]
          for r in rows:
            L.append(f"| {r['page']} | {r['viewport']} | {r['blocks']}/{r['expected_blocks']} | {len(r['formula_images'])} | {r['merror']} | {len(r['local_scroll'])} | {len(r['uncontained'])} | {'YES' if r['page_overflow'] else 'NO'} |")
          L += ['', '## Retained assets','']
          for r in rows:
            if r['viewport']=='desktop' and r['retained_counts']:
              L.append(f"- `{r['page']}`: {r['retained_counts']}")
          L += ['', '## Failures',''] + ([f'- {x}' for x in failures] if failures else ['- None.'])
          L += ['', '- Production deployment has not been performed.']
          report.write_text('\n'.join(L)+'\n',encoding='utf-8')
          if failures: raise SystemExit(1)
          PY
      - name: Commit report
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .document/formula_reviews/FEM_BATCH_4_NORMAL_BROWSER_QA_20260918.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record FEM batch 4 browser QA'
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fem-batch-4-normal-qa
          path: fem-batch-4-normal-qa
          retention-days: 7
