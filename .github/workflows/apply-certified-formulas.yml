name: Apply certified formulas to normal FEM pages

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-formulas.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply audited MathJax formulas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          ROOT = Path('.')

          def read_auto(path):
              data = Path(path).read_bytes()
              for enc in ('utf-8-sig', 'utf-8', 'cp932'):
                  try:
                      return data.decode(enc), enc
                  except UnicodeDecodeError:
                      pass
              raise RuntimeError(f'Cannot decode {path}')

          def read_cp932(path):
              return Path(path).read_bytes().decode('cp932')

          def write_cp932(path, text):
              Path(path).write_bytes(text.encode('cp932'))

          def remove_audit_note(text):
              text, n = re.subn(
                  r'\s*<p\s+id=["\']formula-conversion-note["\'][^>]*>.*?</p>',
                  '', text, flags=re.I | re.S)
              if n != 1:
                  raise RuntimeError(f'Expected one formula-conversion-note, got {n}')
              return text

          def strip_mathjax_head(text):
              text = re.sub(
                  r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>',
                  '', text, flags=re.I | re.S)
              text = re.sub(
                  r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>',
                  '', text, flags=re.I | re.S)
              return text

          def skeleton(text, imgdir):
              text = re.sub(
                  r'\s*<p\s+id=["\']formula-conversion-note["\'][^>]*>.*?</p>',
                  '', text, flags=re.I | re.S)
              text = strip_mathjax_head(text)
              text = re.sub(
                  r'<div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])[^>]*>.*?</div>',
                  '<FORMULA/>', text, flags=re.I | re.S)
              text = re.sub(
                  rf'<p\b[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'][^>]*>\s*'
                  rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image\d{{3}}\.png["\'][^>]*>\s*</p>',
                  '<FORMULA/>', text, flags=re.I | re.S)
              # Formatting differences from the generator are irrelevant here;
              # compare all non-formula markup/text token-for-token after whitespace collapse.
              return re.sub(r'\s+', ' ', text).strip()

          def formula_image_counts(text, imgdir):
              nums = re.findall(
                  rf'data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
                  text, flags=re.I)
              return Counter(nums)

          def remaining_img_tags(text, imgdir):
              return re.findall(
                  rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\'][^>]*>',
                  text, flags=re.I)

          def expected_counts(nums, repeats=None):
              c = Counter(nums)
              for n in (repeats or []):
                  c[n] += 1
              return c

          clone_specs = [
              {
                  'normal': 'fem/fem_6_2_6.html',
                  'strict': 'fem/fem_6_2_6_mathjax_audit.html',
                  'imgdir': 'fem_n_tet.files',
                  'expected': expected_counts([f'{i:03d}' for i in range(21, 33)]),
              },
              {
                  'normal': 'fem/fem_7_1_2.html',
                  'strict': 'fem/fem_7_1_2_reaudit.html',
                  'imgdir': 'fem_d_momentum_tri.files',
                  'expected': expected_counts([f'{i:03d}' for i in range(1, 43)], ['028', '032', '033']),
              },
              {
                  'normal': 'fem/fem_7_2_1.html',
                  'strict': 'fem/fem_7_2_1_reaudit.html',
                  'imgdir': 'fem_d_mass_tet.files',
                  'expected': expected_counts([f'{i:03d}' for i in range(1, 21)]),
              },
              {
                  'normal': 'fem/fem_7_2_2.html',
                  'strict': 'fem/fem_7_2_2_reaudit.html',
                  'imgdir': 'fem_d_momentum_tet.files',
                  'expected': expected_counts([f'{i:03d}' for i in range(1, 50)], ['031', '037']),
              },
          ]

          results = []

          for spec in clone_specs:
              normal = read_cp932(spec['normal'])
              strict, _ = read_auto(spec['strict'])

              if skeleton(normal, spec['imgdir']) != skeleton(strict, spec['imgdir']):
                  raise RuntimeError(
                      f"Non-formula structure differs between {spec['normal']} and {spec['strict']}; aborting")

              applied = remove_audit_note(strict)
              got = formula_image_counts(applied, spec['imgdir'])
              if got != spec['expected']:
                  raise RuntimeError(
                      f"Certified occurrence mismatch for {spec['normal']}: got={got}, expected={spec['expected']}")
              leftovers = remaining_img_tags(applied, spec['imgdir'])
              if leftovers:
                  raise RuntimeError(f"Target formula images remain in {spec['normal']}: {leftovers}")
              if 'mathjax@4/tex-mml-chtml.js' not in applied:
                  raise RuntimeError(f"MathJax 4 loader missing in {spec['strict']}")
              if "displayOverflow: 'linebreak'" not in applied:
                  raise RuntimeError(f"MathJax linebreak config missing in {spec['strict']}")

              write_cp932(spec['normal'], applied)
              results.append((spec['normal'], sum(got.values()), len(got)))

          # fem_7_1_1 is a dedicated side-by-side audit page, not a clone of the public page.
          normal_path = 'fem/fem_7_1_1.html'
          audit_path = 'fem/fem_7_1_1_reaudit.html'
          imgdir = 'fem_d_mass_tri.files'
          normal = read_cp932(normal_path)
          audit, _ = read_auto(audit_path)

          sections = {}
          for m in re.finditer(
              r'<section\b[^>]*id=["\']formula-(\d{3})["\'][^>]*>.*?'
              r'<div\s+class=["\']render["\']>\s*(.*?)\s*</div>.*?</section>',
              audit, flags=re.I | re.S):
              n, body = m.group(1), m.group(2).strip()
              sections[n] = body

          expected_711 = [f'{i:03d}' for i in range(1, 19)] + ['020', '021']
          if set(sections) != set(expected_711) or len(sections) != 20:
              raise RuntimeError(f'fem_7_1_1 certified extraction mismatch: {sorted(sections)}')

          def block(n):
              return (
                  f'<div class="math-block" id="formula-fem-7-1-1-{n}" '
                  f'data-source-image="./../img/{imgdir}/image{n}.png">\n'
                  f'{sections[n]}\n</div>'
              )

          # Replace the one legacy MathJax correction occupying the image002 position.
          normal, n_old = re.subn(
              r'<div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])'
              r'(?=[^>]*id=["\']fix-r-fem2d-mass-001["\'])[^>]*>.*?</div>',
              block('002'), normal, count=1, flags=re.I | re.S)
          if n_old != 1:
              raise RuntimeError(f'fem_7_1_1 image002 legacy block count={n_old}, expected=1')

          direct_seen = []
          def repl_direct(m):
              n = m.group(1)
              direct_seen.append(n)
              if n not in sections:
                  raise RuntimeError(f'Unexpected fem_7_1_1 image {n}')
              return block(n)

          normal, n_direct = re.subn(
              rf'<p\b[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'][^>]*>\s*'
              rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\'][^>]*>\s*</p>',
              repl_direct, normal, flags=re.I | re.S)

          expected_direct = Counter(n for n in expected_711 if n != '002')
          if n_direct != 19 or Counter(direct_seen) != expected_direct:
              raise RuntimeError(
                  f'fem_7_1_1 direct mapping mismatch: count={n_direct}, seen={Counter(direct_seen)}')

          # Standardize only the MathJax head setup; leave all article content untouched.
          normal = strip_mathjax_head(normal)
          mathjax4 = '''\n\t<script>\n\twindow.MathJax = {\n\t\ttex: {inlineMath: [['\\\\(', '\\\\)']], displayMath: [['\\\\[', '\\\\]']]},\n\t\toutput: {\n\t\t\tdisplayOverflow: 'linebreak',\n\t\t\tlinebreaks: {inline: true, width: '100%', lineleading: 0.2}\n\t\t},\n\t\tchtml: {displayAlign: 'left', displayIndent: '0'}\n\t};\n\t</script>\n\t<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>\n'''
          normal = normal.replace('</head>', mathjax4 + '</head>', 1)

          got711 = formula_image_counts(normal, imgdir)
          exp711 = expected_counts(expected_711)
          if got711 != exp711:
              raise RuntimeError(f'fem_7_1_1 occurrence mismatch: got={got711}, expected={exp711}')
          leftovers = remaining_img_tags(normal, imgdir)
          if leftovers:
              raise RuntimeError(f'fem_7_1_1 target formula images remain: {leftovers}')
          if 'mathjax@4/tex-mml-chtml.js' not in normal or 'mathjax@3/' in normal:
              raise RuntimeError('fem_7_1_1 MathJax loader standardization failed')

          # Explicitly guard the known source-oddity in image002: N1,N1,N3 must remain unchanged.
          if r'\begin{bmatrix}N_1\\N_1\\N_3\end{bmatrix}' not in sections['002']:
              raise RuntimeError('fem_7_1_1 image002 source-faithful N1,N1,N3 guard failed')

          write_cp932(normal_path, normal)
          results.append((normal_path, sum(got711.values()), len(got711)))

          # Final cross-page validation after writes.
          total_occ = 0
          total_unique = 0
          for path, occ, uniq in results:
              reread = read_cp932(path)
              if 'mathjax@4/tex-mml-chtml.js' not in reread:
                  raise RuntimeError(f'MathJax 4 missing after write: {path}')
              total_occ += occ
              total_unique += uniq

          report = Path('.document/formula_reviews/NORMAL_PAGE_APPLY_RESULT.md')
          lines = [
              '# Normal Page Certified Formula Apply Result',
              '',
              '- Branch: `develop`',
              '- Source policy: audited source-image-faithful LaTeX only',
              '- Encoding of public pages: CP932 / Shift_JIS preserved',
              '- MathJax: v4, display overflow line breaking enabled',
              '',
              '| Page | Formula placements | Unique source images | Status |',
              '|---|---:|---:|---|',
          ]
          for path, occ, uniq in results:
              lines.append(f'| `{path}` | {occ} | {uniq} | PASS |')
          lines += [
              '',
              f'- Total placements: **{total_occ}**',
              f'- Total unique source formulas: **{total_unique}**',
              '- Target formula `<img>` tags remaining on these five pages: **0**',
              '- `fem_7_1_1` image002 source guard (`N1,N1,N3`): **PASS**',
              '',
              'Next: browser QA on desktop/mobile before production deployment.',
          ]
          report.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          print('\n'.join(f'{p}: placements={o}, unique={u}' for p, o, u in results))
          print(f'TOTAL placements={total_occ}, unique={total_unique}')
          PY

      - name: Show diff summary
        run: |
          git diff --stat
          git diff --check

      - name: Commit applied formulas
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fem/fem_6_2_6.html \
            fem/fem_7_1_1.html \
            fem/fem_7_1_2.html \
            fem/fem_7_2_1.html \
            fem/fem_7_2_2.html \
            .document/formula_reviews/NORMAL_PAGE_APPLY_RESULT.md
          git commit -m 'feat: apply certified MathJax formulas to FEM pages'
          git push origin HEAD:develop
