name: Apply certified formulas to normal FEM pages

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-formulas.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply audited MathJax formulas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          def read_auto(path):
              data = Path(path).read_bytes()
              for enc in ('utf-8-sig', 'utf-8', 'cp932'):
                  try:
                      return data.decode(enc), enc
                  except UnicodeDecodeError:
                      pass
              raise RuntimeError(f'Cannot decode {path}')

          def read_cp932(path):
              return Path(path).read_bytes().decode('cp932')

          def write_cp932(path, text):
              Path(path).write_bytes(text.encode('cp932'))

          def strip_mathjax_head(text):
              text = re.sub(
                  r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>',
                  '', text, flags=re.I | re.S)
              text = re.sub(
                  r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>',
                  '', text, flags=re.I | re.S)
              return text

          MATHJAX4 = '''\n\t<script>\n\twindow.MathJax = {\n\t\ttex: {inlineMath: [['\\\\(', '\\\\)']], displayMath: [['\\\\[', '\\\\]']]},\n\t\toutput: {\n\t\t\tdisplayOverflow: 'linebreak',\n\t\t\tlinebreaks: {inline: true, width: '100%', lineleading: 0.2}\n\t\t},\n\t\tchtml: {displayAlign: 'left', displayIndent: '0'}\n\t};\n\t</script>\n\t<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>\n'''

          def standardize_mathjax(text):
              text = strip_mathjax_head(text)
              if '</head>' not in text:
                  raise RuntimeError('Missing </head>')
              return text.replace('</head>', MATHJAX4 + '</head>', 1)

          def expected_counts(nums, repeats=None):
              c = Counter(nums)
              for n in (repeats or []):
                  c[n] += 1
              return c

          def placement_pattern(imgdir):
              return re.compile(
                  r'(?P<block><div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])[^>]*>.*?</div>)'
                  r'|'
                  rf'(?P<img><p\b[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'][^>]*>\s*'
                  rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<num>\d{{3}})\.png["\'][^>]*>\s*</p>)',
                  flags=re.I | re.S)

          def extract_standard_certified(path, imgdir):
              text, _ = read_auto(path)
              pat = re.compile(
                  r'<div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])'
                  rf'(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<num>\d{{3}})\.png["\'])'
                  r'[^>]*>.*?</div>',
                  flags=re.I | re.S)
              out = []
              for m in pat.finditer(text):
                  out.append((m.group('num'), m.group(0)))
              if not out:
                  raise RuntimeError(f'No certified blocks found in {path}')
              return out

          def extract_711_certified(path, imgdir):
              text, _ = read_auto(path)
              out = []
              for m in re.finditer(
                  r'<section\b[^>]*id=["\']formula-(\d{3})["\'][^>]*>.*?'
                  r'<div\s+class=["\']render["\']>\s*(.*?)\s*</div>.*?</section>',
                  text, flags=re.I | re.S):
                  n, body = m.group(1), m.group(2).strip()
                  block = (
                      f'<div class="math-block" id="formula-fem-7-1-1-{n}" '
                      f'data-source-image="./../img/{imgdir}/image{n}.png">\n'
                      f'{body}\n</div>'
                  )
                  out.append((n, block))
              return out

          def structure_guard(text, imgdir):
              text = strip_mathjax_head(text)
              text = placement_pattern(imgdir).sub('<FORMULA/>', text)
              return re.sub(r'\s+', ' ', text).strip()

          def source_counts(text, imgdir):
              return Counter(re.findall(
                  rf'data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
                  text, flags=re.I))

          def remaining_img_tags(text, imgdir):
              return re.findall(
                  rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\'][^>]*>',
                  text, flags=re.I)

          def apply_page(normal_path, imgdir, certified, expected):
              normal = read_cp932(normal_path)
              before_guard = structure_guard(normal, imgdir)
              pat = placement_pattern(imgdir)
              placements = list(pat.finditer(normal))

              cert_nums = [n for n, _ in certified]
              if len(placements) != len(certified):
                  raise RuntimeError(
                      f'{normal_path}: placement count {len(placements)} != certified {len(certified)}; '
                      f'certified sequence={cert_nums}')

              # Anchored image positions must agree with the certified sequence. Legacy
              # MathJax blocks have no source-image metadata, so their identity is resolved
              # by their position between these image anchors.
              for i, (m, (cert_n, _)) in enumerate(zip(placements, certified), start=1):
                  known = m.group('num')
                  if known is None and m.group('block'):
                      dm = re.search(
                          rf'data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
                          m.group('block'), flags=re.I)
                      known = dm.group(1) if dm else None
                  if known is not None and known != cert_n:
                      raise RuntimeError(
                          f'{normal_path}: formula position {i} anchor image{known} '
                          f'!= certified image{cert_n}')

              idx = 0
              def repl(_m):
                  nonlocal idx
                  block = certified[idx][1]
                  idx += 1
                  return block

              applied = pat.sub(repl, normal)
              applied = standardize_mathjax(applied)

              if structure_guard(applied, imgdir) != before_guard:
                  raise RuntimeError(f'{normal_path}: non-formula content changed; aborting')

              got = source_counts(applied, imgdir)
              if got != expected:
                  raise RuntimeError(f'{normal_path}: source occurrence mismatch got={got}, expected={expected}')

              leftovers = remaining_img_tags(applied, imgdir)
              if leftovers:
                  raise RuntimeError(f'{normal_path}: target formula images remain {leftovers}')
              if 'mathjax@4/tex-mml-chtml.js' not in applied or 'mathjax@3/' in applied:
                  raise RuntimeError(f'{normal_path}: MathJax loader validation failed')
              if "displayOverflow: 'linebreak'" not in applied:
                  raise RuntimeError(f'{normal_path}: MathJax linebreak config missing')

              write_cp932(normal_path, applied)
              return sum(got.values()), len(got), cert_nums

          specs = [
              {
                  'normal': 'fem/fem_6_2_6.html',
                  'strict': 'fem/fem_6_2_6_mathjax_audit.html',
                  'imgdir': 'fem_n_tet.files',
                  'expected': expected_counts([f'{i:03d}' for i in range(21, 33)]),
                  'kind': 'standard',
              },
              {
                  'normal': 'fem/fem_7_1_1.html',
                  'strict': 'fem/fem_7_1_1_reaudit.html',
                  'imgdir': 'fem_d_mass_tri.files',
                  'expected': expected_counts([f'{i:03d}' for i in range(1, 19)] + ['020', '021']),
                  'kind': '711',
              },
              {
                  'normal': 'fem/fem_7_1_2.html',
                  'strict': 'fem/fem_7_1_2_reaudit.html',
                  'imgdir': 'fem_d_momentum_tri.files',
                  'expected': expected_counts([f'{i:03d}' for i in range(1, 43)], ['028', '032', '033']),
                  'kind': 'standard',
              },
              {
                  'normal': 'fem/fem_7_2_1.html',
                  'strict': 'fem/fem_7_2_1_reaudit.html',
                  'imgdir': 'fem_d_mass_tet.files',
                  'expected': expected_counts([f'{i:03d}' for i in range(1, 21)]),
                  'kind': 'standard',
              },
              {
                  'normal': 'fem/fem_7_2_2.html',
                  'strict': 'fem/fem_7_2_2_reaudit.html',
                  'imgdir': 'fem_d_momentum_tet.files',
                  'expected': expected_counts([f'{i:03d}' for i in range(1, 50)], ['031', '037']),
                  'kind': 'standard',
              },
          ]

          results = []
          for spec in specs:
              if spec['kind'] == '711':
                  certified = extract_711_certified(spec['strict'], spec['imgdir'])
                  expected_seq = [f'{i:03d}' for i in range(1, 19)] + ['020', '021']
                  if [n for n, _ in certified] != expected_seq:
                      raise RuntimeError(f"{spec['strict']}: sequence mismatch {[n for n, _ in certified]}")
                  image002 = dict(certified)['002']
                  if r'\begin{bmatrix}N_1\\N_1\\N_3\end{bmatrix}' not in image002:
                      raise RuntimeError('fem_7_1_1 image002 N1,N1,N3 source guard failed')
              else:
                  certified = extract_standard_certified(spec['strict'], spec['imgdir'])

              cert_count = Counter(n for n, _ in certified)
              if cert_count != spec['expected']:
                  raise RuntimeError(
                      f"{spec['strict']}: certified occurrence mismatch got={cert_count}, expected={spec['expected']}")

              occ, uniq, seq = apply_page(
                  spec['normal'], spec['imgdir'], certified, spec['expected'])
              results.append((spec['normal'], occ, uniq))
              print(f"{spec['normal']}: PASS placements={occ}, unique={uniq}")

          total_occ = sum(x[1] for x in results)
          total_unique = sum(x[2] for x in results)
          if total_occ != 148 or total_unique != 143:
              raise RuntimeError(f'Global count mismatch placements={total_occ}, unique={total_unique}')

          report = Path('.document/formula_reviews/NORMAL_PAGE_APPLY_RESULT.md')
          lines = [
              '# Normal Page Certified Formula Apply Result',
              '',
              '- Branch: `develop`',
              '- Source policy: audited source-image-faithful LaTeX only',
              '- Replacement scope: formula placements and MathJax head setup only',
              '- Non-formula content guard: PASS on all five pages',
              '- Encoding of public pages: CP932 / Shift_JIS preserved',
              '- MathJax: v4, display overflow line breaking enabled',
              '',
              '| Page | Formula placements | Unique source images | Status |',
              '|---|---:|---:|---|',
          ]
          for path, occ, uniq in results:
              lines.append(f'| `{path}` | {occ} | {uniq} | PASS |')
          lines += [
              '',
              f'- Total placements: **{total_occ}**',
              f'- Total unique source formulas: **{total_unique}**',
              '- Target formula `<img>` tags remaining on these five pages: **0**',
              '- `fem_7_1_1` image002 source guard (`N1,N1,N3`): **PASS**',
              '',
              'Next: browser QA on desktop/mobile before production deployment.',
          ]
          report.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'TOTAL: PASS placements={total_occ}, unique={total_unique}')
          PY

      - name: Show diff summary
        run: |
          git diff --stat
          git diff --check

      - name: Commit applied formulas
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            fem/fem_6_2_6.html \
            fem/fem_7_1_1.html \
            fem/fem_7_1_2.html \
            fem/fem_7_2_1.html \
            fem/fem_7_2_2.html \
            .document/formula_reviews/NORMAL_PAGE_APPLY_RESULT.md
          git commit -m 'feat: apply certified MathJax formulas to FEM pages'
          git push origin HEAD:develop
