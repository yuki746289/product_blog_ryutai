name: Convert FEM 7.2.1 MathJax

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/convert-fem-7-2-1-mathjax.yml'
      - '.github/scripts/convert-fem-7-2-1-mathjax.py'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Convert formulas
        run: python3 .github/scripts/convert-fem-7-2-1-mathjax.py

      - name: Static validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('fem/fem_7_2_1.html').read_bytes().decode('cp932')
          assert 'charset=shift_jis' in text.lower()
          assert 'tex-mml-chtml.js' in text
          assert text.count('class="math-block"') == 20
          assert text.count('data-source-image="./../img/fem_d_mass_tet.files/image') == 20
          assert len(re.findall(r'id="formula-fem-7-2-1-\d{3}"', text)) == 20
          assert 'id="fix-r-fem3d-mass-001"' in text
          for n in range(1, 21):
              src = f'./../img/fem_d_mass_tet.files/image{n:03d}.png'
              assert not re.search(r'<img\b[^>]*\bsrc=["\']' + re.escape(src) + r'["\']', text, re.I), src
          for token in [
              '\\frac{1}{Ma^2}', '[C_x]', '[C_y]', '[C_z]',
              '\\{P\\}^{\\tau+\\Delta\\tau}', '\\{P\\}^{\\tau}',
              '\\frac{V}{20}', '\\frac1{24}', 'c_{4z}'
          ]:
              assert token in text, token
          print('Static validation passed.')
          PY

      - name: Browser rendering validation
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/fem721-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          mkdir -p /tmp/fem721

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,1200 --virtual-time-budget=9000 \
            --dump-dom \
            'http://127.0.0.1:8000/fem/fem_7_2_1.html#formula-fem-7-2-1-013' \
            > /tmp/fem721/mobile-dom.html
          grep -q '<mjx-container' /tmp/fem721/mobile-dom.html
          test "$(grep -o '<mjx-container' /tmp/fem721/mobile-dom.html | wc -l)" -ge 20

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,1200 --virtual-time-budget=9000 \
            --screenshot=/tmp/fem721/mobile-integral.png \
            'http://127.0.0.1:8000/fem/fem_7_2_1.html#formula-fem-7-2-1-013'
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1365,1000 --virtual-time-budget=9000 \
            --screenshot=/tmp/fem721/desktop-top.png \
            'http://127.0.0.1:8000/fem/fem_7_2_1.html'
          test -s /tmp/fem721/mobile-integral.png
          test -s /tmp/fem721/desktop-top.png

      - name: Commit converted page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fem/fem_7_2_1.html
          git commit -m "feat: convert tetrahedral mass discretization to MathJax"
          git push origin HEAD:develop

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: fem-7-2-1-mathjax
          path: /tmp/fem721/*.png
          retention-days: 7
