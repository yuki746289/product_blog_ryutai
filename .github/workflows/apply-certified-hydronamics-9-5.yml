name: Apply certified Hydronamics 9_5 formulas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-hydronamics-9-5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply certified formulas only
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          page=Path('hydronamics/hydronamics_9_5.html')
          cfg=json.loads(Path('.document/formula_reviews/hydronamics_9_5_formulas.json').read_text(encoding='utf-8'))
          imgdir='hydronamics_shear_value.files'
          nums=[x['image'][5:8] for x in cfg['formulas']]
          bynum={x['image'][5:8]:x for x in cfg['formulas']}

          mathjax4 = """
          <script>
          window.MathJax={
            output:{displayOverflow:'linebreak',linebreaks:{inline:true,width:'100%',lineleading:0.2}},
            chtml:{displayAlign:'left',displayIndent:'0'}
          };
          </script>
          <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
          """

          raw=page.read_bytes(); enc=None
          for candidate in ('cp932','utf-8'):
            try:
              original=raw.decode(candidate); enc=candidate; break
            except UnicodeDecodeError:
              pass
          if enc is None: raise RuntimeError('encoding failed')

          def strip_mathjax(text):
            text=re.sub(r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>','',text,flags=re.I|re.S)
            text=re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>','',text,flags=re.I|re.S)
            return text

          def old_pat(n):
            return re.compile(
              rf'<p\b(?=[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'])[^>]*>\s*'
              rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image{n}\.png["\'][^>]*>\s*</p>',
              flags=re.I|re.S)

          def new_pat(n):
            return re.compile(
              rf'<div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])'
              rf'(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image{n}\.png["\'])[^>]*>.*?</div>',
              flags=re.I|re.S)

          def skeleton(text):
            text=strip_mathjax(text)
            for n in nums:
              text=new_pat(n).sub('<FORMULA/>',text)
              text=old_pat(n).sub('<FORMULA/>',text)
            return re.sub(r'\s+',' ',text).strip()

          before=skeleton(original)
          applied=original
          for n in nums:
            if new_pat(n).search(applied): continue
            p=old_pat(n)
            if len(p.findall(applied))!=1: raise RuntimeError(f'image{n}: source wrapper count != 1')
            block=(f'<div class="math-block" id="formula-hydronamics-9-5-{n}" '
                   f'data-source-image="./../img/{imgdir}/image{n}.png">\n'
                   f'{bynum[n]["latex"]}\n</div>')
            applied=p.sub(lambda _m, block=block: block,applied,count=1)

          applied=strip_mathjax(applied)
          if '</head>' not in applied: raise RuntimeError('missing head')
          applied=applied.replace('</head>',mathjax4+'</head>',1)
          if skeleton(applied)!=before: raise RuntimeError('non-formula content changed')

          for n in nums:
            if len(new_pat(n).findall(applied))!=1: raise RuntimeError(f'image{n}: math block count != 1')
            if re.search(rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image{n}\.png["\'][^>]*>',applied,flags=re.I):
              raise RuntimeError(f'image{n}: target image remains')

          diagram_count=len(re.findall(
              rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image001\.png["\'][^>]*>',
              applied,flags=re.I))
          if diagram_count != 1:
            raise RuntimeError(f'diagram count {diagram_count} != 1')

          page.write_bytes(applied.encode(enc))
          Path('.document/formula_reviews/HYDRONAMICS_9_5_NORMAL_APPLY_RESULT.md').write_text(
            '# Hydronamics 9_5 Normal Apply Result\n\n'
            '- Certified formulas applied: **5 / 5**\n'
            '- Target formula image tags remaining: **0**\n'
            '- Diagram image001 preserved unchanged.\n'
            '- Non-formula content guard: **PASS**\n'
            '- MathJax: v4\n'
            '- Production deployment: not performed.\n',encoding='utf-8')
          print('PASS formulas=5 diagram=1 encoding='+enc)
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hydronamics/hydronamics_9_5.html .document/formula_reviews/HYDRONAMICS_9_5_NORMAL_APPLY_RESULT.md
          git commit -m 'feat: apply certified hydronamics 9_5 formulas'
          git pull --rebase origin develop
          git push origin HEAD:develop
