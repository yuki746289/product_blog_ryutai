# Created: 2026-09-19 09:50 JST
name: Final Site Browser QA

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.document/qa_trigger/final_site_browser_qa.trigger'

permissions:
  contents: write

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Record run id
        run: |
          mkdir -p .document/formula_reviews
          {
            echo "# Final Site Browser QA Run"
            echo
            echo "- run_id: $GITHUB_RUN_ID"
            echo "- head_sha: $GITHUB_SHA"
            echo "- date: 2026-09-19"
          } > .document/formula_reviews/FINAL_SITE_BROWSER_QA_RUN_20260919.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .document/formula_reviews/FINAL_SITE_BROWSER_QA_RUN_20260919.md
          git commit -m "test: record final browser QA run [skip ci]"
          git push origin HEAD:develop

  qa:
    name: qa-shard-${{ matrix.shard }}
    needs: probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start local server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/final-site-qa.log 2>&1 &
          sleep 2
      - name: Browser QA
        id: browser_qa
        continue-on-error: true
        run: |
          python .document/tools/final_site_browser_qa.py \
            --root . \
            --base-url http://127.0.0.1:8000 \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --output qa-results/shard-${{ matrix.shard }}.json
      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-site-qa-${{ matrix.shard }}
          path: qa-results/shard-${{ matrix.shard }}.json
          if-no-files-found: error
      - name: Mark shard failed
        if: steps.browser_qa.outcome == 'failure'
        run: exit 1

  summary:
    name: summary
    needs: qa
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Python dependency
        run: pip install playwright
      - name: Download shard results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: final-site-qa-*
          path: qa-results
          merge-multiple: true
      - name: Merge QA results
        id: merge
        continue-on-error: true
        run: |
          mkdir -p qa-results
          python .document/tools/final_site_browser_qa.py \
            --merge-dir qa-results \
            --expected-shards 4 \
            --expected-pages 205 \
            --report .document/formula_reviews/FINAL_SITE_BROWSER_QA_20260919.md
      - name: Commit QA report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp .document/formula_reviews/FINAL_SITE_BROWSER_QA_20260919.md /tmp/FINAL_SITE_BROWSER_QA_20260919.md
          git fetch origin develop
          git reset --hard origin/develop
          mkdir -p .document/formula_reviews
          cp /tmp/FINAL_SITE_BROWSER_QA_20260919.md .document/formula_reviews/FINAL_SITE_BROWSER_QA_20260919.md
          git add .document/formula_reviews/FINAL_SITE_BROWSER_QA_20260919.md
          if git diff --cached --quiet; then
            echo "No QA report change"
            exit 0
          fi
          git commit -m "test: record final site browser QA [skip ci]"
          git push origin HEAD:develop
      - name: Mark final QA failed
        if: steps.merge.outcome == 'failure'
        run: exit 1
