name: Apply certified Appendix 2 formulas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-appendix-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply certified formulas only
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          key='appendix_2'
          imgdir='appendix_sphere.files'
          target_nums=[f'{i:03d}' for i in range(2,13)]
          page=Path('appendix/appendix_2.html')
          cfg=json.loads(Path('.document/formula_reviews/appendix_2_formulas.json').read_text(encoding='utf-8'))

          seq=[x['image'][5:8] for x in cfg['formulas']]
          if seq!=target_nums:
              raise RuntimeError(f'certified sequence mismatch: {seq}')

          def strip_mathjax(text):
              text=re.sub(r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>','',text,flags=re.I|re.S)
              text=re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>','',text,flags=re.I|re.S)
              return text

          mathjax4 = "\n\t<script>\n\twindow.MathJax={\n\t\ttex:{inlineMath:[['\\\\(','\\\\)']],displayMath:[['\\\\[','\\\\]']]},\n\t\toutput:{displayOverflow:'linebreak',linebreaks:{inline:true,width:'100%',lineleading:0.2}},\n\t\tchtml:{displayAlign:'left',displayIndent:'0'}\n\t};\n\t</script>\n\t<script defer src=\"https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js\"></script>\n"

          def add_mathjax(text):
              text=strip_mathjax(text)
              if '</head>' not in text:
                  raise RuntimeError('missing </head>')
              return text.replace('</head>',mathjax4+'</head>',1)

          alt='|'.join(target_nums)
          pat=re.compile(
              rf'(?P<block><div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<bnum>{alt})\.png["\'])[^>]*>.*?</div>)'
              rf'|(?P<img><p\b[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'][^>]*>\s*<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{alt})\.png["\'][^>]*>\s*</p>)',
              flags=re.I|re.S)

          def guard(text):
              return re.sub(r'\s+',' ',pat.sub('<FORMULA/>',strip_mathjax(text))).strip()

          original=page.read_bytes().decode('cp932')
          before=guard(original)

          matches=list(pat.finditer(original))
          found=[m.group('inum') or m.group('bnum') for m in matches]
          if found!=target_nums:
              raise RuntimeError(f'normal formula sequence mismatch: {found}')

          blocks=[]
          for item in cfg['formulas']:
              n=item['image'][5:8]
              blocks.append(
                  f'<div class="math-block" id="formula-appendix-2-{n}" '
                  f'data-source-image="./../img/{imgdir}/image{n}.png">\n'
                  f'{item["latex"]}\n</div>'
              )

          pos=[0]
          def repl(_m):
              i=pos[0]
              pos[0]+=1
              return blocks[i]

          applied=add_mathjax(pat.sub(repl,original))

          if guard(applied)!=before:
              raise RuntimeError('non-formula content changed')

          mapped=re.findall(
              rf'data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
              applied,flags=re.I)
          if mapped!=target_nums:
              raise RuntimeError(f'mapped sequence mismatch: {mapped}')

          leftovers=re.findall(
              rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?:{alt})\.png["\'][^>]*>',
              applied,flags=re.I)
          if leftovers:
              raise RuntimeError('target formula image tags remain')

          # image001 is a mixed geometry diagram and must remain exactly once.
          diagram_count=len(re.findall(
              rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image001\.png["\'][^>]*>',
              applied,flags=re.I))
          if diagram_count!=1:
              raise RuntimeError(f'image001 diagram count {diagram_count} != 1')

          page.write_bytes(applied.encode('cp932'))

          report=Path('.document/formula_reviews/APPENDIX_2_NORMAL_APPLY_RESULT.md')
          report.write_text(
              '# Appendix 2 Normal Apply Result\n\n'
              '- Page: appendix/appendix_2.html\n'
              '- Certified formula placements applied: 11 / 11\n'
              '- Target formula image tags remaining: 0\n'
              '- Mixed geometry diagram image001 preserved: 1 / 1\n'
              '- Non-formula content guard: PASS\n'
              '- Encoding: CP932 / Shift_JIS preserved\n'
              '- MathJax: v4\n'
              '- Production deployment: not performed\n',
              encoding='utf-8')
          print('appendix_2 PASS formulas=11 image001 preserved=1')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appendix/appendix_2.html .document/formula_reviews/APPENDIX_2_NORMAL_APPLY_RESULT.md
          git commit -m 'feat: apply certified appendix 2 formulas'
          git push origin HEAD:develop
