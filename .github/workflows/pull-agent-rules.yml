# Created: 2026-09-15 20:35 JST
name: Pull Agent Rules

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/pull-agent-rules.yml'

permissions:
  contents: write

jobs:
  pull-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Fetch pull_rules.sh from product_agent_rules
        shell: bash
        run: |
          git clone --depth 1 https://github.com/yuki746289/product_agent_rules.git /tmp/product_agent_rules
          cp /tmp/product_agent_rules/pull_rules.sh /tmp/pull_rules.sh

      - name: Run pull_rules.sh and accept latest rule set
        shell: bash
        run: |
          { yes yes || true; } | bash /tmp/pull_rules.sh

      - name: Verify imported rules
        shell: bash
        run: |
          test -f .rules/dev/rules_dev.md
          test -f .rules/dev/app/rules_app_1_spec.md
          test -f .rules/rules_common.md
          test -f .rules/rules_execution_check.md
          git status --short
          git diff --stat

      - name: Commit imported rules
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .rules
          if git diff --cached --quiet; then
            echo 'No rule changes to commit.'
          else
            git commit -m "chore: import product agent rules v8"
            git push origin HEAD:develop
          fi
