# Created: 2026-09-19T09:05:00+09:00
name: Recover MPS source images from FTPS

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/mps-remote-source-recovery.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Recover referenced MPS images from production FTPS
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import re
          import sys
          from pathlib import Path, PurePosixPath
          from urllib.parse import urlparse

          server=os.environ.get("FTP_SERVER","").strip()
          username=os.environ.get("FTP_USERNAME","").strip()
          password=os.environ.get("FTP_PASSWORD","").strip()
          if not all((server,username,password)):
              raise SystemExit("FTP secrets are missing")

          if "://" in server:
              p=urlparse(server)
              host=p.hostname or ""
              port=p.port or 21
          else:
              parts=server.rsplit(":",1)
              if len(parts)==2 and parts[1].isdigit():
                  host,port=parts[0],int(parts[1])
              else:
                  host,port=server,21

          expected=[]
          img_re=re.compile(r'<img\b[^>]*src=["\']([^"\']+\.files/image\d+\.gif)["\']',re.I)
          for page in sorted(Path("mps").glob("mps_*.html")):
              text=page.read_bytes().decode("cp932",errors="replace")
              for src in img_re.findall(text):
                  rel=src.replace("\\","/").replace("./../","").lstrip("/")
                  expected.append((str(page),rel))
          # de-duplicate exact assets while preserving page mapping
          seen=set()
          refs=[]
          for page,rel in expected:
              key=(page,rel)
              if key not in seen:
                  refs.append((page,rel)); seen.add(key)

          out=Path("mps-remote-source-recovery")
          rec=out/"recovered"
          rec.mkdir(parents=True,exist_ok=True)

          ftp=ftplib.FTP_TLS(timeout=30)
          ftp.connect(host,port)
          ftp.login(username,password)
          ftp.prot_p()
          ftp.set_pasv(True)

          found=[]
          missing=[]
          errors=[]
          for page,rel in refs:
              dest=rec/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              try:
                  with dest.open("wb") as f:
                      ftp.retrbinary("RETR /"+rel, f.write)
                  if dest.stat().st_size <= 0:
                      raise RuntimeError("zero-byte response")
                  found.append((page,rel,dest.stat().st_size))
              except Exception as exc:
                  dest.unlink(missing_ok=True)
                  missing.append((page,rel))
                  errors.append((rel,type(exc).__name__,str(exc)))

          # Also list any remote MPS-related directories available directly under /img.
          remote_mps_entries=[]
          try:
              entries=[]
              ftp.retrlines("NLST /img", entries.append)
              remote_mps_entries=[x for x in entries if "mps" in x.lower()]
          except Exception as exc:
              errors.append(("/img listing",type(exc).__name__,str(exc)))

          try: ftp.quit()
          except Exception: pass

          by_page={}
          for page,rel in refs:
              by_page.setdefault(page,{"total":0,"found":0,"missing":0})
              by_page[page]["total"]+=1
          for page,rel,size in found: by_page[page]["found"]+=1
          for page,rel in missing: by_page[page]["missing"]+=1

          report=[
              "# MPS Remote Source Recovery — 2026-09-19","",
              "Production FTPS was accessed in read-only mode. No remote files were created, modified, or deleted.","",
              f"- Expected referenced GIF placements: **{len(refs)}**",
              f"- Recovered from FTPS: **{len(found)}**",
              f"- Still missing on FTPS: **{len(missing)}**",
              f"- Remote /img entries containing 'mps': **{len(remote_mps_entries)}**","",
              "## By page","",
              "| Page | Expected | Recovered | Missing |",
              "|---|---:|---:|---:|"
          ]
          for page,d in sorted(by_page.items()):
              report.append(f"| `{page}` | {d['total']} | {d['found']} | {d['missing']} |")
          report += ["","## Recovered assets",""]
          if found:
              for page,rel,size in found:
                  report.append(f"- `{rel}` ({size} bytes; referenced by `{page}`)")
          else:
              report.append("- None.")
          report += ["","## Still missing",""]
          if missing:
              for page,rel in missing:
                  report.append(f"- `{rel}` (referenced by `{page}`)")
          else:
              report.append("- None.")
          report += ["","## Remote /img MPS-like entries",""]
          report += [f"- `{x}`" for x in remote_mps_entries] if remote_mps_entries else ["- None."]
          report += ["","## Notes","",
              "- MPS formula-image references are now 0; image022 is represented by a user-approved inferred MathJax reconstruction.",
              "- Recovered files are kept in the workflow artifact until visually verified against page context.",
              "- Production deployment was not performed."
          ]
          Path(".document/formula_reviews/MPS_REMOTE_SOURCE_RECOVERY_20260919.md").write_text("\n".join(report)+"\n",encoding="utf-8")

          print(f"expected={len(refs)} found={len(found)} missing={len(missing)}")
          if len(refs) != 0:
              raise SystemExit(f"Expected 0 MPS image references but parsed {len(refs)}")
          PY

      - name: Upload recovered sources
        uses: actions/upload-artifact@v4
        with:
          name: mps-remote-source-recovery
          path: mps-remote-source-recovery
          retention-days: 7

      - name: Commit recovery report only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .document/formula_reviews/MPS_REMOTE_SOURCE_RECOVERY_20260919.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record MPS remote source recovery'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin develop
              if git push origin HEAD:develop; then exit 0; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 2
            done
          fi
