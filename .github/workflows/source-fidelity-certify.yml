name: Certify Source Fidelity

on:
  push:
    branches: [develop]
    paths:
      - '.document/qa_trigger/source_fidelity_certify.trigger'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Write reviewed source-fidelity fingerprints
        run: |
          python .document/tools/source_fidelity_fingerprints.py \
            --write .document/formula_reviews/SOURCE_FIDELITY_CERTIFICATION_20260920.json
      - name: Commit certification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .document/formula_reviews/SOURCE_FIDELITY_CERTIFICATION_20260920.json
          git commit -m "test: certify reviewed source fidelity [skip ci]"
          git push origin HEAD:develop
