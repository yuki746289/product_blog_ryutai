name: FEM 5 Normal Browser QA

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/fem-5-normal-browser-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/fem5qa-http.log 2>&1 &
          sleep 1

      - name: QA
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          imgdir='fem_tet_vol.files'
          nums=[f'{i:03d}' for i in range(1,8)]
          vps={'desktop':{'width':1440,'height':1000},'mobile':{'width':390,'height':844}}
          out=Path('fem-5-normal-qa'); out.mkdir(exist_ok=True)
          rows=[]; failures=[]

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for vn,vp in vps.items():
              ctx=browser.new_context(viewport=vp,device_scale_factor=1)
              pg=ctx.new_page(); errs=[]
              pg.on('pageerror',lambda exc,s=errs:s.append(str(exc)))
              pg.goto('http://127.0.0.1:8000/fem/fem_5.html',
                      wait_until='domcontentloaded',timeout=120000)
              pg.wait_for_function(
                  '() => window.MathJax && MathJax.startup && MathJax.startup.promise',
                  timeout=60000)
              pg.evaluate('async()=>{await MathJax.startup.promise;}')
              pg.wait_for_timeout(500)

              blocks=pg.locator(f'.math-block[data-source-image*="{imgdir}/image"]')
              bc=blocks.count()
              source_imgs=sum(pg.locator(f'img[src*="{imgdir}/image{n}.png"]').count() for n in nums)
              rich=pg.locator(f'section.formula-rich[data-source-image*="{imgdir}/image002.png"]')
              rich_count=rich.count()
              rich_text=rich.inner_text() if rich_count==1 else ''
              merror=pg.locator('mjx-merror').count()

              unrendered=[]; local=[]; uncontained=[]
              for i in range(bc):
                el=blocks.nth(i)
                src=el.get_attribute('data-source-image')
                if el.locator('mjx-container').count()<1:
                  unrendered.append(src)
                dims=el.evaluate(
                    "e=>({clientWidth:e.clientWidth,scrollWidth:e.scrollWidth,"
                    "overflowX:getComputedStyle(e).overflowX})")
                if dims['scrollWidth']>dims['clientWidth']+1:
                  local.append(src)
                  if vn=='desktop' or dims['overflowX'] not in ('auto','scroll'):
                    uncontained.append(src)

              pd=pg.evaluate(
                  "()=>({clientWidth:document.documentElement.clientWidth,"
                  "scrollWidth:document.documentElement.scrollWidth})")
              po=pd['scrollWidth']>pd['clientWidth']+2
              pg.screenshot(path=str(out/f'{vn}.png'),full_page=True,animations='disabled')

              row={
                'viewport':vn,'blocks':bc,'source_formula_images':source_imgs,
                'rich_blocks':rich_count,'rich_text_ok':('符号とすると' in rich_text and '互換であれば' in rich_text),
                'merror':merror,'unrendered':unrendered,'local_scroll':local,
                'uncontained':uncontained,'page_overflow':po,'page_errors':errs
              }
              rows.append(row)

              if bc!=7: failures.append(f'{vn}: blocks={bc}')
              if source_imgs!=0: failures.append(f'{vn}: source formula images={source_imgs}')
              if rich_count!=1: failures.append(f'{vn}: rich block count={rich_count}')
              if not row['rich_text_ok']: failures.append(f'{vn}: rich Japanese text missing')
              if merror or unrendered or uncontained or po or errs:
                failures.append(f'{vn}: render/layout failure')
              ctx.close()
            browser.close()

          status='PASS' if not failures else 'FAIL'
          (out/'manifest.json').write_text(
              json.dumps({'status':status,'rows':rows,'failures':failures},
                         ensure_ascii=False,indent=2),encoding='utf-8')

          report=Path('.document/formula_reviews/FEM_5_NORMAL_BROWSER_QA_20260918.md')
          L=[
            '# FEM 5 Normal Browser QA — 2026-09-18','',
            f'- Overall: **{status}**',
            '- Viewports: desktop 1440x1000; mobile 390x844',
            '- Target: 7 reconstructed mathematical content blocks.',
            '- image002: HTML Japanese prose + MathJax.','',
            '| Viewport | Blocks | Source images | Rich block | Japanese text | MathJax errors | Local-scroll | Uncontained | Page overflow |',
            '|---|---:|---:|---:|---|---:|---:|---:|---|'
          ]
          for r in rows:
            L.append(
              f"| {r['viewport']} | {r['blocks']}/7 | {r['source_formula_images']} | "
              f"{r['rich_blocks']}/1 | {'PASS' if r['rich_text_ok'] else 'FAIL'} | "
              f"{r['merror']} | {len(r['local_scroll'])} | {len(r['uncontained'])} | "
              f"{'YES' if r['page_overflow'] else 'NO'} |")
          L += ['', '## Failures',''] + (
              [f'- {x}' for x in failures] if failures else ['- None.'])
          L += ['', '- Production deployment has not been performed.']
          report.write_text('\n'.join(L)+'\n',encoding='utf-8')

          if failures:
            raise SystemExit(1)
          PY

      - name: Commit report
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .document/formula_reviews/FEM_5_NORMAL_BROWSER_QA_20260918.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record FEM 5 browser QA'
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fem-5-normal-qa
          path: fem-5-normal-qa
          retention-days: 7
