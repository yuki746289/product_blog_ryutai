name: Apply certified Heat 6 formulas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-heat-6.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply certified formulas only
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          page=Path('heat/heat_6.html')
          imgdir='heat_dimensionless.files'
          cfg=json.loads(Path('.document/formula_reviews/heat_6_formulas.json').read_text(encoding='utf-8'))
          expected=[f'{i:03d}' for i in range(1,14)]
          seq=[x['image'][5:8] for x in cfg['formulas']]
          if seq!=expected: raise RuntimeError(f'certified sequence mismatch: {seq}')

          display_nums=[x['image'][5:8] for x in cfg['formulas'] if x['mode']=='display']
          inline_nums=[x['image'][5:8] for x in cfg['formulas'] if x['mode']=='inline']
          if display_nums!=['001','002','003','004','005','007','008','009','011','012','013']:
              raise RuntimeError(display_nums)
          if inline_nums!=['006','010']:
              raise RuntimeError(inline_nums)

          def strip_mathjax(text):
              text=re.sub(r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>','',text,flags=re.I|re.S)
              text=re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>','',text,flags=re.I|re.S)
              return text

          mathjax4 = "\n\t<script>\n\twindow.MathJax={\n\t\toutput:{displayOverflow:'linebreak',linebreaks:{inline:true,width:'100%',lineleading:0.2}},\n\t\tchtml:{displayAlign:'left',displayIndent:'0'}\n\t};\n\t</script>\n\t<script defer src=\"https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js\"></script>\n"

          def add_mathjax(text):
              text=strip_mathjax(text)
              if '</head>' not in text: raise RuntimeError('missing </head>')
              return text.replace('</head>',mathjax4+'</head>',1)

          dalt='|'.join(display_nums)
          ialt='|'.join(inline_nums)

          display_pat=re.compile(
              rf'(?P<block><div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<bnum>{dalt})\.png["\'])[^>]*>.*?</div>)'
              rf'|(?P<img><p\b(?=[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'])[^>]*>\s*<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{dalt})\.png["\'][^>]*>\s*</p>)',
              flags=re.I|re.S)

          inline_pat=re.compile(
              rf'(?P<span><span\b(?=[^>]*class=["\'][^"\']*\bmath-inline\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<snum>{ialt})\.png["\'])[^>]*>.*?</span>)'
              rf'|(?P<img><img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{ialt})\.png["\'][^>]*>)',
              flags=re.I|re.S)

          def guard(text):
              text=strip_mathjax(text)
              text=display_pat.sub('<DISPLAY_FORMULA/>',text)
              text=inline_pat.sub('<INLINE_FORMULA/>',text)
              return re.sub(r'\s+',' ',text).strip()

          original=page.read_bytes().decode('cp932')
          before=guard(original)

          dmatches=list(display_pat.finditer(original))
          dfound=[m.group('inum') or m.group('bnum') for m in dmatches]
          if dfound!=display_nums: raise RuntimeError(f'display sequence mismatch: {dfound}')

          imatches=list(inline_pat.finditer(original))
          ifound=[m.group('inum') or m.group('snum') for m in imatches]
          if ifound!=inline_nums: raise RuntimeError(f'inline sequence mismatch: {ifound}')

          bynum={x['image'][5:8]:x for x in cfg['formulas']}

          dpos=[0]
          def drepl(_m):
              n=display_nums[dpos[0]]; dpos[0]+=1
              item=bynum[n]
              return (f'<div class="math-block" id="formula-heat-6-{n}" '
                      f'data-source-image="./../img/{imgdir}/image{n}.png">\n'
                      f'{item["latex"]}\n</div>')

          ipos=[0]
          def irepl(_m):
              n=inline_nums[ipos[0]]; ipos[0]+=1
              item=bynum[n]
              return (f'<span class="math-inline" id="formula-heat-6-{n}" '
                      f'data-source-image="./../img/{imgdir}/image{n}.png">'
                      f'{item["latex"]}</span>')

          applied=display_pat.sub(drepl,original)
          applied=inline_pat.sub(irepl,applied)
          applied=add_mathjax(applied)

          if guard(applied)!=before:
              raise RuntimeError('non-formula content changed')

          dmapped=re.findall(
              rf'<div\b[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'][^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
              applied,flags=re.I)
          imapped=re.findall(
              rf'<span\b[^>]*class=["\'][^"\']*\bmath-inline\b[^"\']*["\'][^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
              applied,flags=re.I)
          if dmapped!=display_nums: raise RuntimeError(f'display mapped mismatch: {dmapped}')
          if imapped!=inline_nums: raise RuntimeError(f'inline mapped mismatch: {imapped}')

          leftovers=re.findall(
              rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?:{"|".join(expected)})\.png["\'][^>]*>',
              applied,flags=re.I)
          if leftovers: raise RuntimeError(f'target images remain: {len(leftovers)}')

          page.write_bytes(applied.encode('cp932'))

          Path('.document/formula_reviews/HEAT_6_NORMAL_APPLY_RESULT.md').write_text(
              '# Heat 6 Normal Apply Result\n\n'
              '- Page: heat/heat_6.html\n'
              '- Certified formulas applied: 13 / 13\n'
              '- Display MathJax blocks: 11\n'
              '- Inline MathJax symbols: 2\n'
              '- Target formula image tags remaining: 0\n'
              '- Non-formula content guard: PASS\n'
              '- Encoding: CP932 / Shift_JIS preserved\n'
              '- MathJax: v4\n'
              '- Production deployment: not performed\n',
              encoding='utf-8')
          print('heat_6 PASS display=11 inline=2')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heat/heat_6.html .document/formula_reviews/HEAT_6_NORMAL_APPLY_RESULT.md
          git commit -m 'feat: apply certified heat 6 formulas'
          git push origin HEAD:develop
