name: MPS Postfix Browser QA

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/mps-postfix-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start server
        run: |
          python -m http.server 8000 --bind 127.0.0.1 >/tmp/mps-qa.log 2>&1 &
          sleep 2
      - name: Check MPS pages
        run: |
          cat > /tmp/mps_qa.py <<'PY'
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout
          pages={
            "mps/mps_1.html":1,
            "mps/mps_2.html":1,
            "mps/mps_3.html":12,
            "mps/mps_4.html":9,
            "mps/mps_5.html":2,
            "mps/mps_6_1.html":2,
            "mps/mps_6_2.html":21,
          }
          viewports={"desktop":{"width":1440,"height":1000},"mobile":{"width":390,"height":844}}
          rows=[]
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            for vn,vp in viewports.items():
              ctx=b.new_context(viewport=vp)
              for rel,expected in pages.items():
                pg=ctx.new_page(); errors=[]
                pg.on("pageerror",lambda e,d=errors:d.append(str(e)))
                pg.goto("http://127.0.0.1:8000/"+rel,wait_until="domcontentloaded",timeout=30000)
                try:
                  pg.evaluate("async()=>{if(window.MathJax?.startup?.promise)await Promise.race([window.MathJax.startup.promise,new Promise(r=>setTimeout(r,5000))])}")
                except Exception:
                  pass
                r=pg.evaluate("""() => {
                  const blocks=document.querySelectorAll('.math-block').length;
                  const inline=document.querySelectorAll('.formula-inline').length;
                  const text=document.body?.innerText||'';
                  const missing=[...document.images].filter(x=>!x.complete||x.naturalWidth===0).map(x=>x.getAttribute('src')||'');
                  const w=document.documentElement.clientWidth;
                  const overflow=document.documentElement.scrollWidth>w+2;
                  const uncontained=[...document.querySelectorAll('.math-block')].filter(e=>{
                    if(e.scrollWidth<=e.clientWidth+2)return false;
                    const ox=getComputedStyle(e).overflowX;
                    return ox!=='auto'&&ox!=='scroll';
                  }).length;
                  return {
                    formula:blocks+inline,
                    matherr:document.querySelectorAll('mjx-merror,.mjx-merror,.MathJax_Error').length,
                    unrendered:(text.match(/\\\\\(|\\\\\[|\\\\begin\s*\{/g)||[]).length,
                    overflow,uncontained,missing
                  };
                }""")
                bad=[]
                if r["formula"]!=expected: bad.append(f'formula {r["formula"]}/{expected}')
                if r["matherr"]: bad.append(f'matherr={r["matherr"]}')
                if r["unrendered"]: bad.append(f'unrendered={r["unrendered"]}')
                if r["overflow"]: bad.append('page-overflow')
                if r["uncontained"]: bad.append(f'uncontained={r["uncontained"]}')
                if rel=="mps/mps_6_2.html":
                  if r["missing"]!=["./../img/mps_fluid_count.files/image022.gif"]:
                    bad.append("missing="+str(r["missing"]))
                elif r["missing"]:
                  bad.append("missing="+str(r["missing"]))
                if errors: bad.append("pageerror="+str(errors))
                rows.append((rel,vn,r,bad))
                print(rel,vn,r,"issues=",bad)
                pg.close()
              ctx.close()
            b.close()
          bad=[x for x in rows if x[3]]
          print(f"checks={len(rows)} failures={len(bad)}")
          raise SystemExit(1 if bad else 0)
          PY
          python /tmp/mps_qa.py
