name: Production FTPS Deploy

on:
  push:
    branches: [develop]
    paths:
      - '.document/deploy/PRODUCTION_DEPLOY.trigger'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Upload public assets by FTPS with targeted cache refresh
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          PUBLIC_DIRS = {
              "appendix","book","column","counting","fem","fortran","heat",
              "hydronamics","introduce","library","link","mail","math","mesh",
              "mps","pdf","physics","profile","sitemap","css","js","img"
          }
          EXTS = {".html",".htm",".css",".js",".xml",".txt"}
          SKIP_SUFFIX = ("_mathjax_audit.html","_reaudit.html")
          CACHE_REFRESH_FILES = {
              "index.html",
              "footer.html",
              "ad.html",
              "ad_top.html",
              "ad_google.html",
              "js/site_ads_v1_6.js",
          }
          root = Path(".")
          candidates = []
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              rel = p.as_posix().lstrip("./")
              parts = Path(rel).parts
              if any(part.startswith(".") for part in parts):
                  continue
              if parts and parts[0] == "design_samples":
                  continue
              if rel.endswith(SKIP_SUFFIX):
                  continue
              if len(parts) > 1 and parts[0] not in PUBLIC_DIRS:
                  continue
              if p.suffix.lower() not in EXTS:
                  continue
              candidates.append(rel)
          candidates = sorted(set(candidates))

          server = os.environ.get("FTP_SERVER","").strip()
          username = os.environ.get("FTP_USERNAME","").strip()
          password = os.environ.get("FTP_PASSWORD","").strip()
          missing = [k for k,v in {
              "FTP_SERVER":server,"FTP_USERNAME":username,"FTP_PASSWORD":password
          }.items() if not v]
          if missing:
              raise SystemExit("Missing required FTPS secrets: " + ", ".join(missing))

          if "://" in server:
              u = urlparse(server)
              host = u.hostname or ""
              port = u.port or 21
          else:
              hp = server.rsplit(":",1)
              if len(hp)==2 and hp[1].isdigit():
                  host,port = hp[0],int(hp[1])
              else:
                  host,port = server,21
          if not host:
              raise SystemExit("Invalid FTP_SERVER")

          ftp = ftplib.FTP_TLS(timeout=30)
          uploaded = 0
          verified = 0
          cache_refreshed = 0
          created_dirs = set()
          try:
              ftp.connect(host,port)
              ftp.login(username,password)
              ftp.prot_p()
              ftp.set_pasv(True)
              login_root = ftp.pwd()

              def ensure_parent(rel):
                  parent = Path(rel).parent
                  ftp.cwd(login_root)
                  if str(parent) == ".":
                      return
                  current = []
                  for part in parent.parts:
                      if not part or part == ".":
                          continue
                      current.append(part)
                      try:
                          ftp.cwd(part)
                      except ftplib.error_perm as exc:
                          if not str(exc).startswith("550"):
                              raise
                          ftp.mkd(part)
                          created_dirs.add("/".join(current))
                          ftp.cwd(part)

              for rel in candidates:
                  ensure_parent(rel)

                  # Ninja Homepage can continue serving a cached object after an
                  # in-place STOR overwrite. For the small set of files involved
                  # in the AdSense migration, explicitly remove the old object
                  # immediately before uploading its replacement.
                  if rel in CACHE_REFRESH_FILES:
                      try:
                          ftp.delete(Path(rel).name)
                          cache_refreshed += 1
                          print(f"cache refresh delete: {rel}", flush=True)
                      except ftplib.error_perm as exc:
                          if not str(exc).startswith("550"):
                              raise

                  with open(rel,"rb") as fh:
                      ftp.storbinary("STOR " + Path(rel).name, fh, blocksize=262144)
                  uploaded += 1
                  if uploaded % 25 == 0 or uploaded == len(candidates):
                      print(f"upload progress: {uploaded}/{len(candidates)}", flush=True)

              ftp.voidcmd("TYPE I")
              for rel in candidates:
                  ftp.cwd(login_root)
                  try:
                      remote_size = ftp.size(rel)
                  except Exception:
                      remote_size = None
                  local_size = Path(rel).stat().st_size
                  if remote_size is None or int(remote_size) != int(local_size):
                      raise RuntimeError(
                          f"Remote verification failed for {rel}: local={local_size} remote={remote_size}"
                      )
                  verified += 1
                  if verified % 25 == 0 or verified == len(candidates):
                      print(f"verify progress: {verified}/{len(candidates)}", flush=True)

              print(f"FTPS upload complete: candidates={len(candidates)} uploaded={uploaded} verified={verified}")
              print(f"Remote directories created if missing: {len(created_dirs)}")
              print(f"Targeted cache-refresh replacements: {cache_refreshed}/{len(CACHE_REFRESH_FILES)}")
              print("Unrelated remote deletions: 0")
          finally:
              try:
                  ftp.quit()
              except Exception:
                  pass
          PY

      - name: HTTP content smoke test
        shell: bash
        run: |
          python3 - <<'PY'
          import time
          import urllib.request

          base = "https://ryutai.ninja-web.net/"
          checks = {
              "index.html": [
                  "2026.9.20 スマートフォン表示に対応し",
                  "<h2>サイトリニューアルについて</h2>",
                  "ChatGPT + GitHubの組み合わせで、コーディングは行っていません。",
                  'data-ad-slot="4832539076"',
                  'data-full-width-responsive="true"',
              ],
              "footer.html": ["site_ads_v1_6.js?v=20260920a"],
              "ad_top.html": ["Legacy compatibility endpoint."],
              "revision_history.html": ["<h2>2026-09-20</h2>"],
              "mps/mps_1.html": ['id="formula-mps-1-001"', r"\lt r_e"],
              "menu.html": ['href="./mps/mps.html"', "粒子法"],
              "js/site_home_cleanup_v1_6.js": [
                  "Renewal notice is now maintained directly in index.html"
              ],
              "css/site_font_size_v1_6.css": [
                  "calc((100% - 1080px) / 2)",
                  "text-align: center !important;",
              ],
          }

          def fetch(path):
              req = urllib.request.Request(base + path, headers={
                  "User-Agent":"Mozilla/5.0 production-smoke",
                  "Cache-Control":"no-cache, no-store, max-age=0",
                  "Pragma":"no-cache",
              })
              with urllib.request.urlopen(req, timeout=20) as res:
                  if res.status != 200:
                      raise RuntimeError(f"{path}: HTTP {res.status}")
                  return res.read().decode("utf-8")

          for attempt in range(1, 13):
              failures = []
              for path, needles in checks.items():
                  try:
                      body = fetch(path)
                      for needle in needles:
                          if needle not in body:
                              failures.append(f"{path}: missing {needle!r}")
                      if path == "index.html" and body.count("<h2>サイトリニューアルについて</h2>") != 1:
                          failures.append("index.html: renewal heading is not exactly one")
                      if path == "index.html" and "<h2>広告</h2>" in body:
                          failures.append("index.html: legacy advertisement heading remains")
                      if path == "index.html" and "ad_top.html" in body:
                          failures.append("index.html: legacy ad_top iframe remains")
                      if path == "index.html" and "show_ads.js" in body:
                          failures.append("index.html: legacy show_ads.js remains")
                      if path == "ad_top.html" and "pagead2.googlesyndication.com" in body:
                          failures.append("ad_top.html: legacy AdSense script remains")
                      if path == "js/site_home_cleanup_v1_6.js" and "registRenewalNotice" in body:
                          failures.append("site_home_cleanup_v1_6.js: duplicate renewal generator remains")
                  except Exception as exc:
                      failures.append(f"{path}: {type(exc).__name__}: {exc}")
              if not failures:
                  print("HTTP content smoke: PASS")
                  break
              if attempt == 12:
                  raise SystemExit("HTTP content smoke failed:\n" + "\n".join(failures))
              time.sleep(10)
          PY

      - name: Install Chromium for production browser smoke
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Production PC/mobile browser smoke
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          base = "https://ryutai.ninja-web.net/"
          targets = [
              "index.html",
              "revision_history.html",
              "mps/mps_1.html",
              "hydronamics/hydronamics_9_6.html",
              "fem/fem_7_1_2.html",
          ]
          viewports = {
              "desktop":{"width":1440,"height":1000},
              "mobile":{"width":390,"height":844},
          }
          failures=[]

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              try:
                  for label,vp in viewports.items():
                      ctx=browser.new_context(viewport=vp)
                      def route_handler(route):
                          u=urlparse(route.request.url)
                          if u.hostname in ("ryutai.ninja-web.net","cdn.jsdelivr.net") or not u.hostname:
                              route.continue_()
                          else:
                              route.abort()
                      ctx.route("**/*",route_handler)
                      try:
                          for rel in targets:
                              page=ctx.new_page()
                              page_errors=[]
                              page.on("pageerror",lambda e,d=page_errors:d.append(str(e)))
                              try:
                                  response=page.goto(base+rel,wait_until="domcontentloaded",timeout=30000)
                                  if not response or response.status != 200:
                                      failures.append(f"{label} {rel}: HTTP {response.status if response else 'none'}")
                                      continue
                                  try:
                                      page.wait_for_load_state("networkidle",timeout=3000)
                                  except PWTimeout:
                                      pass
                                  try:
                                      page.evaluate("""async()=> {
                                        if (window.MathJax?.startup?.promise) {
                                          await Promise.race([
                                            window.MathJax.startup.promise,
                                            new Promise(r=>setTimeout(r,8000))
                                          ]);
                                        }
                                      }""")
                                  except Exception:
                                      pass
                                  try:
                                      page.wait_for_function("""() => {
                                        const t=[...document.querySelectorAll('[data-source-image]')];
                                        return t.length===0 || t.every(e=>e.querySelector('mjx-container'));
                                      }""",timeout=8000)
                                  except PWTimeout:
                                      pass

                                  result=page.evaluate("""() => {
                                    const targets=[...document.querySelectorAll('[data-source-image]')];
                                    const localImgs=[...document.images].filter(img=>{
                                      try {
                                        const u=new URL(img.src,location.href);
                                        return u.hostname===location.hostname;
                                      } catch(e) { return false; }
                                    });
                                    return {
                                      mathErrors:document.querySelectorAll('mjx-merror,.mjx-merror,.MathJax_Error').length,
                                      unrendered:targets.filter(e=>!e.querySelector('mjx-container')).length,
                                      overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+2,
                                      missingImages:localImgs.filter(x=>!x.complete||x.naturalWidth===0).length,
                                      renewalCount:[...document.querySelectorAll('h2')].filter(h=>h.textContent.trim()==='サイトリニューアルについて').length,
                                      hasMpsText:(document.body?.innerText||'').includes('粒子法')
                                    };
                                  }""")
                                  if page_errors:
                                      failures.append(f"{label} {rel}: page errors={len(page_errors)}")
                                  if result["mathErrors"]:
                                      failures.append(f"{label} {rel}: MathJax errors={result['mathErrors']}")
                                  if result["unrendered"]:
                                      failures.append(f"{label} {rel}: unrendered={result['unrendered']}")
                                  if result["overflow"]:
                                      failures.append(f"{label} {rel}: page overflow")
                                  if result["missingImages"]:
                                      failures.append(f"{label} {rel}: missing local images={result['missingImages']}")
                                  if rel=="index.html" and result["renewalCount"]!=1:
                                      failures.append(f"{label} index.html: renewal headings={result['renewalCount']}")
                                  if rel=="index.html" and not result["hasMpsText"]:
                                      failures.append(f"{label} index.html: MPS menu text not present in rendered DOM")
                              finally:
                                  page.close()
                      finally:
                          ctx.close()
              finally:
                  browser.close()

          if failures:
              raise SystemExit("Production browser smoke failed:\n" + "\n".join(failures))
          print(f"Production browser smoke: PASS ({len(targets)} pages x {len(viewports)} viewports)")
          PY
