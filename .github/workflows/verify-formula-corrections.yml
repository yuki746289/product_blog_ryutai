name: Verify Formula Corrections

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/verify-formula-corrections.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Verify revision-history anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          history = Path('revision_history.html').read_bytes().decode('cp932')
          links = re.findall(r'href="\.(/fem/[^#"]+)#([^"]+)"', history)
          assert links
          for path, anchor in links:
              text = Path(path.lstrip('/')).read_bytes().decode('cp932')
              assert f'id="{anchor}"' in text, (path, anchor)
          print(f'Verified {len(links)} correction links.')
          PY

      - name: Verify MathJax rendering
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/verify-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=10000 --dump-dom \
            http://127.0.0.1:8000/fem/fem_7_1_2.html > /tmp/momentum-dom.html
          grep -q 'mjx-container' /tmp/momentum-dom.html
          grep -q 'fix-r-fem2d-mom-003' /tmp/momentum-dom.html

          mkdir -p /tmp/formula-verify
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=700,850 --virtual-time-budget=10000 \
            --screenshot=/tmp/formula-verify/corrected-integral.png \
            'http://127.0.0.1:8000/fem/fem_7_1_2.html#fix-r-fem2d-mom-003'
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=375,812 --virtual-time-budget=5000 \
            --screenshot=/tmp/formula-verify/history-mobile.png \
            http://127.0.0.1:8000/revision_history.html
          test -s /tmp/formula-verify/corrected-integral.png
          test -s /tmp/formula-verify/history-mobile.png

      - name: Upload verification screenshots
        uses: actions/upload-artifact@v4
        with:
          name: formula-correction-verification
          path: /tmp/formula-verify/*.png
          retention-days: 7
