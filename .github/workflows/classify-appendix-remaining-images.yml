name: Classify remaining appendix images

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/classify-appendix-remaining-images.yml'

jobs:
  contact-sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install pillow

      - name: Build page contact sheets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          from urllib.parse import unquote
          import html, re, shutil

          pages=[Path('appendix/appendix_2.html'),Path('appendix/appendix_3_1.html'),Path('appendix/appendix_3_2.html')]
          out=Path('appendix-remaining-review'); out.mkdir(exist_ok=True)
          font=ImageFont.load_default()
          img_re=re.compile(r'<img\b[^>]*src=["\']([^"\']+\.files/image\d+\.(?:png|gif|jpe?g))["\'][^>]*>',re.I)

          def read(path):
              b=path.read_bytes()
              for enc in ('utf-8','cp932'):
                  try:return b.decode(enc)
                  except UnicodeDecodeError:pass
              raise RuntimeError(path)

          for page in pages:
              text=read(page)
              refs=[]
              for src in img_re.findall(text):
                  src=unquote(html.unescape(src))
                  p=(page.parent/src).resolve().relative_to(Path('.').resolve())
                  if p.exists(): refs.append(p)
              if not refs: raise RuntimeError(f'no review images for {page}')
              page_out=out/page.stem; page_out.mkdir(parents=True,exist_ok=True)
              cards=[]; card_w=1200
              for idx,p in enumerate(refs,1):
                  im=Image.open(p).convert('RGB')
                  white=Image.new('RGB',im.size,'white'); white.paste(im)
                  shutil.copyfile(p,page_out/f'{idx:02d}_{p.name}')
                  inner=card_w-40; scale=min(1.0,inner/max(1,white.width))
                  fit=white.resize((max(1,int(white.width*scale)),max(1,int(white.height*scale))),Image.Resampling.LANCZOS)
                  card=Image.new('RGB',(card_w,fit.height+80),'white'); d=ImageDraw.Draw(card)
                  d.text((20,12),f'{page.as_posix()}  {p.as_posix()}',fill='black',font=font)
                  card.paste(fit,((card_w-fit.width)//2,50)); d.rectangle((0,0,card.width-1,card.height-1),outline='gray')
                  cards.append(card)
              h=sum(c.height for c in cards)+16*(len(cards)-1)
              sheet=Image.new('RGB',(card_w,h),'white'); y=0
              for c in cards: sheet.paste(c,(0,y)); y+=c.height+16
              sheet.save(out/f'{page.stem}_contact_sheet.png')
              print(page,len(refs))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: appendix-remaining-review
          path: appendix-remaining-review
          retention-days: 7
