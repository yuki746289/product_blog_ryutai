name: Apply certified Appendix coordinate formulas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-appendix-coordinate.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply certified formulas only
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          specs=[
              ('appendix_3_1','appendix_cord_r.files'),
              ('appendix_3_2','appendix_cord_s.files'),
          ]
          target_nums=['003','005','006','007','008','009','010','011']

          def strip_mathjax(text):
              text=re.sub(r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>','',text,flags=re.I|re.S)
              text=re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>','',text,flags=re.I|re.S)
              return text

          mathjax4 = "\n\t<script>\n\twindow.MathJax={\n\t\ttex:{inlineMath:[['\\\\(','\\\\)']],displayMath:[['\\\\[','\\\\]']]},\n\t\toutput:{displayOverflow:'linebreak',linebreaks:{inline:true,width:'100%',lineleading:0.2}},\n\t\tchtml:{displayAlign:'left',displayIndent:'0'}\n\t};\n\t</script>\n\t<script defer src=\"https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js\"></script>\n"

          def add_mathjax(text):
              text=strip_mathjax(text)
              if '</head>' not in text: raise RuntimeError('missing head')
              return text.replace('</head>',mathjax4+'</head>',1)

          results=[]
          for key,imgdir in specs:
              p=Path(f'appendix/{key}.html')
              cfg=json.loads(Path(f'.document/formula_reviews/{key}_formulas.json').read_text(encoding='utf-8'))
              seq=[x['image'][5:8] for x in cfg['formulas']]
              if seq!=target_nums: raise RuntimeError(f'{key}: certified sequence {seq}')

              alt='|'.join(target_nums)
              pat=re.compile(
                  rf'(?P<block><div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<bnum>{alt})\.png["\'])[^>]*>.*?</div>)'
                  rf'|(?P<img><p\b[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'][^>]*>\s*<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{alt})\.png["\'][^>]*>\s*</p>)',
                  flags=re.I|re.S)

              def guard(text):
                  return re.sub(r'\s+',' ',pat.sub('<FORMULA/>',strip_mathjax(text))).strip()

              original=p.read_bytes().decode('cp932')
              before=guard(original)
              placements=list(pat.finditer(original))
              found=[m.group('inum') or m.group('bnum') for m in placements]
              if found!=target_nums: raise RuntimeError(f'{key}: normal formula sequence {found}')

              blocks=[]
              for item in cfg['formulas']:
                  n=item['image'][5:8]
                  blocks.append(f'<div class="math-block" id="formula-{key.replace("_","-")}-{n}" data-source-image="./../img/{imgdir}/image{n}.png">\n{item["latex"]}\n</div>')
              pos=[0]
              def repl(_m):
                  i=pos[0]; pos[0]+=1; return blocks[i]
              applied=add_mathjax(pat.sub(repl,original))
              if guard(applied)!=before: raise RuntimeError(f'{key}: non-formula content changed')

              mapped=re.findall(rf'data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',applied,flags=re.I)
              if mapped!=target_nums: raise RuntimeError(f'{key}: mapped {mapped}')
              leftovers=re.findall(rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?:{alt})\.png["\'][^>]*>',applied,flags=re.I)
              if leftovers: raise RuntimeError(f'{key}: target formula images remain')

              # Diagram guards: image001, image002, image004 (image004 appears twice).
              for n,count in [('001',1),('002',1),('004',2)]:
                  actual=len(re.findall(rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image{n}\.png["\'][^>]*>',applied,flags=re.I))
                  if actual!=count: raise RuntimeError(f'{key}: diagram image{n} count {actual}!={count}')

              p.write_bytes(applied.encode('cp932'))
              results.append(key)
              print(key,'PASS formulas=8 diagrams preserved=4')

          report=Path('.document/formula_reviews/APPENDIX_COORDINATE_NORMAL_APPLY_RESULT.md')
          report.write_text(
              '# Appendix Coordinate Normal Apply Result\n\n'
              '- Pages: appendix_3_1.html, appendix_3_2.html\n'
              '- Certified formula placements applied: 16 / 16\n'
              '- Target formula image tags remaining: 0\n'
              '- Diagram placements preserved: 8 / 8\n'
              '- Non-formula content guard: PASS\n'
              '- Encoding: CP932 / Shift_JIS preserved\n'
              '- Production deployment: not performed\n',encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add appendix/appendix_3_1.html appendix/appendix_3_2.html .document/formula_reviews/APPENDIX_COORDINATE_NORMAL_APPLY_RESULT.md
          git commit -m 'feat: apply certified appendix coordinate formulas'
          git push origin HEAD:develop
