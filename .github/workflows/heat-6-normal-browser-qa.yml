name: Heat 6 Normal Browser QA

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/heat-6-normal-browser-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/h6qa-http.log 2>&1 &
          sleep 1

      - name: QA
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          imgdir='heat_dimensionless.files'
          display_nums=['001','002','003','004','005','007','008','009','011','012','013']
          inline_nums=['006','010']
          all_nums=[f'{i:03d}' for i in range(1,14)]
          vps={'desktop':{'width':1440,'height':1000},'mobile':{'width':390,'height':844}}
          out=Path('heat-6-normal-qa'); out.mkdir(exist_ok=True)
          rows=[]; failures=[]

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for vn,vp in vps.items():
              ctx=browser.new_context(viewport=vp,device_scale_factor=1)
              pg=ctx.new_page(); errs=[]
              pg.on('pageerror',lambda exc,s=errs:s.append(str(exc)))
              pg.goto('http://127.0.0.1:8000/heat/heat_6.html',
                      wait_until='domcontentloaded',timeout=120000)
              pg.wait_for_function(
                '() => window.MathJax && MathJax.startup && MathJax.startup.promise',
                timeout=60000)
              pg.evaluate('async()=>{await MathJax.startup.promise;}')
              pg.wait_for_timeout(400)

              blocks=pg.locator(f'div.math-block[data-source-image*="{imgdir}/image"]')
              inlines=pg.locator(f'span.math-inline[data-source-image*="{imgdir}/image"]')
              bc=blocks.count(); ic=inlines.count()
              target_imgs=sum(pg.locator(f'img[src*="{imgdir}/image{n}.png"]').count() for n in all_nums)
              merror=pg.locator('mjx-merror').count()

              unrendered=[]
              local=[]
              uncontained=[]
              for i in range(bc):
                el=blocks.nth(i); src=el.get_attribute('data-source-image')
                if el.locator('mjx-container').count()<1: unrendered.append(src)
                dims=el.evaluate("e=>({clientWidth:e.clientWidth,scrollWidth:e.scrollWidth,overflowX:getComputedStyle(e).overflowX})")
                if dims['scrollWidth']>dims['clientWidth']+1:
                  local.append(src)
                  if vn=='desktop' or dims['overflowX'] not in ('auto','scroll'):
                    uncontained.append(src)

              inline_unrendered=[]
              inline_display=[]
              for i in range(ic):
                el=inlines.nth(i); src=el.get_attribute('data-source-image')
                if el.locator('mjx-container').count()<1: inline_unrendered.append(src)
                inline_display.append(el.evaluate("e=>getComputedStyle(e).display"))

              pd=pg.evaluate("()=>({clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth})")
              po=pd['scrollWidth']>pd['clientWidth']+2
              pg.screenshot(path=str(out/f'{vn}.png'),full_page=True,animations='disabled')

              row={
                'viewport':vn,'display_blocks':bc,'inline_symbols':ic,
                'source_formula_images':target_imgs,'merror':merror,
                'unrendered':unrendered,'inline_unrendered':inline_unrendered,
                'inline_display':inline_display,'local_scroll':local,
                'uncontained':uncontained,'page_overflow':po,'page_errors':errs
              }
              rows.append(row)

              if bc!=11: failures.append(f'{vn}: display blocks={bc}')
              if ic!=2: failures.append(f'{vn}: inline symbols={ic}')
              if target_imgs!=0: failures.append(f'{vn}: formula images={target_imgs}')
              if any(x!='inline' for x in inline_display):
                failures.append(f'{vn}: inline display={inline_display}')
              if merror or unrendered or inline_unrendered or uncontained or po or errs:
                failures.append(f'{vn}: render/layout failure')
              ctx.close()
            browser.close()

          status='PASS' if not failures else 'FAIL'
          (out/'manifest.json').write_text(json.dumps({'status':status,'rows':rows,'failures':failures},ensure_ascii=False,indent=2),encoding='utf-8')

          report=Path('.document/formula_reviews/HEAT_6_NORMAL_BROWSER_QA_20260918.md')
          L=[
            '# Heat 6 Normal Browser QA — 2026-09-18','',
            f'- Overall: **{status}**',
            '- Viewports: desktop 1440x1000; mobile 390x844',
            '- Target: 11 display MathJax blocks + 2 inline MathJax symbols.','',
            '| Viewport | Display | Inline | Formula images | MathJax errors | Local-scroll | Uncontained | Page overflow |',
            '|---|---:|---:|---:|---:|---:|---:|---|'
          ]
          for r in rows:
            L.append(
              f"| {r['viewport']} | {r['display_blocks']}/11 | {r['inline_symbols']}/2 | "
              f"{r['source_formula_images']} | {r['merror']} | {len(r['local_scroll'])} | "
              f"{len(r['uncontained'])} | {'YES' if r['page_overflow'] else 'NO'} |")
          L += ['', '## Failures',''] + ([f'- {x}' for x in failures] if failures else ['- None.'])
          L += ['', '- Production deployment has not been performed.']
          report.write_text('\n'.join(L)+'\n',encoding='utf-8')
          if failures: raise SystemExit(1)
          PY

      - name: Commit report
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .document/formula_reviews/HEAT_6_NORMAL_BROWSER_QA_20260918.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record heat 6 browser QA'
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heat-6-normal-qa
          path: heat-6-normal-qa
          retention-days: 7
