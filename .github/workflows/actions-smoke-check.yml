# Created: 2026-09-19 09:50 JST
name: Actions Smoke Check

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/actions-smoke-check.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Write marker
        run: |
          mkdir -p .document/formula_reviews
          printf '# Actions Smoke Check\n\n- status: PASS\n- date: 2026-09-19\n' > .document/formula_reviews/ACTIONS_SMOKE_CHECK_20260919.md
      - name: Commit marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .document/formula_reviews/ACTIONS_SMOKE_CHECK_20260919.md
          git commit -m "test: record Actions smoke check [skip ci]"
          git push origin HEAD:develop
