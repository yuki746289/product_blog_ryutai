name: Apply certified FEM 5 formulas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-fem-5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply certified FEM 5 reconstruction
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          page=Path('fem/fem_5.html')
          imgdir='fem_tet_vol.files'
          cfg=json.loads(Path('.document/formula_reviews/fem_5_formulas.json').read_text(encoding='utf-8'))
          targets=[f'{i:03d}' for i in range(1,8)]
          seq=[x['image'][5:8] for x in cfg['formulas']]
          if seq!=targets:
              raise RuntimeError(f'certified sequence mismatch: {seq}')

          mathjax4 = "\n\t<script>\n\twindow.MathJax={\n\t\toutput:{displayOverflow:'linebreak',linebreaks:{inline:true,width:'100%',lineleading:0.2}},\n\t\tchtml:{displayAlign:'left',displayIndent:'0'}\n\t};\n\t</script>\n\t<script defer src=\"https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js\"></script>\n"

          def strip_mathjax(text):
              text=re.sub(r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>','',text,flags=re.I|re.S)
              text=re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>','',text,flags=re.I|re.S)
              return text

          def add_mathjax(text):
              text=strip_mathjax(text)
              if '</head>' not in text:
                  raise RuntimeError('missing </head>')
              return text.replace('</head>',mathjax4+'</head>',1)

          alt='|'.join(targets)
          pat=re.compile(
              rf'(?P<div><div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<dnum>{alt})\.png["\'])[^>]*>.*?</div>)'
              rf'|(?P<section><section\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<snum>{alt})\.png["\'])[^>]*>.*?</section>)'
              rf'|(?P<img><p\b(?=[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'])[^>]*>\s*<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{alt})\.png["\'][^>]*>\s*</p>)',
              flags=re.I|re.S)

          def guard(text):
              return re.sub(r'\s+',' ',pat.sub('<FORMULA/>',strip_mathjax(text))).strip()

          raw=page.read_bytes()
          enc=None
          for candidate in ('cp932','utf-8'):
              try:
                  original=raw.decode(candidate); enc=candidate; break
              except UnicodeDecodeError:
                  pass
          if enc is None:
              raise RuntimeError('decode failed')

          before=guard(original)
          matches=list(pat.finditer(original))
          found=[m.group('dnum') or m.group('snum') or m.group('inum') for m in matches]
          if found!=targets:
              raise RuntimeError(f'normal sequence mismatch: {found}')

          bynum={x['image'][5:8]:x for x in cfg['formulas']}
          pos=[0]
          def repl(_m):
              n=targets[pos[0]]
              pos[0]+=1
              item=bynum[n]
              source=f'./../img/{imgdir}/image{n}.png'
              if item['type']=='rich':
                  return (
                    f'<section class="math-block formula-rich" id="formula-fem-5-{n}" '
                    f'data-source-image="{source}">\n'
                    f'{item["html"]}\n</section>'
                  )
              return (
                f'<div class="math-block" id="formula-fem-5-{n}" '
                f'data-source-image="{source}">\n'
                f'{item["latex"]}\n</div>'
              )

          applied=add_mathjax(pat.sub(repl,original))
          if guard(applied)!=before:
              raise RuntimeError('non-formula content changed')

          mapped=re.findall(
              rf'data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
              applied,flags=re.I)
          if mapped!=targets:
              raise RuntimeError(f'mapped sequence mismatch: {mapped}')

          leftovers=re.findall(
              rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?:{alt})\.png["\'][^>]*>',
              applied,flags=re.I)
          if leftovers:
              raise RuntimeError(f'target images remain: {len(leftovers)}')

          page.write_bytes(applied.encode(enc))

          Path('.document/formula_reviews/FEM_5_NORMAL_APPLY_RESULT.md').write_text(
              '# FEM 5 Normal Apply Result\n\n'
              '- Mathematical source images replaced: **7 / 7**\n'
              '- Pure MathJax blocks: **6**\n'
              '- HTML prose + MathJax mixed block: **1**\n'
              '- Target formula image tags remaining: **0**\n'
              '- Non-formula content guard: **PASS**\n'
              f'- Encoding: {enc}\n'
              '- MathJax: v4\n'
              '- Production deployment: not performed.\n',
              encoding='utf-8')
          print('FEM 5 PASS blocks=7')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fem/fem_5.html .document/formula_reviews/FEM_5_NORMAL_APPLY_RESULT.md
          git commit -m 'feat: apply certified FEM 5 reconstruction'
          git push origin HEAD:develop
