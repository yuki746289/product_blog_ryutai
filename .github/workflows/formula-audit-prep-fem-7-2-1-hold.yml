name: Formula Audit Prep FEM 7.2.1 HOLD

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/formula-audit-prep-fem-7-2-1-hold.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Normalize and enlarge HOLD images
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops

          src = Path('img/fem_d_mass_tet.files')
          out = Path('audit-prep/fem_7_2_1_hold')
          out.mkdir(parents=True, exist_ok=True)

          for n in ('011','012','015'):
              for ext in ('png','gif'):
                  p = src / f'image{n}.{ext}'
                  if not p.exists():
                      continue
                  im = Image.open(p)
                  im.seek(0)
                  rgba = im.convert('RGBA')
                  white = Image.new('RGBA', rgba.size, (255,255,255,255))
                  white.alpha_composite(rgba)
                  rgb = white.convert('RGB')

                  # crop only outer pure/near-white margins; keep all formula pixels
                  bg = Image.new('RGB', rgb.size, (255,255,255))
                  diff = ImageChops.difference(rgb, bg).convert('L')
                  diff = diff.point(lambda v: 255 if v > 8 else 0)
                  box = diff.getbbox()
                  if box:
                      pad = 8
                      l,t,r,b = box
                      box = (max(0,l-pad), max(0,t-pad), min(rgb.width,r+pad), min(rgb.height,b+pad))
                      rgb = rgb.crop(box)

                  x8 = rgb.resize((rgb.width*8, rgb.height*8), Image.Resampling.NEAREST)
                  x8.save(out / f'image{n}_{ext}_x8.png')
                  rgb.save(out / f'image{n}_{ext}_normalized.png')
                  (out / f'image{n}_{ext}_meta.txt').write_text(
                      f'source={p}\nmode={im.mode}\nsize={im.size}\ninfo={im.info}\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fem-7-2-1-hold-audit-prep
          path: audit-prep/fem_7_2_1_hold
          retention-days: 7
