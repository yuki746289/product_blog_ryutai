name: Remaining FEM Normal Browser QA

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/remaining-fem-normal-browser-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/remfemqa-http.log 2>&1 &
          sleep 1

      - name: QA
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          pages=[
            {'key':'fem_3','path':'fem/fem_3.html','imgdir':'fem_integrate.files','nums':['001','002'],'rich':[]},
            {'key':'fem_6_1_2','path':'fem/fem_6_1_2.html','imgdir':'fem_n_tri.files','nums':['007','008'],'rich':[]},
            {'key':'fem_6_1_3','path':'fem/fem_6_1_3.html','imgdir':'fem_n_tri.files','nums':['009','010'],'rich':[]},
            {'key':'fem_6_1_4','path':'fem/fem_6_1_4.html','imgdir':'fem_n_tri.files','nums':['011','012'],'rich':[]},
            {'key':'fem_8','path':'fem/fem_8.html','imgdir':'fem_bd.files','nums':['001','002'],'rich':[]},
            {'key':'fem_4','path':'fem/fem_4.html','imgdir':'fem_tri_area.files','nums':['002'],'rich':['002']},
          ]
          vps={'desktop':{'width':1440,'height':1000},'mobile':{'width':390,'height':844}}
          out=Path('remaining-fem-normal-qa'); out.mkdir(exist_ok=True)
          rows=[]; failures=[]

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for pdef in pages:
              for vn,vp in vps.items():
                ctx=browser.new_context(viewport=vp,device_scale_factor=1)
                pg=ctx.new_page(); errs=[]
                pg.on('pageerror',lambda exc,s=errs:s.append(str(exc)))

                pg.goto(f'http://127.0.0.1:8000/{pdef["path"]}',
                        wait_until='domcontentloaded',timeout=120000)
                pg.wait_for_function(
                    '() => window.MathJax && MathJax.startup && MathJax.startup.promise',
                    timeout=60000)
                pg.evaluate('async()=>{await MathJax.startup.promise;}')
                pg.wait_for_timeout(400)

                target_blocks=[]
                source_imgs=0
                local=[]
                uncontained=[]
                unrendered=[]

                for n in pdef['nums']:
                  sel=f'[data-source-image*="{pdef["imgdir"]}/image{n}.png"]'
                  loc=pg.locator(sel)
                  cnt=loc.count()
                  if cnt!=1:
                    failures.append(f'{pdef["key"]} {vn}: image{n} mapped blocks={cnt}')
                  if cnt:
                    el=loc.first
                    target_blocks.append(el)
                    if el.locator('mjx-container').count()<1:
                      unrendered.append(n)
                    dims=el.evaluate(
                      "e=>({clientWidth:e.clientWidth,scrollWidth:e.scrollWidth,"
                      "overflowX:getComputedStyle(e).overflowX})")
                    if dims['scrollWidth']>dims['clientWidth']+1:
                      local.append(n)
                      if vn=='desktop' or dims['overflowX'] not in ('auto','scroll'):
                        uncontained.append(n)
                  source_imgs += pg.locator(
                    f'img[src*="{pdef["imgdir"]}/image{n}.png"]').count()

                rich_count=sum(
                  pg.locator(
                    f'.formula-rich-block[data-source-image*="{pdef["imgdir"]}/image{n}.png"]').count()
                  for n in pdef['rich'])

                rich_text_ok=True
                if pdef['key']=='fem_4':
                  txt=pg.locator(
                    '.formula-rich-block[data-source-image*="fem_tri_area.files/image002.png"]').inner_text()
                  for phrase in ['符号とすると','互換であれば']:
                    if phrase not in txt:
                      rich_text_ok=False

                merror=pg.locator('mjx-merror').count()
                pd=pg.evaluate(
                    "()=>({clientWidth:document.documentElement.clientWidth,"
                    "scrollWidth:document.documentElement.scrollWidth})")
                po=pd['scrollWidth']>pd['clientWidth']+2

                pg.screenshot(path=str(out/f'{pdef["key"]}_{vn}.png'),
                              full_page=True,animations='disabled')

                row={
                  'page':pdef['key'],'viewport':vn,'blocks':len(target_blocks),
                  'expected':len(pdef['nums']),'source_images':source_imgs,
                  'rich_count':rich_count,'rich_expected':len(pdef['rich']),
                  'rich_text_ok':rich_text_ok,'merror':merror,
                  'unrendered':unrendered,'local_scroll':local,
                  'uncontained':uncontained,'page_overflow':po,'page_errors':errs
                }
                rows.append(row)

                if len(target_blocks)!=len(pdef['nums']):
                  failures.append(f'{pdef["key"]} {vn}: block total={len(target_blocks)}')
                if source_imgs!=0:
                  failures.append(f'{pdef["key"]} {vn}: source images={source_imgs}')
                if rich_count!=len(pdef['rich']):
                  failures.append(f'{pdef["key"]} {vn}: rich blocks={rich_count}')
                if not rich_text_ok:
                  failures.append(f'{pdef["key"]} {vn}: rich Japanese text missing')
                if merror or unrendered or uncontained or po or errs:
                  failures.append(f'{pdef["key"]} {vn}: render/layout failure')

                ctx.close()
            browser.close()

          status='PASS' if not failures else 'FAIL'
          (out/'manifest.json').write_text(
              json.dumps({'status':status,'rows':rows,'failures':failures},
                         ensure_ascii=False,indent=2),encoding='utf-8')

          report=Path('.document/formula_reviews/REMAINING_FEM_NORMAL_BROWSER_QA_20260918.md')
          L=[
            '# Remaining FEM Normal Browser QA — 2026-09-18','',
            f'- Overall: **{status}**',
            '- Viewports: desktop 1440x1000; mobile 390x844',
            '- Target: 11 reconstructed mathematical-content blocks across 6 pages.',
            '- fem_4/image002: HTML Japanese prose + MathJax.','',
            '| Page | Viewport | Blocks | Source images | Rich | MathJax errors | Local-scroll | Uncontained | Page overflow |',
            '|---|---|---:|---:|---:|---:|---:|---:|---|'
          ]
          for r in rows:
            L.append(
              f"| {r['page']} | {r['viewport']} | {r['blocks']}/{r['expected']} | "
              f"{r['source_images']} | {r['rich_count']}/{r['rich_expected']} | "
              f"{r['merror']} | {len(r['local_scroll'])} | {len(r['uncontained'])} | "
              f"{'YES' if r['page_overflow'] else 'NO'} |")
          L += ['', '## Failures',''] + (
              [f'- {x}' for x in failures] if failures else ['- None.'])
          L += ['', '- Production deployment has not been performed.']
          report.write_text('\n'.join(L)+'\n',encoding='utf-8')

          if failures:
            raise SystemExit(1)
          PY

      - name: Commit report
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .document/formula_reviews/REMAINING_FEM_NORMAL_BROWSER_QA_20260918.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record remaining FEM browser QA'
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-fem-normal-qa
          path: remaining-fem-normal-qa
          retention-days: 7
