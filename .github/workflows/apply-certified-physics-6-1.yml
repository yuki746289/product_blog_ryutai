# Created: 2026-09-19T00:31:00+09:00
name: Apply certified Physics 6_1 formulas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-physics-6-1.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply certified formulas only
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          page=Path('physics/physics_6_1.html')
          cfg=json.loads(Path('.document/formula_reviews/physics_6_1_formulas.json').read_text(encoding='utf-8'))
          imgdir='physics_c_four_operator.files'
          display=cfg['formulas']
          dnums=[x['image'][5:8] for x in display]
          if dnums!=['001','002','003','004','005']:
              raise RuntimeError(f'display sequence {dnums}')
          bynum={x['image'][5:8]:x for x in cfg['formulas']}

          mathjax4 = """
          <script>
          window.MathJax={
            output:{displayOverflow:'linebreak',linebreaks:{inline:true,width:'100%',lineleading:0.2}},
            chtml:{displayAlign:'left',displayIndent:'0'}
          };
          </script>
          <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
          """

          raw=page.read_bytes()
          enc=None
          for candidate in ('cp932','utf-8'):
              try:
                  original=raw.decode(candidate)
                  enc=candidate
                  break
              except UnicodeDecodeError:
                  pass
          if enc is None:
              raise RuntimeError('encoding failed')

          def strip_mathjax(text):
              text=re.sub(r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>','',text,flags=re.I|re.S)
              text=re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>','',text,flags=re.I|re.S)
              return text

          dalt='|'.join(dnums)
          dp=re.compile(
              rf'(?P<block><div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<bnum>{dalt})\.png["\'])[^>]*>.*?</div>)'
              rf'|(?P<img><p\b(?=[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'])[^>]*>\s*<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{dalt})\.png["\'][^>]*>\s*</p>)',
              flags=re.I|re.S)

          def skeleton(text):
              text=strip_mathjax(text)
              text=dp.sub('<DISPLAY_FORMULA/>',text)
              return re.sub(r'\s+',' ',text).strip()

          before=skeleton(original)
          found=[m.group('inum') or m.group('bnum') for m in dp.finditer(original)]
          if found!=dnums:
              raise RuntimeError(f'display source sequence {found} != {dnums}')

          pos=[0]
          def repl(_m):
              n=dnums[pos[0]]
              pos[0]+=1
              return (
                  f'<div class="math-block" id="formula-physics-6-1-{n}" '
                  f'data-source-image="./../img/{imgdir}/image{n}.png">\n'
                  f'{bynum[n]["latex"]}\n</div>'
              )

          applied=dp.sub(repl,original)
          applied=strip_mathjax(applied)
          if '</head>' not in applied:
              raise RuntimeError('missing </head>')
          applied=applied.replace('</head>',mathjax4+'</head>',1)

          if skeleton(applied)!=before:
              raise RuntimeError('non-formula content changed')

          mapped=re.findall(
              rf'<div\b[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'][^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
              applied,flags=re.I)
          if mapped!=dnums:
              raise RuntimeError(f'mapped {mapped} != {dnums}')

          leftovers=re.findall(
              rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?:{dalt})\.png["\'][^>]*>',
              applied,flags=re.I)
          if leftovers:
              raise RuntimeError(f'target formula images remain {len(leftovers)}')

          page.write_bytes(applied.encode(enc))
          Path('.document/formula_reviews/PHYSICS_6_1_NORMAL_APPLY_RESULT.md').write_text(
              '# Physics 6_1 Normal Apply Result\n\n'
              '- Certified formulas applied: **5 / 5**\n'
              '- Display formulas: **5**\n'
              '- Target formula image tags remaining: **0**\n'
              '- Retained diagrams: **0**\n'
              '- Non-formula content guard: **PASS**\n'
              '- MathJax: v4\n'
              '- Production deployment: not performed.\n',
              encoding='utf-8')
          print('PASS display=5 diagrams=0 encoding='+enc)
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add physics/physics_6_1.html .document/formula_reviews/PHYSICS_6_1_NORMAL_APPLY_RESULT.md
          git commit -m 'feat: apply certified physics 6_1 formulas'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin develop
            if git push origin HEAD:develop; then exit 0; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 2
          done
