name: FTP Readonly Connection Test

on:
  push:
    paths:
      - '.github/workflows/ftp-readonly-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ftps:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test FTPS login and list root directory
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import sys
          from urllib.parse import urlparse

          server = os.environ.get("FTP_SERVER", "").strip()
          username = os.environ.get("FTP_USERNAME", "")
          password = os.environ.get("FTP_PASSWORD", "")

          missing = [name for name, value in {
              "FTP_SERVER": server,
              "FTP_USERNAME": username,
              "FTP_PASSWORD": password,
          }.items() if not value]
          if missing:
              print("Missing GitHub Secrets: " + ", ".join(missing))
              sys.exit(2)

          if "://" in server:
              parsed = urlparse(server)
              host = parsed.hostname or ""
              port = parsed.port or 21
          else:
              host_port = server.rsplit(":", 1)
              if len(host_port) == 2 and host_port[1].isdigit():
                  host, port = host_port[0], int(host_port[1])
              else:
                  host, port = server, 21

          if not host:
              print("FTP_SERVER does not contain a valid host name.")
              sys.exit(2)

          ftp = ftplib.FTP_TLS(timeout=20)
          try:
              ftp.connect(host, port)
              ftp.login(username, password)
              ftp.prot_p()
              ftp.set_pasv(True)
              current_dir = ftp.pwd()
              entries = ftp.nlst()
              names = {entry.rstrip('/').split('/')[-1].lower() for entry in entries}
              print("FTPS connection: OK")
              print("Passive mode: OK")
              print(f"Login directory: {current_dir}")
              print(f"Directory listing: OK ({len(entries)} entries)")
              print("index.html present: " + ("YES" if "index.html" in names else "NO"))
          except Exception as exc:
              print(f"FTPS connection test failed: {type(exc).__name__}: {exc}")
              sys.exit(1)
          finally:
              try:
                  ftp.quit()
              except Exception:
                  pass
          PY
