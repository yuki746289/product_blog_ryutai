name: FTP Connection Test

on:
  push:
    paths:
      - '.github/workflows/ftp-readonly-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ftps:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test FTPS login, listing, upload and delete
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import io
          import os
          import sys
          from urllib.parse import urlparse

          server = os.environ.get("FTP_SERVER", "").strip()
          username = os.environ.get("FTP_USERNAME", "").strip()
          password = os.environ.get("FTP_PASSWORD", "").strip()

          missing = [name for name, value in {
              "FTP_SERVER": server,
              "FTP_USERNAME": username,
              "FTP_PASSWORD": password,
          }.items() if not value]
          if missing:
              print("Missing GitHub Secrets: " + ", ".join(missing))
              sys.exit(2)

          if "://" in server:
              parsed = urlparse(server)
              host = parsed.hostname or ""
              port = parsed.port or 21
          else:
              host_port = server.rsplit(":", 1)
              if len(host_port) == 2 and host_port[1].isdigit():
                  host, port = host_port[0], int(host_port[1])
              else:
                  host, port = server, 21

          if not host:
              print("FTP_SERVER does not contain a valid host name.")
              sys.exit(2)

          test_name = "__chatgpt_ftps_connection_test__.txt"
          payload = b"temporary FTPS deployment test\n"
          ftp = ftplib.FTP_TLS(timeout=20)
          uploaded = False

          try:
              ftp.connect(host, port)
              ftp.login(username, password)
              ftp.prot_p()
              ftp.set_pasv(True)

              current_dir = ftp.pwd()
              entries = ftp.nlst()
              names = {entry.rstrip('/').split('/')[-1].lower() for entry in entries}
              print("FTPS connection: OK")
              print("Passive mode: OK")
              print(f"Login directory: {current_dir}")
              print(f"Directory listing: OK ({len(entries)} entries)")
              print("index.html present: " + ("YES" if "index.html" in names else "NO"))

              ftp.storbinary(f"STOR {test_name}", io.BytesIO(payload))
              uploaded = True
              if test_name not in {entry.rstrip('/').split('/')[-1] for entry in ftp.nlst()}:
                  raise RuntimeError("temporary upload was not visible after STOR")
              print("Temporary upload: OK")

              ftp.delete(test_name)
              uploaded = False
              if test_name in {entry.rstrip('/').split('/')[-1] for entry in ftp.nlst()}:
                  raise RuntimeError("temporary file still exists after delete")
              print("Temporary delete: OK")
              print("FTPS deployment capability: OK")
          except Exception as exc:
              print(f"FTPS connection/deployment test failed: {type(exc).__name__}: {exc}")
              sys.exit(1)
          finally:
              if uploaded:
                  try:
                      ftp.delete(test_name)
                      print("Cleanup after failure: OK")
                  except Exception:
                      print("WARNING: cleanup of temporary test file failed")
              try:
                  ftp.quit()
              except Exception:
                  pass
          PY
