name: Apply Formula Corrections

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/apply-formula-corrections.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Normalize one-off script characters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-formula-corrections.py')
          s = p.read_text(encoding='utf-8').replace('–', '-')
          s = s.replace(
              'pat.subn(replacement, text, count=1)',
              'pat.subn(lambda _m: replacement, text, count=1)'
          )
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply corrections
        run: python3 .github/scripts/apply-formula-corrections.py

      - name: Replace repeated surface tension formula
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('fem/fem_7_1_2.html')
          text = p.read_bytes().decode('cp932')
          pat = re.compile(r'<p class="im"[^>]*>\s*<img src="\./\.\./img/fem_d_momentum_tri\.files/image032\.png">\s*</p>', re.I)
          repl = r'''<div class="math-block">
          \[
          +\frac{K^*}{We}\,n_iL
          \begin{bmatrix}1\\1\end{bmatrix}
          \]
          </div>'''
          text, n = pat.subn(lambda _m: repl, text)
          assert n == 1, n
          p.write_bytes(text.encode('cp932'))
          PY

      - name: Validate corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cp932_files = [
              'fem/fem_7_1_1.html',
              'fem/fem_7_1_2.html',
              'fem/fem_7_2_1.html',
              'fem/fem_7_2_2.html',
              'fem/fem_6_2_1.html',
              'footer.html',
              'revision_history.html',
          ]
          texts = {}
          for name in cp932_files:
              data = Path(name).read_bytes()
              text = data.decode('cp932')
              texts[name] = text
              assert 'charset=shift_jis' in text.lower(), name

          assert '@import url("math.css");' in Path('css/lib.css').read_bytes().decode('cp932')
          assert 'fem_d_mass_tri.files/image002.png' not in texts['fem/fem_7_1_1.html']
          for n in [3,4,27,32,37,38,39,40,41,42]:
              assert f'fem_d_momentum_tri.files/image{n:03d}.png' not in texts['fem/fem_7_1_2.html']

          ids = set()
          for text in texts.values():
              ids.update(re.findall(r'id="([^"]+)"', text))
          history = texts['revision_history.html']
          anchors = re.findall(r'href="\./(?:fem/[^#"]+)?#([^"]+)"', history)
          missing = sorted(set(anchors) - ids)
          assert not missing, missing

          assert '(p+q+1)!' in texts['fem/fem_7_1_2.html']
          assert 'i=1,2,3' not in texts['fem/fem_7_1_2.html']
          assert 'revision_history.html' in texts['footer.html']
          print('Static correction validation passed.')
          PY

      - name: Browser smoke test
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/formula-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2

          mkdir -p /tmp/formula-check
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=375,812 --virtual-time-budget=7000 \
            --screenshot=/tmp/formula-check/momentum-mobile.png \
            http://127.0.0.1:8000/fem/fem_7_1_2.html
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1365,900 --virtual-time-budget=7000 \
            --screenshot=/tmp/formula-check/history-desktop.png \
            http://127.0.0.1:8000/revision_history.html
          test -s /tmp/formula-check/momentum-mobile.png
          test -s /tmp/formula-check/history-desktop.png

      - name: Commit corrected pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/lib.css \
            fem/fem_7_1_1.html fem/fem_7_1_2.html \
            fem/fem_7_2_1.html fem/fem_7_2_2.html fem/fem_6_2_1.html \
            footer.html revision_history.html
          git commit -m "fix: correct FEM formulas and add revision history"
          git push origin HEAD:develop

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: formula-correction-smoke
          path: /tmp/formula-check/*.png
          retention-days: 7
