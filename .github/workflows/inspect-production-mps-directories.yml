name: Inspect production MPS directories

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/inspect-production-mps-directories.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect FTPS img tree read-only
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, json, os
          from pathlib import Path
          from urllib.parse import urlparse

          server=os.environ["FTP_SERVER"].strip()
          username=os.environ["FTP_USERNAME"].strip()
          password=os.environ["FTP_PASSWORD"].strip()

          if "://" in server:
              u=urlparse(server); host=u.hostname or ""; port=u.port or 21
          else:
              hp=server.rsplit(":",1)
              if len(hp)==2 and hp[1].isdigit(): host,port=hp[0],int(hp[1])
              else: host,port=server,21

          ftp=ftplib.FTP_TLS(timeout=20)\n          ftp.encoding="cp932"
          ftp.connect(host,port); ftp.login(username,password); ftp.prot_p(); ftp.set_pasv(True)

          out={"root_pwd":ftp.pwd(),"img_entries":[],"mps_entries":{},"errors":[]}
          try:
              img_entries=ftp.nlst("img")
              out["img_entries"]=img_entries
          except Exception as exc:
              out["errors"].append(f"nlst img: {type(exc).__name__}: {exc}")
              img_entries=[]

          candidates=[]
          for e in img_entries:
              base=e.rstrip("/").split("/")[-1]
              if "mps" in base.lower():
                  candidates.append(e)

          expected=[
            "img/mps_weight.files","img/mps_num.files","img/mps_nabra.files",
            "img/mps_dot.files","img/mps_rap.files","img/mps_fluid_eq.files",
            "img/mps_fluid_count.files"
          ]
          for e in expected:
              if e not in candidates: candidates.append(e)

          for d in candidates:
              try:
                  out["mps_entries"][d]=ftp.nlst(d)
              except Exception as exc:
                  out["mps_entries"][d]={"error":f"{type(exc).__name__}: {exc}"}

          Path("mps-production-tree.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
            "img_entry_count":len(img_entries),
            "mps_candidates":[x for x in img_entries if "mps" in x.lower()],
            "checked":list(out["mps_entries"])
          },ensure_ascii=False,indent=2))

          try: ftp.quit()
          except Exception: pass
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mps-production-tree
          path: mps-production-tree.json
          retention-days: 7
