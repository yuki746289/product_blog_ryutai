name: Apply Responsive Navigation v1.1

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/apply-responsive-navigation-v11.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply implementation
        run: python3 .github/scripts/apply-responsive-navigation-v11.py

      - name: Show implementation diff
        run: |
          git diff -- menu.html css/responsive.css
          git status --short

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.html css/responsive.css
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
          else
            git commit -m "feat: add smartphone hamburger navigation"
            git push origin HEAD:develop
          fi
