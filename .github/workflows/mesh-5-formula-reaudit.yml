# Created: 2026-09-19T08:21:00+09:00
name: Mesh 5 Formula Reaudit
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/mesh-5-formula-reaudit.yml'
      - '.document/formula_reviews/mesh_5_formulas.json'
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: develop, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Build strict audit page
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('.document/formula_reviews/mesh_5_formulas.json').read_text(encoding='utf-8'))
          if len(cfg['formulas'])!=7: raise RuntimeError('formula count != 7')
          parts=['<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">',
                 '<style>body{font-family:Arial,"Yu Gothic",sans-serif;margin:20px}.formula-pair{border-top:1px solid #bbb;padding:18px 0}.pair-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.source,.render{min-width:0;overflow-x:auto;padding:10px;border:1px solid #ddd}.source img{display:block;max-width:100%;height:auto;margin:auto}@media(max-width:900px){.pair-grid{grid-template-columns:1fr}}</style>',
                 '<script>window.MathJax={output:{displayOverflow:"linebreak",linebreaks:{inline:false,width:"100%"}}};</script>',
                 '<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script></head><body>']
          for item in cfg['formulas']:
              n=item['image'][5:8]; ident=f'mesh_5-{n}'; src=f'./../{cfg["image_dir"]}/{item["image"]}'
              parts += [f'<section class="formula-pair" id="formula-{ident}"><h3>{ident}</h3><div class="pair-grid">',
                        f'<div class="source"><img src="{src}" alt="source {ident}"></div>',
                        f'<div class="render">{item["latex"]}</div></div></section>']
          parts+=['</body></html>']
          Path('mesh/mesh_5_reaudit.html').write_text('\n'.join(parts),encoding='utf-8')
          PY
      - name: Install Chromium
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Capture source/render pairs
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/mesh5.log 2>&1 &
          sleep 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageDraw
          from playwright.sync_api import sync_playwright
          cfg=json.loads(Path('.document/formula_reviews/mesh_5_formulas.json').read_text(encoding='utf-8'))
          out=Path('mesh-5-pass2')
          for s in ('sources','renders','pairs'): (out/s).mkdir(parents=True,exist_ok=True)
          manifest={'formulas':[]}
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True); ctx=b.new_context(viewport={'width':2400,'height':2000}); pg=ctx.new_page(); errs=[]
              pg.on('pageerror',lambda e:errs.append(str(e)))
              pg.goto('http://127.0.0.1:8000/mesh/mesh_5_reaudit.html',wait_until='domcontentloaded',timeout=120000)
              pg.wait_for_function('() => window.MathJax && MathJax.startup && MathJax.startup.promise',timeout=60000); pg.evaluate('async()=>{await MathJax.startup.promise;}'); pg.wait_for_timeout(400)
              for item in cfg['formulas']:
                  n=item['image'][5:8]; ident=f'mesh_5-{n}'; sec=pg.locator(f'#formula-{ident}'); r=sec.locator('.render'); simg=sec.locator('.source img')
                  if r.locator('mjx-container').count()<1 or r.locator('mjx-merror').count(): raise RuntimeError(f'{ident} render failure')
                  dims=r.evaluate('(e)=>({cw:e.clientWidth,sw:e.scrollWidth})'); rp=out/'renders'/f'{ident}.png'; r.screenshot(path=str(rp))
                  sp=(Path.cwd()/'mesh'/simg.get_attribute('src')).resolve(); im=Image.open(sp).convert('RGBA'); bg=Image.new('RGBA',im.size,'white'); bg.alpha_composite(im); src=bg.convert('RGB')
                  scale=6 if src.width<600 else 3; src=src.resize((src.width*scale,src.height*scale),Image.Resampling.LANCZOS); src.save(out/'sources'/f'{ident}.png')
                  rr=Image.open(rp).convert('RGB'); margin,label,gap=16,28,24; w=max(src.width,rr.width)+32; h=2*margin+2*label+gap+src.height+rr.height
                  can=Image.new('RGB',(w,h),'white'); d=ImageDraw.Draw(can); y=margin; d.text((16,y),f'SOURCE {ident}',fill='black'); y+=label; can.paste(src,(16,y)); y+=src.height+gap; d.text((16,y),f'MATHJAX {ident}',fill='black'); y+=label; can.paste(rr,(16,y)); can.save(out/'pairs'/f'{ident}.png')
                  manifest['formulas'].append({'id':ident,'horizontal_overflow':dims['sw']>dims['cw']+1})
              b.close()
          manifest['count']=len(manifest['formulas']); manifest['page_errors']=errs; (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          if manifest['count']!=7 or errs: raise SystemExit(str(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with: {name: mesh-5-pass2, path: mesh-5-pass2, retention-days: 7}
      - name: Commit audit page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mesh/mesh_5_reaudit.html
          if ! git diff --cached --quiet; then
            git commit -m 'docs: build mesh 5 strict reaudit page'
            for attempt in 1 2 3 4 5; do git pull --rebase origin develop; if git push origin HEAD:develop; then exit 0; fi; if [ "$attempt" -eq 5 ]; then exit 1; fi; sleep 2; done
          fi
