name: Recover missing MPS assets from FTPS

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/recover-mps-assets-from-ftps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Read MPS assets from production FTPS
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib, json, os
          from pathlib import Path
          from urllib.parse import urlparse

          server=os.environ.get("FTP_SERVER","").strip()
          username=os.environ.get("FTP_USERNAME","").strip()
          password=os.environ.get("FTP_PASSWORD","").strip()
          if not all((server,username,password)):
              raise SystemExit("missing FTP secrets")

          if "://" in server:
              u=urlparse(server); host=u.hostname or ""; port=u.port or 21
          else:
              hp=server.rsplit(":",1)
              if len(hp)==2 and hp[1].isdigit(): host,port=hp[0],int(hp[1])
              else: host,port=server,21

          groups={
            "mps_weight.files": 1,
            "mps_num.files": 1,
            "mps_nabra.files": 12,
            "mps_dot.files": 9,
            "mps_rap.files": 2,
            "mps_fluid_eq.files": 2,
            "mps_fluid_count.files": 22,
          }

          targets=[]
          for d,n in groups.items():
              for i in range(1,n+1):
                  targets.append(f"img/{d}/image{i:03d}.gif")

          out=Path("mps-ftps-recovery")
          recovered=out/"recovered"
          recovered.mkdir(parents=True,exist_ok=True)

          ftp=ftplib.FTP_TLS(timeout=30)
          ftp.connect(host,port)
          ftp.login(username,password)
          ftp.prot_p()
          ftp.set_pasv(True)

          results=[]
          for remote in targets:
              local=recovered/remote
              local.parent.mkdir(parents=True,exist_ok=True)
              try:
                  with local.open("wb") as f:
                      ftp.retrbinary(f"RETR {remote}",f.write)
                  size=local.stat().st_size
                  results.append({"remote":remote,"status":"recovered","size":size})
                  print("RECOVERED",remote,size)
              except Exception as exc:
                  if local.exists(): local.unlink()
                  results.append({"remote":remote,"status":"missing","error":f"{type(exc).__name__}: {exc}"})
                  print("MISSING",remote,type(exc).__name__,exc)

          try: ftp.quit()
          except Exception: pass

          ok=sum(1 for x in results if x["status"]=="recovered")
          missing=len(results)-ok
          manifest={"target_count":len(results),"recovered_count":ok,"missing_count":missing,"results":results}
          (out/"manifest.json").write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding="utf-8")
          print(f"SUMMARY recovered={ok} missing={missing} total={len(results)}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: mps-ftps-recovery
          path: mps-ftps-recovery
          retention-days: 7
