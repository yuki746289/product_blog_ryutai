# Updated: 2026-09-15 15:56 JST
name: Apply Responsive Layout Patch

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/responsive-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply viewport and responsive stylesheet
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          VIEWPORT = '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
          RESPONSIVE_IMPORT = '@import url("responsive.css");'
          GRAPH_MARKER = 'responsive-graph-20260915'

          def decode_file(path):
              data = path.read_bytes()
              for enc in ('utf-8', 'cp932', 'shift_jis'):
                  try:
                      return data.decode(enc), enc
                  except UnicodeDecodeError:
                      pass
              raise RuntimeError(f'Unsupported text encoding: {path}')

          def write_file(path, text, enc):
              path.write_bytes(text.encode(enc))

          html_files = sorted(Path('.').rglob('*.html'))
          changed_html = 0

          for path in html_files:
              text, enc = decode_file(path)
              original = text
              newline = '\r\n' if '\r\n' in text else '\n'

              if not re.search(r'<meta\b[^>]*\bname\s*=\s*["\']viewport["\']', text, re.I):
                  head = re.search(r'<head\b[^>]*>', text, re.I)
                  if not head:
                      raise RuntimeError(f'<head> not found: {path}')
                  text = text[:head.end()] + newline + '\t' + VIEWPORT + text[head.end():]

              if path.as_posix() in ('graph.html', 'graph_2.html') and GRAPH_MARKER not in text:
                  style_end = re.search(r'</style\s*>', text, re.I)
                  if not style_end:
                      raise RuntimeError(f'</style> not found: {path}')
                  graph_css = (
                      newline + newline
                      + '/* responsive-graph-20260915 start */' + newline
                      + '@media screen and (max-width: 820px) {' + newline
                      + '\tbody { margin: 0; padding: 12px; overflow-x: hidden; }' + newline
                      + '\t#canvas { width: 100%; max-width: 800px; overflow-x: auto; overflow-y: hidden; }' + newline
                      + '\tcanvas { max-width: none; }' + newline
                      + '}' + newline
                      + '/* responsive-graph-20260915 end */' + newline
                  )
                  text = text[:style_end.start()] + graph_css + text[style_end.start():]

              if text != original:
                  write_file(path, text, enc)
                  changed_html += 1

          css_path = Path('css/lib.css')
          css, css_enc = decode_file(css_path)
          if RESPONSIVE_IMPORT not in css:
              newline = '\r\n' if '\r\n' in css else '\n'
              charset = re.search(r'@charset\s+["\'][^"\']+["\']\s*;', css, re.I)
              if charset:
                  css = css[:charset.end()] + newline + RESPONSIVE_IMPORT + css[charset.end():]
              else:
                  css = RESPONSIVE_IMPORT + newline + css
              write_file(css_path, css, css_enc)

          print(f'HTML files changed: {changed_html}')
          print(f'Total HTML files: {len(html_files)}')
          print(f'lib.css encoding: {css_enc}')
          PY

      - name: Validate responsive patch
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path

          def decode_file(path):
              data = path.read_bytes()
              for enc in ('utf-8', 'cp932', 'shift_jis'):
                  try:
                      return data.decode(enc), enc
                  except UnicodeDecodeError:
                      pass
              raise RuntimeError(f'Unsupported text encoding after patch: {path}')

          html_files = sorted(Path('.').rglob('*.html'))
          encodings = Counter()
          missing_viewport = []
          duplicate_viewport = []

          for path in html_files:
              text, enc = decode_file(path)
              encodings[enc] += 1
              count = len(re.findall(r'<meta\b[^>]*\bname\s*=\s*["\']viewport["\']', text, re.I))
              if count == 0:
                  missing_viewport.append(path.as_posix())
              elif count > 1:
                  duplicate_viewport.append(path.as_posix())

          lib_css, css_enc = decode_file(Path('css/lib.css'))
          responsive_css = Path('css/responsive.css').read_text(encoding='utf-8')

          print('HTML total:', len(html_files))
          print('Encodings:', dict(encodings))
          print('Missing viewport:', missing_viewport)
          print('Duplicate viewport:', duplicate_viewport)
          print('lib.css encoding:', css_enc)
          print('Responsive import count:', lib_css.count('@import url("responsive.css");'))
          print('Responsive media queries:', len(re.findall(r'@media\b', responsive_css, re.I)))

          assert len(html_files) == 192
          assert encodings == Counter({'cp932': 190, 'utf-8': 2}), encodings
          assert not missing_viewport, missing_viewport
          assert not duplicate_viewport, duplicate_viewport
          assert lib_css.count('@import url("responsive.css");') == 1
          assert css_enc == 'cp932'
          assert len(re.findall(r'@media\b', responsive_css, re.I)) >= 1
          assert 'responsive-graph-20260915 start' in decode_file(Path('graph.html'))[0]
          assert 'responsive-graph-20260915 start' in decode_file(Path('graph_2.html'))[0]
          PY

      - name: Show intended diff summary
        shell: bash
        run: |
          git status --short
          echo '--- diff stat ---'
          git diff --stat
          echo '--- changed file count ---'
          git diff --name-only | wc -l

      - name: Mobile screenshot smoke test
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium is not available on this runner.' >&2
            exit 1
          fi

          mkdir -p /tmp/responsive-smoke
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/responsive-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=375,812 --screenshot=/tmp/responsive-smoke/index-mobile.png \
            http://127.0.0.1:8000/index.html

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=375,812 --screenshot=/tmp/responsive-smoke/physics-mobile.png \
            http://127.0.0.1:8000/physics/physics.html

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=375,812 --screenshot=/tmp/responsive-smoke/fem-mobile.png \
            http://127.0.0.1:8000/fem/fem.html

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=1365,768 --screenshot=/tmp/responsive-smoke/index-desktop.png \
            http://127.0.0.1:8000/index.html

          test -s /tmp/responsive-smoke/index-mobile.png
          test -s /tmp/responsive-smoke/physics-mobile.png
          test -s /tmp/responsive-smoke/fem-mobile.png
          test -s /tmp/responsive-smoke/index-desktop.png
          ls -lh /tmp/responsive-smoke

      - name: Commit responsive patch to develop
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ':(glob)**/*.html' css/lib.css
          if git diff --cached --quiet; then
            echo 'No responsive changes to commit.'
          else
            git commit -m "feat: make legacy site responsive"
            git push origin HEAD:develop
          fi

      - name: Upload smoke screenshots
        uses: actions/upload-artifact@v4
        with:
          name: responsive-smoke-screenshots
          path: /tmp/responsive-smoke/*.png
          retention-days: 7
