name: Test Responsive Navigation v1.1

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/test-responsive-navigation-v11.yml'
      - '.github/scripts/test-responsive-navigation-v11.py'
      - 'menu.html'
      - 'css/responsive.css'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Run static and browser verification
        run: python3 .github/scripts/test-responsive-navigation-v11.py

      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-navigation-v11-smoke
          path: /tmp/v11-smoke
          if-no-files-found: ignore
          retention-days: 7
