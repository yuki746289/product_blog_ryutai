name: Strict Formula Batch QA

on:
  push:
    branches: [develop]
    paths:
      - '.document/formula_reviews/STRICT_QA_BATCH_TARGET.json'
      - '.github/workflows/strict-formula-batch-qa.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Chromium and Pillow
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/strict-batch-http.log 2>&1 &
          sleep 1

      - name: Run batch QA
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          from PIL import Image, ImageDraw
          from playwright.sync_api import sync_playwright

          cfg=json.loads(Path('.document/formula_reviews/STRICT_QA_BATCH_TARGET.json').read_text(encoding='utf-8'))
          out=Path('strict-formula-batch-qa')
          out.mkdir(exist_ok=True)
          rows=[]; failures=[]

          def white_rgb(im):
              im=im.convert('RGBA')
              bg=Image.new('RGBA',im.size,'white')
              bg.alpha_composite(im)
              return bg.convert('RGB')

          def fit(im,max_w=700,max_h=480):
              ratio=min(max_w/im.width,max_h/im.height,1.0)
              if ratio < 1.0:
                  im=im.resize((max(1,int(im.width*ratio)),max(1,int(im.height*ratio))),Image.Resampling.LANCZOS)
              return im

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for item in cfg['pages']:
                  key=item['key']
                  page_path=item['path']
                  frag=item['frag']
                  srcdir=Path(item['dir'])
                  images=item['images']
                  retained=item.get('retained',[])
                  page_out=out/key
                  pair_dir=page_out/'pairs'
                  render_dir=page_out/'rendered'
                  page_out.mkdir(parents=True,exist_ok=True)
                  pair_dir.mkdir(exist_ok=True)
                  render_dir.mkdir(exist_ok=True)
                  page_fail=[]

                  for vn,vp in cfg['viewports'].items():
                      ctx=browser.new_context(viewport=vp,device_scale_factor=1)
                      pg=ctx.new_page()
                      page_errors=[]
                      pg.on('pageerror',lambda exc,a=page_errors:a.append(str(exc)))
                      pg.goto(f'http://127.0.0.1:8000/{page_path}',wait_until='domcontentloaded',timeout=120000)
                      pg.wait_for_function('() => window.MathJax && MathJax.startup && MathJax.startup.promise',timeout=60000)
                      pg.evaluate('async()=>{await MathJax.startup.promise;}')
                      pg.wait_for_timeout(500)

                      rendered=0; unrendered=[]; uncontained=[]
                      for n in images:
                          loc=pg.locator(f'[data-source-image*="{frag}/image{n}.png"]').first
                          if loc.count()<1:
                              page_fail.append(f'{vn}: image{n} mapping missing')
                              continue
                          if loc.locator('mjx-container').count()>0:
                              rendered += 1
                          else:
                              unrendered.append(n)
                          dims=loc.evaluate("e=>({cw:e.clientWidth,sw:e.scrollWidth,ox:getComputedStyle(e).overflowX})")
                          if dims['sw']>dims['cw']+1 and dims['ox'] not in ('auto','scroll'):
                              uncontained.append(n)

                      merror=pg.locator('mjx-merror').count()
                      doc=pg.evaluate("()=>({cw:document.documentElement.clientWidth,sw:document.documentElement.scrollWidth})")
                      page_overflow=doc['sw']>doc['cw']+2

                      retained_counts={n:pg.locator(f'img[src*="{frag}/image{n}.png"]').count() for n in retained}
                      if any(v!=1 for v in retained_counts.values()):
                          page_fail.append(f'{vn}: retained image counts={retained_counts}')

                      if rendered!=len(images): page_fail.append(f'{vn}: rendered={rendered}/{len(images)}')
                      if unrendered: page_fail.append(f'{vn}: unrendered={unrendered}')
                      if merror: page_fail.append(f'{vn}: mjx-merror={merror}')
                      if uncontained: page_fail.append(f'{vn}: uncontained overflow={uncontained}')
                      if page_overflow: page_fail.append(f'{vn}: page-wide overflow')
                      if page_errors: page_fail.append(f'{vn}: page errors={page_errors}')

                      if vn=='desktop':
                          pair_paths=[]
                          for n in images:
                              loc=pg.locator(f'[data-source-image*="{frag}/image{n}.png"]').first
                              if loc.count()<1: continue
                              rpath=render_dir/f'image{n}.png'
                              loc.screenshot(path=str(rpath),animations='disabled')
                              spath=srcdir/f'image{n}.png'
                              if not spath.exists():
                                  page_fail.append(f'source missing: {spath}')
                                  continue
                              src=fit(white_rgb(Image.open(spath)))
                              ren=fit(white_rgb(Image.open(rpath)))
                              h=max(src.height,ren.height)+42
                              pair=Image.new('RGB',(1440,h),'white')
                              dr=ImageDraw.Draw(pair)
                              dr.text((10,8),f'{key} image{n} SOURCE',fill='black')
                              dr.text((730,8),f'{key} image{n} MATHJAX',fill='black')
                              pair.paste(src,(10,32)); pair.paste(ren,(730,32))
                              pp=pair_dir/f'image{n}_pair.png'
                              pair.save(pp); pair_paths.append(pp)
                          for start in range(0,len(pair_paths),10):
                              group=pair_paths[start:start+10]
                              imgs=[Image.open(x).convert('RGB') for x in group]
                              total_h=sum(im.height for im in imgs)+12*(len(imgs)-1)
                              sheet=Image.new('RGB',(1440,total_h),'white')
                              y=0
                              for im in imgs:
                                  sheet.paste(im,(0,y)); y+=im.height+12
                              sheet.save(page_out/f'pair_sheet_{start+1:03d}_{start+len(group):03d}.png')

                      rows.append({'page':key,'viewport':vn,'expected':len(images),'rendered':rendered,
                                   'merror':merror,'unrendered':unrendered,'uncontained':uncontained,
                                   'page_overflow':page_overflow,'page_errors':page_errors})
                      ctx.close()

                  if page_fail:
                      failures.extend([f'{key}: {x}' for x in page_fail])

              browser.close()

          status='PASS' if not failures else 'FAIL'
          manifest={'status':status,'category':cfg.get('category'),'rows':rows,'failures':failures}
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          lines=[f"# Strict Formula Batch QA: {cfg.get('category')} — 2026-09-19",'',f'- Overall: **{status}**','',
                 '| Page | Viewport | Expected | Rendered | MathJax errors | Uncontained | Page overflow |',
                 '|---|---|---:|---:|---:|---:|---|']
          for r in rows:
              lines.append(f"| {r['page']} | {r['viewport']} | {r['expected']} | {r['rendered']} | {r['merror']} | {len(r['uncontained'])} | {'YES' if r['page_overflow'] else 'NO'} |")
          lines += ['', '## Failures',''] + ([f'- {x}' for x in failures] if failures else ['- None.'])
          (out/'report.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          if failures: raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strict-formula-batch-qa
          path: strict-formula-batch-qa
          retention-days: 7
