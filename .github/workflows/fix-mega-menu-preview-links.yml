name: Fix mega menu preview links

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/fix-mega-menu-preview-links.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Normalize preview links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('design_samples/v1.5/gray/mega-menu-preview.html')
          s = p.read_text(encoding='utf-8')
          old = '../../../simple/simple.html'
          new = '../../../counting/counting.html'
          if old not in s:
              raise SystemExit('SIMPLE preview path not found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print('updated SIMPLE links:', s.count(new))
          PY
          git config user.name 'takapi'
          git config user.email 'yuki_taka83@hotmail.com'
          git add design_samples/v1.5/gray/mega-menu-preview.html
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'fix: align SIMPLE preview links with current site'
          git push origin HEAD:develop
