# Created: 2026-09-15 15:52 JST
name: Responsive Layout Audit

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/responsive-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Audit HTML and CSS structure
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from collections import Counter
          from pathlib import Path

          root = Path('.')
          html_files = sorted(p for p in root.rglob('*.html') if '.git' not in p.parts)

          def decode_file(path):
              data = path.read_bytes()
              for enc in ('utf-8', 'cp932', 'shift_jis'):
                  try:
                      return data.decode(enc), enc
                  except UnicodeDecodeError:
                      pass
              return data.decode('latin-1'), 'latin-1'

          encodings = Counter()
          viewport = []
          no_viewport = []
          with_head = []
          no_head = []
          lib_css = []
          no_lib_css = []
          wrapper_pages = []
          iframe_pages = []
          fixed_iframe_pages = []
          inline_width_pages = []
          table_pages = []

          re_viewport = re.compile(r'<meta\b[^>]*\bname\s*=\s*["\']viewport["\']', re.I)
          re_head = re.compile(r'<head\b', re.I)
          re_lib = re.compile(r'(?:^|[./])css/lib\.css', re.I)
          re_wrapper = re.compile(r'id\s*=\s*["\']wrapper["\']', re.I)
          re_iframe = re.compile(r'<iframe\b', re.I)
          re_fixed_iframe = re.compile(r'<iframe\b[^>]*\bwidth\s*=\s*["\']?\d+', re.I)
          re_inline_width = re.compile(r'\bwidth\s*:\s*\d+px\b', re.I)
          re_table = re.compile(r'<table\b', re.I)

          for path in html_files:
              text, enc = decode_file(path)
              rel = path.as_posix()
              encodings[enc] += 1
              (with_head if re_head.search(text) else no_head).append(rel)
              (viewport if re_viewport.search(text) else no_viewport).append(rel)
              (lib_css if re_lib.search(text) else no_lib_css).append(rel)
              if re_wrapper.search(text): wrapper_pages.append(rel)
              if re_iframe.search(text): iframe_pages.append(rel)
              if re_fixed_iframe.search(text): fixed_iframe_pages.append(rel)
              if re_inline_width.search(text): inline_width_pages.append(rel)
              if re_table.search(text): table_pages.append(rel)

          css_path = Path('css/lib.css')
          css = ''
          css_encoding = None
          if css_path.exists():
              css, css_encoding = decode_file(css_path)

          fixed_css_widths = re.findall(r'\bwidth\s*:\s*\d+px\b', css, re.I)
          floats = re.findall(r'\bfloat\s*:\s*(?:left|right)\b', css, re.I)
          media_queries = re.findall(r'@media\b', css, re.I)
          max_width_rules = re.findall(r'\bmax-width\s*:', css, re.I)

          report = {
              'html_total': len(html_files),
              'encodings': dict(encodings),
              'with_head': len(with_head),
              'without_head': len(no_head),
              'with_viewport': len(viewport),
              'without_viewport': len(no_viewport),
              'with_lib_css': len(lib_css),
              'without_lib_css': len(no_lib_css),
              'wrapper_pages': len(wrapper_pages),
              'iframe_pages': len(iframe_pages),
              'fixed_iframe_pages': len(fixed_iframe_pages),
              'inline_fixed_width_pages': len(inline_width_pages),
              'table_pages': len(table_pages),
              'lib_css_encoding': css_encoding,
              'lib_css_fixed_width_rule_count': len(fixed_css_widths),
              'lib_css_float_rule_count': len(floats),
              'lib_css_media_query_count': len(media_queries),
              'lib_css_max_width_rule_count': len(max_width_rules),
              'samples_without_viewport': no_viewport[:30],
              'samples_without_lib_css': no_lib_css[:30],
              'samples_fixed_iframe': fixed_iframe_pages[:30],
              'samples_inline_fixed_width': inline_width_pages[:30],
          }

          Path('responsive_audit_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('=== RESPONSIVE_AUDIT_REPORT ===')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          print('=== END_RESPONSIVE_AUDIT_REPORT ===')
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: responsive-audit-report
          path: responsive_audit_report.json
          retention-days: 7
