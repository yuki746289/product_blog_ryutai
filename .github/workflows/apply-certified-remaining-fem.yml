name: Apply certified remaining FEM formulas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-remaining-fem.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply certified mathematical blocks
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          cfg=json.loads(Path('.document/formula_reviews/remaining_fem_formulas.json').read_text(encoding='utf-8'))

          mathjax4 = "\n\t<script>\n\twindow.MathJax={\n\t\toutput:{displayOverflow:'linebreak',linebreaks:{inline:true,width:'100%',lineleading:0.2}},\n\t\tchtml:{displayAlign:'left',displayIndent:'0'}\n\t};\n\t</script>\n\t<script defer src=\"https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js\"></script>\n"

          def strip_mathjax(text):
              text=re.sub(r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>','',text,flags=re.I|re.S)
              text=re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>','',text,flags=re.I|re.S)
              return text

          def add_mathjax(text):
              text=strip_mathjax(text)
              if '</head>' not in text:
                  raise RuntimeError('missing </head>')
              return text.replace('</head>',mathjax4+'</head>',1)

          summary=[]

          for pdef in cfg['pages']:
              page=Path(pdef['page'])
              key=page.stem
              imgdir=pdef['image_dir'].split('/',1)[1]
              nums=[x['image'][5:8] for x in pdef['formulas']]
              alt='|'.join(nums)

              pat=re.compile(
                  rf'(?P<block><(?:div|span)\b(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<bnum>{alt})\.png["\'])[^>]*>.*?</(?:div|span)>)'
                  rf'|(?P<img><p\b(?=[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'])[^>]*>\s*<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{alt})\.png["\'][^>]*>\s*</p>)',
                  flags=re.I|re.S)

              def guard(text):
                  return re.sub(r'\s+',' ',pat.sub('<FORMULA/>',strip_mathjax(text))).strip()

              raw=page.read_bytes()
              enc=None
              original=None
              for candidate in ('cp932','utf-8'):
                  try:
                      original=raw.decode(candidate)
                      enc=candidate
                      break
                  except UnicodeDecodeError:
                      pass
              if enc is None:
                  raise RuntimeError(f'{page}: decode failed')

              before=guard(original)
              matches=list(pat.finditer(original))
              found=[m.group('inum') or m.group('bnum') for m in matches]
              if found!=nums:
                  raise RuntimeError(f'{page}: sequence mismatch {found} != {nums}')

              bynum={x['image'][5:8]:x for x in pdef['formulas']}
              pos=[0]
              def repl(_m):
                  n=nums[pos[0]]
                  pos[0]+=1
                  item=bynum[n]
                  if item['type']=='rich':
                      return (
                          f'<div class="formula-rich-block" id="formula-{key}-{n}" '
                          f'data-source-image="./../img/{imgdir}/image{n}.png">\n'
                          f'{item["html"]}\n</div>'
                      )
                  return (
                      f'<div class="math-block" id="formula-{key}-{n}" '
                      f'data-source-image="./../img/{imgdir}/image{n}.png">\n'
                      f'{item["latex"]}\n</div>'
                  )

              applied=add_mathjax(pat.sub(repl,original))

              if guard(applied)!=before:
                  raise RuntimeError(f'{page}: non-formula content changed')

              mapped=re.findall(
                  rf'data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
                  applied,flags=re.I)
              if mapped!=nums:
                  raise RuntimeError(f'{page}: mapped sequence mismatch {mapped}')

              leftovers=re.findall(
                  rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?:{alt})\.png["\'][^>]*>',
                  applied,flags=re.I)
              if leftovers:
                  raise RuntimeError(f'{page}: target images remain {len(leftovers)}')

              page.write_bytes(applied.encode(enc))
              summary.append((page.as_posix(),len(nums),sum(1 for x in pdef['formulas'] if x['type']=='rich'),enc))

          total=sum(x[1] for x in summary)
          if total!=11:
              raise RuntimeError(f'total blocks {total} != 11')

          report=Path('.document/formula_reviews/REMAINING_FEM_NORMAL_APPLY_RESULT.md')
          lines=[
              '# Remaining FEM Normal Apply Result','',
              '- Certified mathematical source images replaced: **11 / 11**',
              '- Pure MathJax blocks: **10**',
              '- HTML prose + MathJax blocks: **1**',
              '- Target source image tags remaining: **0**',
              '- Non-formula content guards: **PASS**',
              '- MathJax: v4',
              '- Production deployment: not performed.','',
              '| Page | Blocks | Rich blocks | Encoding |',
              '|---|---:|---:|---|'
          ]
          for page,count,rich,enc in summary:
              lines.append(f'| `{page}` | {count} | {rich} | {enc} |')
          report.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('remaining FEM PASS blocks=11 pages=6')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fem/fem_3.html fem/fem_6_1_2.html fem/fem_6_1_3.html fem/fem_6_1_4.html fem/fem_8.html fem/fem_4.html \
                  .document/formula_reviews/REMAINING_FEM_NORMAL_APPLY_RESULT.md
          git commit -m 'feat: apply certified remaining FEM formulas'
          git push origin HEAD:develop
