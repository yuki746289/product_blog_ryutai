name: Convert FEM 7.2.2 MathJax

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/convert-fem-7-2-2-mathjax.yml'
      - '.github/scripts/convert-fem-7-2-2-mathjax.py'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Convert formulas
        run: python3 .github/scripts/convert-fem-7-2-2-mathjax.py

      - name: Static validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('fem/fem_7_2_2.html').read_bytes().decode('cp932')
          assert 'charset=shift_jis' in text.lower()
          assert 'tex-mml-chtml.js' in text
          assert text.count('data-source-image="./../img/fem_d_momentum_tet.files/image') == 51
          ids = re.findall(r'id="(formula-fem-7-2-2-[^"]+)"', text)
          assert len(ids) == 51, len(ids)
          assert len(ids) == len(set(ids)), 'formula IDs must be unique'
          for n in range(1, 50):
              src = f'./../img/fem_d_momentum_tet.files/image{n:03d}.png'
              assert not re.search(r'<img\b[^>]*\bsrc=["\']' + re.escape(src) + r'["\']', text, re.I), src
              assert f'formula-fem-7-2-2-{n:03d}' in text
          for token in [
              r'\mathbf b_S=A_S^T', r'\in\mathbb R^4', r'\frac{2K^*}{3We}',
              r'[S_{zz}]', r'[H_z]', r'\{V_z\}^{\tau+\Delta\tau}',
              r'i=1,2,3', r'\mathbf 0_4'
          ]:
              assert token in text, token
          assert '以下では \\(\\mathbf b_S=' in text
          print('Static validation passed: 49 unique equations / 51 rendered source positions.')
          PY

      - name: Browser rendering validation
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/fem722-http.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 2
          mkdir -p /tmp/fem722

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,1200 --virtual-time-budget=10000 \
            --dump-dom \
            'http://127.0.0.1:8000/fem/fem_7_2_2.html#formula-fem-7-2-2-042' \
            > /tmp/fem722/mobile-dom.html
          grep -q '<mjx-container' /tmp/fem722/mobile-dom.html
          test "$(grep -o '<mjx-container' /tmp/fem722/mobile-dom.html | wc -l)" -ge 51
          grep -q 'formula-fem-7-2-2-031-repeat-2' /tmp/fem722/mobile-dom.html
          grep -q 'formula-fem-7-2-2-037-repeat-2' /tmp/fem722/mobile-dom.html

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,1200 --virtual-time-budget=10000 \
            --screenshot=/tmp/fem722/mobile-surface.png \
            'http://127.0.0.1:8000/fem/fem_7_2_2.html#formula-fem-7-2-2-042'
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1365,1100 --virtual-time-budget=10000 \
            --screenshot=/tmp/fem722/desktop-final.png \
            'http://127.0.0.1:8000/fem/fem_7_2_2.html#formula-fem-7-2-2-047'
          test -s /tmp/fem722/mobile-surface.png
          test -s /tmp/fem722/desktop-final.png

      - name: Commit converted page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fem/fem_7_2_2.html
          git commit -m "feat: convert tetrahedral momentum discretization to MathJax"
          git push origin HEAD:develop

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: fem-7-2-2-mathjax
          path: /tmp/fem722/*.png
          retention-days: 7
