name: Cleanup Temporary Branches

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/cleanup-temp-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Delete temporary setup branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            noop \
            tmp-ignore \
            tmp-ignore-2 \
            tmp-ignore-3 \
            tmp-ignore-4 \
            tmp-ignore-5 \
            tmp-ignore-6 \
            tmp-ignore-7
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
