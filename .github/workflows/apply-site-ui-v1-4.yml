name: Verify Site UI v1.4 Final

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/apply-site-ui-v1-4.yml'

permissions:
  contents: read

jobs:
  verify-final:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Install Japanese fonts and browser dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
          python3 -m pip install --quiet selenium

      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/site-ui-http.log 2>&1 &
          echo $! > /tmp/site-ui-http.pid
          sleep 2

      - name: Browser, wheel-scroll, background and screenshot checks
        run: python3 .github/scripts/verify_site_ui_v1_4_browser.py

      - name: Upload final visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-ui-v1-4-final-evidence
          path: /tmp/site-ui-v1-4/*.png
          if-no-files-found: ignore
          retention-days: 7
