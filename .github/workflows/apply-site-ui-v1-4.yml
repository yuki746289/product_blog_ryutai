name: Apply and Verify Site UI v1.4

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/apply-site-ui-v1-4.yml'

permissions:
  contents: write

jobs:
  apply-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply and statically verify v1.4
        run: python3 .github/scripts/run_site_ui_v1_4.py

      - name: Install browser test dependency
        run: python3 -m pip install --quiet selenium

      - name: Start local server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/site-ui-http.log 2>&1 &
          echo $! > /tmp/site-ui-http.pid
          sleep 2

      - name: Browser, wheel-scroll and screenshot checks
        run: python3 .github/scripts/verify_site_ui_v1_4_browser.py

      - name: Commit verified changes
        run: |
          git config user.name 'takapi'
          git config user.email 'yuki_taka83@hotmail.com'
          git add css/math.css css/responsive.css menu.html index.html footer.html \
            fem/fem_6_2_6.html fem/fem_7_1_1.html fem/fem_7_1_2.html fem/fem_7_2_1.html fem/fem_7_2_2.html
          git diff --cached --quiet && { echo 'No implementation changes found'; exit 1; }
          git commit -m 'fix: improve formula and mobile menu display'
          git push origin HEAD:develop

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-ui-v1-4-evidence
          path: /tmp/site-ui-v1-4/*.png
          if-no-files-found: ignore
          retention-days: 7
