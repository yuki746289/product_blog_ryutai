name: Apply certified remaining Heat formulas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-remaining-heat.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply certified formulas only
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          cfg=json.loads(Path('.document/formula_reviews/remaining_heat_formulas.json').read_text(encoding='utf-8'))

          mathjax4 = "\n\t<script>\n\twindow.MathJax={\n\t\toutput:{displayOverflow:'linebreak',linebreaks:{inline:true,width:'100%',lineleading:0.2}},\n\t\tchtml:{displayAlign:'left',displayIndent:'0'}\n\t};\n\t</script>\n\t<script defer src=\"https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js\"></script>\n"

          def strip_mathjax(text):
              text=re.sub(r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>','',text,flags=re.I|re.S)
              text=re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>','',text,flags=re.I|re.S)
              return text

          def add_mathjax(text):
              text=strip_mathjax(text)
              if '</head>' not in text:
                  raise RuntimeError('missing </head>')
              return text.replace('</head>',mathjax4+'</head>',1)

          diagram_pages={
              'heat_4_1','heat_4_2','heat_4_3','heat_5_1',
              'heat_5_2','heat_5_3','heat_5_4'
          }

          summary=[]
          for pdef in cfg['pages']:
              page=Path(pdef['page'])
              key=page.stem
              imgdir=pdef['image_dir'].split('/',1)[1]
              nums=[x['image'][5:8] for x in pdef['formulas']]
              alt='|'.join(nums)

              pat=re.compile(
                  rf'(?P<block><div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<bnum>{alt})\.png["\'])[^>]*>.*?</div>)'
                  rf'|(?P<img><p\b(?=[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'])[^>]*>\s*<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{alt})\.png["\'][^>]*>\s*</p>)',
                  flags=re.I|re.S)

              def guard(text):
                  return re.sub(r'\s+',' ',pat.sub('<FORMULA/>',strip_mathjax(text))).strip()

              raw=page.read_bytes()
              try:
                  original=raw.decode('cp932')
                  enc='cp932'
              except UnicodeDecodeError:
                  original=raw.decode('utf-8')
                  enc='utf-8'

              before=guard(original)
              matches=list(pat.finditer(original))
              found=[m.group('inum') or m.group('bnum') for m in matches]
              if found!=nums:
                  raise RuntimeError(f'{page}: formula sequence mismatch {found} != {nums}')

              bynum={x['image'][5:8]:x for x in pdef['formulas']}
              pos=[0]
              def repl(_m):
                  n=nums[pos[0]]
                  pos[0]+=1
                  return (
                      f'<div class="math-block" id="formula-{key}-{n}" '
                      f'data-source-image="./../img/{imgdir}/image{n}.png">\n'
                      f'{bynum[n]["latex"]}\n</div>'
                  )

              applied=pat.sub(repl,original)
              applied=add_mathjax(applied)

              if guard(applied)!=before:
                  raise RuntimeError(f'{page}: non-formula content changed')

              mapped=re.findall(
                  rf'data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
                  applied,flags=re.I)
              if mapped!=nums:
                  raise RuntimeError(f'{page}: mapped sequence mismatch {mapped}')

              leftovers=re.findall(
                  rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?:{alt})\.png["\'][^>]*>',
                  applied,flags=re.I)
              if leftovers:
                  raise RuntimeError(f'{page}: target formula images remain {len(leftovers)}')

              diagram_count=len(re.findall(
                  rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image001\.png["\'][^>]*>',
                  applied,flags=re.I))
              expected_diagram=1 if key in diagram_pages else 0
              if diagram_count!=expected_diagram:
                  raise RuntimeError(
                      f'{page}: image001 diagram count {diagram_count} != {expected_diagram}')

              page.write_bytes(applied.encode(enc))
              summary.append((page.as_posix(),len(nums),enc,diagram_count))

          total=sum(x[1] for x in summary)
          if total!=16:
              raise RuntimeError(f'total formulas {total} != 16')

          report=Path('.document/formula_reviews/REMAINING_HEAT_NORMAL_APPLY_RESULT.md')
          lines=[
              '# Remaining Heat Normal Apply Result','',
              '- Certified formulas applied: **16 / 16**',
              '- Target formula image tags remaining: **0**',
              '- Diagram assets preserved unchanged on formula-bearing pages.',
              '- Non-formula content guards: **PASS**',
              '- MathJax: v4',
              '- Production deployment: not performed.','',
              '| Page | Formulas | Encoding | Preserved image001 diagrams |',
              '|---|---:|---|---:|'
          ]
          for page,count,enc,diag in summary:
              lines.append(f'| `{page}` | {count} | {enc} | {diag} |')
          report.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('remaining heat PASS formulas=16 pages=8')
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heat/heat_3.html heat/heat_4_1.html heat/heat_4_2.html heat/heat_4_3.html \
                  heat/heat_5_1.html heat/heat_5_2.html heat/heat_5_3.html heat/heat_5_4.html \
                  .document/formula_reviews/REMAINING_HEAT_NORMAL_APPLY_RESULT.md
          git commit -m 'feat: apply certified remaining heat formulas'
          git push origin HEAD:develop
