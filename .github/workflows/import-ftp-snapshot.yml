name: Import Current FTP Snapshot

on:
  push:
    paths:
      - '.github/workflows/import-ftp-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    if: github.ref == 'refs/heads/import-current-site'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: import-current-site
          fetch-depth: 0

      - name: Download current site from FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import ftplib
          import os
          import pathlib
          import shutil
          from urllib.parse import urlparse

          server = os.environ.get('FTP_SERVER', '').strip()
          username = os.environ.get('FTP_USERNAME', '').strip()
          password = os.environ.get('FTP_PASSWORD', '').strip()
          if not all((server, username, password)):
              raise SystemExit('FTP secrets are missing')

          if '://' in server:
              p = urlparse(server)
              host = p.hostname or ''
              port = p.port or 21
          else:
              parts = server.rsplit(':', 1)
              if len(parts) == 2 and parts[1].isdigit():
                  host, port = parts[0], int(parts[1])
              else:
                  host, port = server, 21

          root = pathlib.Path('_ftp_snapshot')
          if root.exists():
              shutil.rmtree(root)
          root.mkdir()

          ftp = ftplib.FTP_TLS(timeout=30)
          # This legacy Japanese site stores some FTP path names in CP932/Shift-JIS.
          ftp.encoding = 'cp932'
          ftp.connect(host, port)
          ftp.login(username, password)
          ftp.prot_p()
          ftp.set_pasv(True)

          def safe_name(name):
              return pathlib.PurePosixPath(name).name

          def download_dir(remote_dir, local_dir):
              local_dir.mkdir(parents=True, exist_ok=True)
              ftp.cwd(remote_dir)
              entries = list(ftp.mlsd())
              for name, facts in entries:
                  if name in ('.', '..'):
                      continue
                  typ = facts.get('type', '')
                  if typ == 'dir':
                      download_dir(name, local_dir / safe_name(name))
                      ftp.cwd('..')
                  elif typ == 'file':
                      with open(local_dir / safe_name(name), 'wb') as f:
                          ftp.retrbinary(f'RETR {name}', f.write)

          try:
              download_dir('/', root)
          finally:
              try:
                  ftp.quit()
              except Exception:
                  pass

          count = sum(1 for p in root.rglob('*') if p.is_file())
          print(f'Downloaded files: {count}')
          if count == 0:
              raise SystemExit('No files downloaded')
          if not (root / 'index.html').exists():
              raise SystemExit('index.html was not downloaded')
          PY

      - name: Copy snapshot into repository root
        run: |
          shopt -s dotglob nullglob
          for item in _ftp_snapshot/*; do
            name="$(basename "$item")"
            if [ "$name" = ".git" ] || [ "$name" = ".github" ]; then
              continue
            fi
            rm -rf -- "$name"
            cp -a -- "$item" "$name"
          done
          rm -rf _ftp_snapshot

      - name: Commit imported production snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "chore: import current production FTP snapshot"
            git push origin HEAD:import-current-site
          fi
