name: Import Current FTP Snapshot

on:
  push:
    paths:
      - '.github/workflows/import-ftp-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    if: github.ref == 'refs/heads/import-current-site'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          ref: import-current-site
          fetch-depth: 0

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Resolve FTP endpoint
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          from urllib.parse import urlparse

          server = os.environ.get('FTP_SERVER', '').strip()
          username = os.environ.get('FTP_USERNAME', '').strip()
          password = os.environ.get('FTP_PASSWORD', '').strip()
          if not all((server, username, password)):
              raise SystemExit('FTP secrets are missing')

          if '://' in server:
              p = urlparse(server)
              host = p.hostname or ''
              port = p.port or 21
          else:
              parts = server.rsplit(':', 1)
              if len(parts) == 2 and parts[1].isdigit():
                  host, port = parts[0], int(parts[1])
              else:
                  host, port = server, 21

          if not host:
              raise SystemExit('FTP_SERVER does not contain a valid host')

          print(f'FTP_HOST={host}')
          print(f'FTP_PORT={port}')
          PY

      - name: Download current site from FTPS
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          rm -rf _ftp_snapshot
          mkdir -p _ftp_snapshot

          # Preserve remote path bytes as-is. The legacy site contains filenames
          # created under more than one Japanese encoding, so no charset conversion
          # is applied during the snapshot import.
          lftp -u "$(printf '%s' "$FTP_USERNAME" | xargs)","$(printf '%s' "$FTP_PASSWORD" | xargs)" -p "$FTP_PORT" "$FTP_HOST" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 3
          set xfer:clobber true
          set ftp:charset ""
          set file:charset ""
          mirror --verbose=1 --parallel=6 --no-perms --no-umask / _ftp_snapshot
          bye
          LFTP

          test -f _ftp_snapshot/index.html
          echo "Downloaded files: $(find _ftp_snapshot -type f | wc -l)"
          echo "Downloaded bytes: $(du -sb _ftp_snapshot | awk '{print $1}')"

      - name: Copy snapshot into repository root
        shell: bash
        run: |
          shopt -s dotglob nullglob
          for item in _ftp_snapshot/*; do
            name="$(basename "$item")"
            if [ "$name" = ".git" ] || [ "$name" = ".github" ]; then
              continue
            fi
            rm -rf -- "$name"
            cp -a -- "$item" "$name"
          done
          rm -rf _ftp_snapshot

      - name: Commit imported production snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "chore: import current production FTP snapshot"
            git push origin HEAD:import-current-site
          fi
