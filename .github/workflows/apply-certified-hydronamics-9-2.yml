name: Apply certified Hydronamics 9_2 formulas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-hydronamics-9-2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Apply certified formulas only
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          page=Path('hydronamics/hydronamics_9_2.html')
          cfg=json.loads(Path('.document/formula_reviews/hydronamics_9_2_formulas.json').read_text(encoding='utf-8'))
          imgdir='hydronamics_stress_vertical.files'
          nums=[x['image'][5:8] for x in cfg['formulas']]
          bynum={x['image'][5:8]:x for x in cfg['formulas']}

          mathjax4 = """
	<script>
	window.MathJax={
		output:{displayOverflow:'linebreak',linebreaks:{inline:true,width:'100%',lineleading:0.2}},
		chtml:{displayAlign:'left',displayIndent:'0'}
	};
	</script>
	<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
"""

          raw=page.read_bytes(); enc=None
          for candidate in ('cp932','utf-8'):
            try: original=raw.decode(candidate); enc=candidate; break
            except UnicodeDecodeError: pass
          if enc is None: raise RuntimeError('encoding failed')

          def strip_mathjax(text):
            text=re.sub(r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>','',text,flags=re.I|re.S)
            text=re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>','',text,flags=re.I|re.S)
            return text

          alt='|'.join(nums)
          pat=re.compile(
            rf'(?P<block><div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<bnum>{alt})\.png["\'])[^>]*>.*?</div>)'
            rf'|(?P<img><p\b(?=[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'])[^>]*>\s*<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{alt})\.png["\'][^>]*>\s*</p>)',
            flags=re.I|re.S)

          matches=list(pat.finditer(original))
          found=[m.group('inum') or m.group('bnum') for m in matches]
          if found!=nums: raise RuntimeError(f'sequence {found} != {nums}')

          def guard(text):
            text=strip_mathjax(text)
            text=pat.sub('<FORMULA/>',text)
            return re.sub(r'\s+',' ',text).strip()
          before=guard(original)

          pos=[0]
          def repl(_m):
            n=nums[pos[0]]; pos[0]+=1
            return (f'<div class="math-block" id="formula-hydronamics-9-2-{n}" '
                    f'data-source-image="./../img/{imgdir}/image{n}.png">\n'
                    f'{bynum[n]["latex"]}\n</div>')
          applied=pat.sub(repl,original)
          applied=strip_mathjax(applied)
          if '</head>' not in applied: raise RuntimeError('missing head')
          applied=applied.replace('</head>',mathjax4+'</head>',1)

          if guard(applied)!=before: raise RuntimeError('non-formula content changed')

          mapped=re.findall(
            rf'<div\b[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'][^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
            applied,flags=re.I)
          if mapped!=nums: raise RuntimeError(f'mapped {mapped} != {nums}')

          leftovers=re.findall(
            rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?:{alt})\.png["\'][^>]*>',
            applied,flags=re.I)
          if leftovers: raise RuntimeError(f'target images remain {len(leftovers)}')

          diag=len(re.findall(
            rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image001\.png["\'][^>]*>',
            applied,flags=re.I))
          if diag!=1: raise RuntimeError(f'diagram count {diag} != 1')

          page.write_bytes(applied.encode(enc))
          Path('.document/formula_reviews/HYDRONAMICS_9_2_NORMAL_APPLY_RESULT.md').write_text(
            '# Hydronamics 9_2 Normal Apply Result\n\n'
            '- Certified formulas applied: **9 / 9**\n'
            '- Target formula image tags remaining: **0**\n'
            '- Diagram image001 preserved unchanged.\n'
            '- Non-formula content guard: **PASS**\n'
            '- MathJax: v4\n'
            '- Production deployment: not performed.\n',encoding='utf-8')
          print('PASS formulas=9 diagram=1 encoding='+enc)
          PY
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hydronamics/hydronamics_9_2.html .document/formula_reviews/HYDRONAMICS_9_2_NORMAL_APPLY_RESULT.md
          git commit -m 'feat: apply certified hydronamics 9_2 formulas'
          git push origin HEAD:develop
