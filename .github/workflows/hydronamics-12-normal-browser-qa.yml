# rerun after certified formula apply 2026-09-18
name: Hydronamics 12 Normal Browser QA

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/hydronamics-12-normal-browser-qa.yml'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/h12-normal-qa-http.log 2>&1 &
          sleep 1

      - name: Run desktop and mobile QA
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          file='hydronamics/hydronamics_12.html'
          imgdir='hydronamics_dimensionless.files'
          viewports={'desktop':{'width':1440,'height':1000},'mobile':{'width':390,'height':844}}
          out=Path('hydronamics-12-normal-qa'); out.mkdir(exist_ok=True)
          results=[]; failures=[]

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True)
            for vp_name,vp in viewports.items():
              ctx=browser.new_context(viewport=vp,device_scale_factor=1)
              page=ctx.new_page()
              page_errors=[]
              page.on('pageerror',lambda exc,store=page_errors:store.append(str(exc)))
              page.goto('http://127.0.0.1:8000/'+file,wait_until='domcontentloaded',timeout=120000)
              page.wait_for_function('() => window.MathJax && MathJax.startup && MathJax.startup.promise',timeout=60000)
              page.evaluate('async()=>{await MathJax.startup.promise;}')
              page.wait_for_timeout(500)

              blocks=page.locator(f'div.math-block[data-source-image*="{imgdir}/image"]')
              block_count=blocks.count()
              img_count=page.locator(f'img[src*="{imgdir}/image"]').count()
              merror=page.locator('mjx-merror').count()
              unrendered=0; local_scroll=0; uncontained=0
              for i in range(block_count):
                el=blocks.nth(i)
                if el.locator('mjx-container').count()<1:
                  unrendered+=1
                dims=el.evaluate('(e)=>({clientWidth:e.clientWidth,scrollWidth:e.scrollWidth,overflowX:getComputedStyle(e).overflowX})')
                if dims['scrollWidth']>dims['clientWidth']+1:
                  local_scroll+=1
                  if vp_name=='desktop' or dims['overflowX'] not in ('auto','scroll'):
                    uncontained+=1

              pd=page.evaluate('() => ({cw:document.documentElement.clientWidth,sw:document.documentElement.scrollWidth})')
              page_overflow=pd['sw']>pd['cw']+2
              shotdir=out/vp_name; shotdir.mkdir(parents=True,exist_ok=True)
              page.screenshot(path=str(shotdir/'full.png'),full_page=True,animations='disabled')

              row={
                'viewport':vp_name,'formula_blocks':block_count,'expected_formula_blocks':4,
                'retained_images':img_count,'expected_retained_images':0,
                'mathjax_errors':merror,'unrendered':unrendered,'local_scroll':local_scroll,
                'uncontained':uncontained,'page_overflow':page_overflow,'page_errors':page_errors
              }
              results.append(row)
              if block_count!=4: failures.append(f'{vp_name}: blocks {block_count} != 4')
              if img_count!=0: failures.append(f'{vp_name}: retained images {img_count} != 0')
              if merror: failures.append(f'{vp_name}: MathJax errors {merror}')
              if unrendered: failures.append(f'{vp_name}: unrendered {unrendered}')
              if uncontained: failures.append(f'{vp_name}: uncontained overflow {uncontained}')
              if page_overflow: failures.append(f'{vp_name}: page overflow')
              if page_errors: failures.append(f'{vp_name}: page errors {page_errors}')
              print(row)
              ctx.close()
            browser.close()

          status='PASS' if not failures else 'FAIL'
          (out/'manifest.json').write_text(json.dumps({'status':status,'results':results,'failures':failures},ensure_ascii=False,indent=2),encoding='utf-8')

          report=Path('.document/formula_reviews/HYDRONAMICS_12_NORMAL_BROWSER_QA_20260918.md')
          lines=[
            '# Hydronamics 12 Normal Browser QA — 2026-09-18','',
            f'- Overall: **{status}**',
            '- Browser: Chromium / Playwright',
            '- Viewports: desktop 1440×1000, mobile 390×844',
            '- Expected formula blocks: 4',
            '- Expected retained diagram images: 0',
            '- Production deployment: not performed.','',
            '| Viewport | Blocks | Retained images | MathJax errors | Unrendered | Local scroll | Uncontained | Page overflow |',
            '|---|---:|---:|---:|---:|---:|---:|---|'
          ]
          for r in results:
            lines.append(
              f"| {r['viewport']} | {r['formula_blocks']}/{r['expected_formula_blocks']} | "
              f"{r['retained_images']}/{r['expected_retained_images']} | {r['mathjax_errors']} | "
              f"{r['unrendered']} | {r['local_scroll']} | {r['uncontained']} | "
              f"{'YES' if r['page_overflow'] else 'NO'} |")
          lines += ['', '## Failures', '']
          lines += [f'- {x}' for x in failures] if failures else ['- None.']
          report.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          if failures:
            raise SystemExit(1)
          PY

      - name: Commit QA report
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .document/formula_reviews/HYDRONAMICS_12_NORMAL_BROWSER_QA_20260918.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: record hydronamics 12 normal browser QA'
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hydronamics-12-normal-qa
          path: hydronamics-12-normal-qa
          retention-days: 7
