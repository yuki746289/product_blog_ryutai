name: Apply certified Hydronamics 6_4 formulas

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/apply-certified-hydronamics-6-4.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply certified formulas only
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path

          page=Path('hydronamics/hydronamics_6_4.html')
          cfg=json.loads(Path('.document/formula_reviews/hydronamics_6_4_formulas.json').read_text(encoding='utf-8'))
          imgdir='hydronamics_f_gravity.files'
          display=[x for x in cfg['formulas'] if x.get('mode','display')!='inline']
          inline=[x for x in cfg['formulas'] if x.get('mode')=='inline']
          dnums=[x['image'][5:8] for x in display]
          inums=[x['image'][5:8] for x in inline]
          if len(display)!=5 or len(inline)!=1:
              raise RuntimeError(f'formula modes display={len(display)} inline={len(inline)}')

          dalt='|'.join(dnums)
          ialt='|'.join(inums)
          bynum={x['image'][5:8]:x for x in cfg['formulas']}

          mathjax4 = "\n\t<script>\n\twindow.MathJax={\n\t\toutput:{displayOverflow:'linebreak',linebreaks:{inline:true,width:'100%',lineleading:0.2}},\n\t\tchtml:{displayAlign:'left',displayIndent:'0'}\n\t};\n\t</script>\n\t<script defer src=\"https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js\"></script>\n"

          raw=page.read_bytes()
          enc=None
          for candidate in ('cp932','utf-8'):
              try:
                  original=raw.decode(candidate)
                  enc=candidate
                  break
              except UnicodeDecodeError:
                  pass
          if enc is None:
              raise RuntimeError('encoding failed')

          def strip_mathjax(text):
              text=re.sub(r'\s*<script>\s*window\.MathJax\s*=\s*\{.*?</script>','',text,flags=re.I|re.S)
              text=re.sub(r'\s*<script\b[^>]*src=["\'][^"\']*mathjax[^"\']*["\'][^>]*>\s*</script>','',text,flags=re.I|re.S)
              return text

          dp=re.compile(
              rf'(?P<block><div\b(?=[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<bnum>{dalt})\.png["\'])[^>]*>.*?</div>)'
              rf'|(?P<img><p\b(?=[^>]*class=["\'][^"\']*\bim\b[^"\']*["\'])[^>]*>\s*<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{dalt})\.png["\'][^>]*>\s*</p>)',
              flags=re.I|re.S)

          ip=re.compile(
              rf'(?P<span><span\b(?=[^>]*class=["\'][^"\']*\bmath-inline\b[^"\']*["\'])(?=[^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(?P<snum>{ialt})\.png["\'])[^>]*>.*?</span>)'
              rf'|(?P<img><img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?P<inum>{ialt})\.png["\'][^>]*>)',
              flags=re.I|re.S)

          def guard(text):
              text=strip_mathjax(text)
              text=dp.sub('<DISPLAY_FORMULA/>',text)
              text=ip.sub('<INLINE_FORMULA/>',text)
              return re.sub(r'\s+',' ',text).strip()

          before=guard(original)
          dfound=[m.group('inum') or m.group('bnum') for m in dp.finditer(original)]
          ifound=[m.group('inum') or m.group('snum') for m in ip.finditer(original)]
          if dfound!=dnums:
              raise RuntimeError(f'display sequence {dfound} != {dnums}')
          if ifound!=inums:
              raise RuntimeError(f'inline sequence {ifound} != {inums}')

          dpos=[0]
          def drepl(_m):
              n=dnums[dpos[0]]
              dpos[0]+=1
              return (
                  f'<div class="math-block" id="formula-hydronamics-6-4-{n}" '
                  f'data-source-image="./../img/{imgdir}/image{n}.png">\n'
                  f'{bynum[n]["latex"]}\n</div>'
              )

          ipos=[0]
          def irepl(_m):
              n=inums[ipos[0]]
              ipos[0]+=1
              return (
                  f'<span class="math-inline" id="formula-hydronamics-6-4-{n}" '
                  f'data-source-image="./../img/{imgdir}/image{n}.png">'
                  f'{bynum[n]["latex"]}</span>'
              )

          applied=dp.sub(drepl,original)
          applied=ip.sub(irepl,applied)
          applied=strip_mathjax(applied)
          if '</head>' not in applied:
              raise RuntimeError('missing </head>')
          applied=applied.replace('</head>',mathjax4+'</head>',1)

          if guard(applied)!=before:
              raise RuntimeError('non-formula content changed')

          dmapped=re.findall(
              rf'<div\b[^>]*class=["\'][^"\']*\bmath-block\b[^"\']*["\'][^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
              applied,flags=re.I)
          imapped=re.findall(
              rf'<span\b[^>]*class=["\'][^"\']*\bmath-inline\b[^"\']*["\'][^>]*data-source-image=["\'][^"\']*{re.escape(imgdir)}/image(\d{{3}})\.png["\']',
              applied,flags=re.I)
          if dmapped!=dnums:
              raise RuntimeError(f'display mapped {dmapped} != {dnums}')
          if imapped!=inums:
              raise RuntimeError(f'inline mapped {imapped} != {inums}')

          alt='|'.join(dnums+inums)
          leftovers=re.findall(
              rf'<img\b[^>]*src=["\'][^"\']*{re.escape(imgdir)}/image(?:{alt})\.png["\'][^>]*>',
              applied,flags=re.I)
          if leftovers:
              raise RuntimeError(f'target images remain {len(leftovers)}')

          diagram_count=applied.count(f'src="./../img/{imgdir}/image001.png"')
          if diagram_count != 1:
              raise RuntimeError(f'diagram count {diagram_count} != 1')

          page.write_bytes(applied.encode(enc))
          Path('.document/formula_reviews/HYDRONAMICS_6_4_NORMAL_APPLY_RESULT.md').write_text(
              '# Hydronamics 6_4 Normal Apply Result\n\n'
              '- Certified formulas applied: **6 / 6**\n'
              '- Display formulas: **5**\n'
              '- Inline formulas: **1**\n'
              '- Target formula image tags remaining: **0**\n'
              '- Diagram image001 preserved unchanged.\n'
              '- Non-formula content guard: **PASS**\n'
              '- MathJax: v4\n'
              '- Production deployment: not performed.\n',
              encoding='utf-8')
          print('PASS display=5 inline=1 encoding='+enc)
          PY

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hydronamics/hydronamics_6_4.html .document/formula_reviews/HYDRONAMICS_6_4_NORMAL_APPLY_RESULT.md
          git commit -m 'feat: apply certified hydronamics 6_4 formulas'
          git pull --rebase origin develop
          git push origin HEAD:develop
