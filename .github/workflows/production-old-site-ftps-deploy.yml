name: Production Old Site FTPS Deploy

on:
  push:
    branches: [develop]
    paths:
      - '.document/deploy/PRODUCTION_OLD_DEPLOY.trigger'

permissions:
  contents: read

jobs:
  deploy-old:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release_1.0.0
          fetch-depth: 1

      - name: Build legacy publish staging
        shell: bash
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          PUBLIC_DIRS = {
              "appendix","book","column","counting","fem","fortran","heat","html",
              "hydronamics","introduce","library","link","mail","math","mesh","mps",
              "pdf","physics","profile","sitemap","css","img"
          }
          EXTS = {
              ".html",".htm",".css",".js",".png",".gif",".jpg",".jpeg",
              ".svg",".webp",".ico",".xml",".txt",".pdf",".woff",".woff2",".ttf"
          }

          root=Path(".")
          stage=Path("_old_publish")
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir()

          candidates=[]
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              rel=p.as_posix().lstrip("./")
              parts=Path(rel).parts
              if any(part.startswith(".") for part in parts):
                  continue
              if rel.startswith("_old_publish/"):
                  continue
              if len(parts)>1 and parts[0] not in PUBLIC_DIRS:
                  continue
              if p.suffix.lower() not in EXTS:
                  continue
              candidates.append(rel)

          for rel in sorted(set(candidates)):
              src=Path(rel)
              dst=stage/rel
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(src,dst)

          print(f"legacy publish files={len(set(candidates))}")
          print(f"legacy publish bytes={sum((stage/p).stat().st_size for p in set(candidates))}")
          PY

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Resolve FTPS endpoint
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os
          from urllib.parse import urlparse

          server=os.environ.get("FTP_SERVER","").strip()
          username=os.environ.get("FTP_USERNAME","").strip()
          password=os.environ.get("FTP_PASSWORD","").strip()
          if not all((server,username,password)):
              raise SystemExit("FTP secrets are missing")

          if "://" in server:
              p=urlparse(server)
              host=p.hostname or ""
              port=p.port or 21
          else:
              parts=server.rsplit(":",1)
              if len(parts)==2 and parts[1].isdigit():
                  host,port=parts[0],int(parts[1])
              else:
                  host,port=server,21
          if not host:
              raise SystemExit("FTP_SERVER does not contain a valid host")
          print(f"FTP_HOST={host}")
          print(f"FTP_PORT={port}")
          PY

      - name: Upload release_1.0.0 to remote old directory
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$(printf '%s' "$FTP_USERNAME" | xargs)","$(printf '%s' "$FTP_PASSWORD" | xargs)" -p "$FTP_PORT" "$FTP_HOST" <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set net:timeout 30
          set net:max-retries 3
          set net:reconnect-interval-base 3
          set xfer:clobber true
          mirror --reverse --verbose=1 --parallel=8 --no-perms --no-umask _old_publish/ /old/
          bye
          LFTP

      - name: Verify production old site
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request

          base="https://ryutai.ninja-web.net/old/"
          checks={
              "index.html":["2016.5.20","2016.5.22"],
              "mps/mps_1.html":["重み関数"],
              "fem/fem_7_1_2.html":["運動量"],
              "css/lib.css":["wrapper"],
          }
          for path,needles in checks.items():
              req=urllib.request.Request(base+path,headers={"User-Agent":"Mozilla/5.0 old-site-smoke"})
              with urllib.request.urlopen(req,timeout=20) as res:
                  if res.status != 200:
                      raise SystemExit(f"{path}: HTTP {res.status}")
                  raw=res.read()
              # Legacy pages may not all be UTF-8. Decode permissively only for smoke markers.
              text=None
              for enc in ("utf-8","cp932","shift_jis"):
                  try:
                      text=raw.decode(enc)
                      break
                  except UnicodeDecodeError:
                      pass
              if text is None:
                  text=raw.decode("latin1")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"{path}: missing expected marker {needle!r}")
              print(f"PASS {path}")
          print("Production old-site smoke: PASS")
          PY

      - name: Browser smoke for old site
        shell: bash
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium >/dev/null
          python3 - <<'PY'
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          base="https://ryutai.ninja-web.net/old/"
          targets=["index.html","mps/mps_1.html","fem/fem_7_1_2.html"]
          failures=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              try:
                  for label,vp in {
                      "desktop":{"width":1440,"height":1000},
                      "mobile":{"width":390,"height":844},
                  }.items():
                      ctx=browser.new_context(viewport=vp)
                      def route_handler(route):
                          u=urlparse(route.request.url)
                          if u.hostname=="ryutai.ninja-web.net" or not u.hostname:
                              route.continue_()
                          else:
                              route.abort()
                      ctx.route("**/*",route_handler)
                      try:
                          for rel in targets:
                              page=ctx.new_page()
                              try:
                                  res=page.goto(base+rel,wait_until="domcontentloaded",timeout=30000)
                                  if not res or res.status != 200:
                                      failures.append(f"{label} {rel}: HTTP {res.status if res else 'none'}")
                                      continue
                                  result=page.evaluate("""() => {
                                    const localImgs=[...document.images].filter(img=>{
                                      try {
                                        const u=new URL(img.src,location.href);
                                        return u.hostname===location.hostname;
                                      } catch(e) { return false; }
                                    });
                                    return {
                                      missing:localImgs.filter(x=>!x.complete||x.naturalWidth===0).map(x=>x.src),
                                    };
                                  }""")
                                  if result["missing"]:
                                      failures.append(f"{label} {rel}: missing local images={len(result['missing'])}")
                              finally:
                                  page.close()
                      finally:
                          ctx.close()
              finally:
                  browser.close()
          if failures:
              raise SystemExit("Old-site browser smoke failed:\n"+"\n".join(failures))
          print("Old-site browser smoke: PASS")
          PY
