name: Remaining FEM Formula Reaudit

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/remaining-fem-formula-reaudit.yml'
      - '.document/formula_reviews/remaining_fem_formulas.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build strict page
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg=json.loads(Path('.document/formula_reviews/remaining_fem_formulas.json').read_text(encoding='utf-8'))

          parts=[
            '<!doctype html><html lang="ja"><head><meta charset="utf-8">',
            '<meta name="viewport" content="width=device-width,initial-scale=1">',
            '<title>Remaining FEM strict formula re-audit</title>',
            '<style>body{font-family:Arial,"Yu Gothic",sans-serif;margin:20px}.formula-pair{border-top:1px solid #bbb;padding:18px 0}.pair-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}.source,.render{min-width:0;overflow-x:auto;padding:10px;border:1px solid #ddd}.source img{display:block;max-width:100%;height:auto;margin:auto}.render mjx-container[display="true"]{margin:.4em 0!important;text-align:left!important}.formula-rich-inner p{margin:.45em 0}@media(max-width:900px){.pair-grid{grid-template-columns:1fr}}</style>',
            '<script>window.MathJax={output:{displayOverflow:"linebreak",linebreaks:{inline:false,width:"100%"}}};</script>',
            '<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>',
            '</head><body><h1>Remaining FEM strict source-image re-audit</h1>'
          ]

          count=0
          for pdef in cfg['pages']:
            key=Path(pdef['page']).stem
            imgdir=pdef['image_dir'].split('/',1)[1]
            parts.append(f'<h2>{pdef["page"]}</h2>')
            for item in pdef['formulas']:
              n=item['image'][5:8]
              ident=f'{key}-{n}'
              src=f'./../img/{imgdir}/{item["image"]}'
              rendered=item['html'] if item['type']=='rich' else item['latex']
              parts += [
                f'<section class="formula-pair" id="formula-{ident}"><h3>{ident} ({item["type"]})</h3><div class="pair-grid">',
                f'<div class="source"><img src="{src}" alt="source {ident}"></div>',
                f'<div class="render" data-source-image="{src}">{rendered}</div>',
                '</div></section>'
              ]
              count+=1
          if count!=11:
              raise RuntimeError(f'formula count {count} != 11')
          parts += ['</body></html>']
          Path('fem/remaining_fem_reaudit.html').write_text('\n'.join(parts)+'\n',encoding='utf-8')
          PY

      - name: Install browser
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium

      - name: Start server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/remfem-http.log 2>&1 &
          sleep 1

      - name: Capture pairs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageDraw
          from playwright.sync_api import sync_playwright

          cfg=json.loads(Path('.document/formula_reviews/remaining_fem_formulas.json').read_text(encoding='utf-8'))
          specs=[]
          for pdef in cfg['pages']:
            key=Path(pdef['page']).stem
            for item in pdef['formulas']:
              n=item['image'][5:8]
              specs.append((key,n,f'{key}-{n}'))

          root=Path.cwd(); out=root/'remaining-fem-pass2'
          for s in ('sources','renders','pairs'):
            (out/s).mkdir(parents=True,exist_ok=True)
          manifest={'formulas':[]}

          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            ctx=b.new_context(viewport={'width':2200,'height':1600},device_scale_factor=1)
            pg=ctx.new_page()
            pg.goto('http://127.0.0.1:8000/fem/remaining_fem_reaudit.html',
                    wait_until='domcontentloaded',timeout=120000)
            pg.wait_for_function(
                '() => window.MathJax && MathJax.startup && MathJax.startup.promise',
                timeout=60000)
            pg.evaluate('async()=>{await MathJax.startup.promise;}')
            pg.wait_for_timeout(600)

            for key,n,ident in specs:
              sec=pg.locator(f'#formula-{ident}')
              r=sec.locator('.render')
              simg=sec.locator('.source img')
              containers=r.locator('mjx-container').count()
              merrors=r.locator('mjx-merror').count()
              if containers<1 or merrors:
                print(ident,'containers',containers,'merror',merrors)
                if merrors:
                  print(r.locator('mjx-merror').all_inner_texts())
                raise RuntimeError(f'{ident} MathJax error')

              dims=r.evaluate('(e)=>({clientWidth:e.clientWidth,scrollWidth:e.scrollWidth})')
              rp=out/'renders'/f'{ident}.png'
              r.screenshot(path=str(rp),animations='disabled')

              sp=(root/'fem'/simg.get_attribute('src')).resolve()
              im=Image.open(sp).convert('RGBA')
              bg=Image.new('RGBA',im.size,'white'); bg.alpha_composite(im)
              src=bg.convert('RGB')
              scale=4 if src.width<900 else 2
              src=src.resize((src.width*scale,src.height*scale),Image.Resampling.LANCZOS)
              src.save(out/'sources'/f'{ident}.png')

              rr=Image.open(rp).convert('RGB')
              margin,label,gap=16,28,24
              w=max(src.width,rr.width)+2*margin
              h=2*margin+2*label+gap+src.height+rr.height
              canvas=Image.new('RGB',(w,h),'white')
              d=ImageDraw.Draw(canvas); y=margin
              d.text((margin,y),f'SOURCE {ident}',fill='black'); y+=label
              canvas.paste(src,(margin,y)); y+=src.height+gap
              d.text((margin,y),f'MATHJAX/HTML {ident}',fill='black'); y+=label
              canvas.paste(rr,(margin,y))
              canvas.save(out/'pairs'/f'{ident}.png')

              manifest['formulas'].append({
                'id':ident,
                'horizontal_overflow':dims['scrollWidth']>dims['clientWidth']+1,
                'dims':dims
              })
            b.close()

          manifest['count']=len(manifest['formulas'])
          (out/'manifest.json').write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: remaining-fem-pass2
          path: remaining-fem-pass2
          retention-days: 7

      - name: Commit strict page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fem/remaining_fem_reaudit.html
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'docs: build remaining FEM strict reaudit page'
            git pull --rebase origin develop
            git push origin HEAD:develop
          fi
