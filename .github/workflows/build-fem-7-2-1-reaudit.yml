name: Build FEM 7.2.1 Reaudit

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/build-fem-7-2-1-reaudit.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Build strict reaudit HTML from audited LaTeX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def extract_formulas(path):
              text = Path(path).read_text(encoding='utf-8')
              heads = list(re.finditer(r'^## image(\d{3})(?:[^\n]*)\n', text, re.M))
              out = {}
              for i,m in enumerate(heads):
                  n = m.group(1)
                  end = heads[i+1].start() if i+1 < len(heads) else len(text)
                  sec = text[m.end():end]
                  cm = re.search(r'```latex\n(.*?)\n```', sec, re.S)
                  if cm:
                      out[n] = cm.group(1).strip()
              return out

          formulas = extract_formulas('.document/formula_reviews/fem_7_2_1_retranscription.md')
          formulas.update(extract_formulas('.document/formula_reviews/fem_7_2_1_hold_resolution.md'))
          expected = [f'{i:03d}' for i in range(1,21)]
          missing = [n for n in expected if n not in formulas]
          if missing:
              raise SystemExit(f'missing audited formulas: {missing}')

          src_path = Path('fem/fem_7_2_1_mathjax_audit.html')
          html = src_path.read_bytes().decode('cp932')

          for n in expected:
              open_pat = re.compile(rf'<div\b[^>]*\bid="formula-fem-7-2-1-{n}"[^>]*>', re.I)
              opens = list(open_pat.finditer(html))
              if len(opens) != 1:
                  raise SystemExit(f'formula opening tag not unique: {n}, found={len(opens)}')
              opening = opens[0].group(0)
              expected_img = f'../img/fem_d_mass_tet.files/image{n}.png'
              if f'data-source-image="{expected_img}"' not in opening:
                  raise SystemExit(f'source image mismatch: {n}: {opening}')
              start = opens[0].start()
              body_start = opens[0].end()
              close = html.find('</div>', body_start)
              if close < 0:
                  raise SystemExit(f'closing div missing: {n}')
              replacement = opening + '\n' + formulas[n] + '\n</div>'
              html = html[:start] + replacement + html[close+6:]

          html = html.replace(
              '<p id="formula-conversion-note">数式はMathJaxで表示しています。変換前の数式画像は照合用としてリポジトリ内に保持しています。</p>',
              '<p id="formula-conversion-note"><strong>厳密再監査版:</strong> 元数式画像とPass 1照合済みの忠実LaTeXをMathJax表示しています。通常公開ページではありません。</p>',
              1
          )
          html = html.replace('<title>質量収支式の離散化（有限要素法）</title>', '<title>質量収支式の離散化（厳密再監査版）</title>', 1)

          out = Path('fem/fem_7_2_1_reaudit.html')
          out.write_bytes(html.encode('cp932'))
          built = out.read_bytes().decode('cp932')

          for n in expected:
              open_pat = re.compile(rf'<div\b[^>]*\bid="formula-fem-7-2-1-{n}"[^>]*>', re.I)
              m = open_pat.search(built)
              if not m:
                  raise SystemExit(f'built opening missing: {n}')
              close = built.find('</div>', m.end())
              body = built[m.end():close].strip()
              if body != formulas[n].strip():
                  raise SystemExit(f'latex mismatch after build: {n}')
              expected_img = f'../img/fem_d_mass_tet.files/image{n}.png'
              if f'data-source-image="{expected_img}"' not in m.group(0):
                  raise SystemExit(f'built source image mismatch: {n}')

          ids = re.findall(r'id="formula-fem-7-2-1-(\d{3})"', built)
          if ids != expected:
              raise SystemExit(f'formula id order mismatch: {ids}')
          print('Strict reaudit HTML: 20/20 formula blocks verified')
          PY

      - name: Commit reaudit HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fem/fem_7_2_1_reaudit.html
          git diff --cached --check
          git commit -m 'feat: build strict fem 7.2.1 reaudit page'
          git push origin HEAD:develop
