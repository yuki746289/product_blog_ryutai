name: Old Shared Asset Probe

on:
  push:
    branches: [develop]
    paths:
      - '.document/qa_trigger/old_shared_assets.trigger'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe legacy shared image URLs
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          urls=[
            "https://ryutai.ninja-web.net/img/shiki1.gif",
            "https://ryutai.ninja-web.net/img/shiki2.gif",
            "https://ryutai.ninja-web.net/img/mps_weight.files/image001.gif",
          ]
          failed=[]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 shared-asset-probe"})
                  with urllib.request.urlopen(req,timeout=20) as res:
                      data=res.read()
                      print(f"{res.status} bytes={len(data)} {url}")
                      if res.status != 200 or len(data)==0:
                          failed.append(url)
              except Exception as exc:
                  print(f"FAIL {url}: {type(exc).__name__}: {exc}")
                  failed.append(url)
          if failed:
              raise SystemExit("Missing shared assets: "+", ".join(failed))
          print("Old shared asset probe: PASS")
          PY
