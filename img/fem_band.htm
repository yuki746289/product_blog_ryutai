<p class=MsoNormal><span lang=EN-US>&nbsp;</span></p>

<p class=MsoNormal><span lang=EN-US>&nbsp;</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>　・バンド幅の最適化</span></p>

<p class=MsoNormal><span lang=EN-US>&nbsp;</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>有限要素法では、最終的に数千、数万オーダーの連立</span><span
lang=EN-US>1</span><span style='font-family:"ＭＳ 明朝"'>次方程式を解くことになる。</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>ここで、バンド幅をできるだけ小さくすれば、より計算量を小さくすることができる。</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>バンド幅は、下図で表される。</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>　　</span><span lang=EN-US><img
width=486 height=394 src="fem_band.files/image001.gif"></span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>バンド幅とは行ごとの計算する必要のある変数の幅である。これは、節点番号の配置で異なる。</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>　　</span><span lang=EN-US><img
width=221 height=246 src="fem_band.files/image002.gif"></span><span
style='font-family:"ＭＳ 明朝"'>　　</span><span lang=EN-US><img width=221
height=246 src="fem_band.files/image003.gif"></span></p>

<p class=MsoNormal><span lang=EN-US>&nbsp;</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>上図の様にできるだけ近い節点には近い番号を割り振るとバンド幅が小さくなる。</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>バンド幅の詳細は下図の様になる。</span></p>

<p class=MsoNormal><span lang=EN-US>&nbsp;</span></p>

<p class=MsoNormal><span lang=EN-US><img width=463 height=520
src="fem_band.files/image004.gif"></span></p>

<p class=MsoNormal><span lang=EN-US>&nbsp;</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>バンド幅が小さくなれば、下図の様により小さな行列式を解けばよいことになる。</span></p>

<p class=MsoNormal><span lang=EN-US><img width=406 height=449
src="fem_band.files/image005.gif"></span></p>

<p class=MsoNormal><span lang=EN-US>&nbsp;</span></p>
