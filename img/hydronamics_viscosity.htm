style='font-family:"ＭＳ 明朝"'>粘性力</span><span style='font-family:"ＭＳ 明朝"'>の簡単な説明</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>　　　流体には粘性力という力が働く。これは流体粒子間に働く摩擦力である。下図の様に粘性力によって、ある方向に流れている流体粒子の周囲の粒子がつられて同じ方向に流れ出す。</span></p>
