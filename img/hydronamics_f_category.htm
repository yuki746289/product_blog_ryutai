<p class=MsoNormal><span lang=EN-US style='font-family:"Times New Roman"'>&nbsp;</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>　　・力の種類</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>　　　流体に働く力は、応力</span><span
lang=EN-US style='font-family:"Times New Roman"'>[N/m<sup>2</sup>]</span><span
style='font-family:"ＭＳ 明朝"'>と体積力</span><span lang=EN-US style='font-family:
"Times New Roman"'>[N/m<sup>3</sup>]</span><span style='font-family:"ＭＳ 明朝"'>に分けられる。</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>　　　応力</span><span
lang=EN-US style='font-family:"Times New Roman"'>[N/m<sup>2</sup>]</span><span
style='font-family:"ＭＳ 明朝"'>は、単位面積当りに作用する力で流体粒子の表面に作用する。</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>　　　　</span><span
style='font-family:"ＭＳ 明朝";color:black'>慣性力、粘性力、圧力、表面張力　等</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝";color:black'>　　　がある。</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>　　　体積力</span><span
lang=EN-US style='font-family:"Times New Roman"'>[N/m<sup>3</sup>]</span><span
style='font-family:"ＭＳ 明朝"'>は、</span><span style='font-family:"ＭＳ 明朝"'>単位体積当りに作用する力で流体粒子全体に作用する。</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝"'>　　　　重力や燃焼・化学反応などによる体積膨張・発熱</span><span
style='font-family:"ＭＳ 明朝";color:black'>　等</span></p>

<p class=MsoNormal><span style='font-family:"ＭＳ 明朝";color:black'>　　　がある。</span></p>
