			<h2>力の種類</h2>
			<p>流体に働く力は、応力<span class="ft">[N/m<sup>2</sup>]</span>と
						体積力<span class="ft">[N/m<sup>3</sup>]</span>に分けられます。</p>
			<br>
			<p>応力</span><span class="ft">[N/m<sup>2</sup>]</span>は、単位面積当りに作用する力で流体粒子の表面に作用する。</p>
			<p>　　粘性力、圧力、表面張力　等</p>
			<br>
			<p>体積力<span class="ft">[N/m<sup>3</sup>]</span>は、単位体積当りに作用する力で流体粒子全体に作用する。</p>
			<p>　　重力による運動　等</p>
			<br>
			<p>これらの力を式で表し、収支を取ると運動量収支式が導出されます。</p>
			<br>
